    present.filter(c=>c !== KNOWN).map(c=>{
      const o = optLabel(c);
      return `<option value="${c}"${o.dis && c !== SIDE ? ' disabled' : ''}>${esc(o.t)}</option>`;
    }).join('');
  sdSel.value = SIDE;
  knSel.onchange = ()=>{
    KNOWN = knSel.value; saveLS(LS.known, KNOWN);
    if (SIDE === KNOWN){ SIDE = ''; saveLS(LS.side, SIDE); }
    render(true);
  };
  sdSel.onchange = ()=>{ SIDE = sdSel.value; saveLS(LS.side, SIDE); render(true); };
  const tl = f.querySelector('#tl');
  EX_TYPES.forEach(t=>{
    const on = TYPE_ON[t.id] !== false;
    const r = document.createElement('div'); r.className = 'rowcb';
    r.innerHTML = `<span class="cb${on?' on':''}">✓</span><div class="body"><div class="en">${esc(t.label)}</div><div class="hint" style="margin:2px 0 0">${esc(t.desc)}</div></div>`;
    r.onclick = ()=>{
      const real = EX_TYPES.filter(x=>x.id !== 'intro' && TYPE_ON[x.id] !== false);
      if (on && t.id !== 'intro' && real.length === 1){ toast('Keep at least one exercise'); return; }
      TYPE_ON[t.id] = !on; saveLS(LS.types, TYPE_ON); render(true);
    };
    tl.appendChild(r);
  });
  const wrap = f.querySelector('.wrap');
  const hs = document.createElement('div');
  hs.innerHTML = '<div class="sectionhead">Hints</div>';
  const hr = document.createElement('div'); hr.className = 'rowcb';
  hr.innerHTML = `<span class="cb${HINTS_ON?' on':''}">✓</span><div class="body"><div class="en">“What differs” hint</div><div class="hint" style="margin:2px 0 0">After a match exercise, shows the word that differs from the closest option (experimental)</div></div>`;
  hr.onclick = ()=>{ HINTS_ON = !HINTS_ON; saveLS(LS.hints, HINTS_ON); render(true); };
  hs.appendChild(hr); wrap.appendChild(hs);
  const dbg = document.createElement('div');
  dbg.innerHTML = '<div class="sectionhead">Levels (debug)</div>';
  ACTIVE.forEach(code=>{
    const mx = maxLevel(code), v = lv(code), pool = curChunk(code), cc = chunkCount(code, v.level);
    const d = document.createElement('div'); d.className = 'improw';
    d.innerHTML = `<div style="font-weight:800;margin-bottom:6px">${esc(LG(code).name)}</div>
      <div class="cnt" style="margin-bottom:8px">Now: Level ${v.level}${SUBS[v.sub]} · chunk ${v.chunk+1}/${cc} · ${pool.length - levelPending(code).length}/${pool.length} done · levels 1–${mx}</div>
      <div style="display:flex;gap:8px">
        <input class="field" type="number" min="1" max="${mx}" value="${v.level}" style="width:80px" title="level">
        <input class="field" type="number" min="1" value="${v.chunk+1}" style="width:80px" title="chunk">
        <select class="field" style="width:80px">${SUBS.map((s,i)=>`<option value="${i}"${i===v.sub?' selected':''}>${s}</option>`).join('')}</select>
        <button class="btn btn-blue btn-sm">Set</button>
      </div>`;
    d.querySelector('button').onclick = ()=>{
      const ins = d.querySelectorAll('input');
      const L = Math.max(1, Math.min(mx, parseInt(ins[0].value, 10) || 1));
      const C = Math.max(1, Math.min(chunkCount(code, L), parseInt(ins[1].value, 10) || 1));
      LEVELS[code] = { level:L, sub:parseInt(d.querySelector('select').value, 10) || 0, chunk:C-1, done:{} };
      normalizeLevel(code); saveLS(LS.levels, LEVELS);
      toast('Set to Level ' + lv(code).level + SUBS[lv(code).sub]); render(true);
    };
    dbg.appendChild(d);
  });
  const fg = document.createElement('button');
  fg.className = 'btn btn-ghost btn-sm'; fg.textContent = 'Forget seen introductions';
  fg.onclick = ()=>{ INTRO_SEEN = {}; saveLS(LS.intro, INTRO_SEEN); toast('Introductions will show again'); };
  dbg.appendChild(fg);
  const dt = document.createElement('div');
  dt.innerHTML = `<div class="sectionhead">Data</div>
    <div class="hint">Backup contains your library, progress, levels and settings. Importing replaces everything on this device.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-blue btn-sm" id="expData">⬇ Export my data</button><button class="btn btn-ghost btn-sm" id="impData">⬆ Import data</button></div>`;
  dt.querySelector('#expData').onclick = exportData;
  dt.querySelector('#impData').onclick = ()=>document.getElementById('dataInput').click();
  wrap.appendChild(dbg); wrap.appendChild(dt);
  f.querySelector('#backBtn').onclick = ()=>{ state.screen = 'home'; render(); };
  return f;
}

/* ==================== ADD LANGUAGE ==================== */
function genCode(code, hasTr){
  const L = LG(code), key = L.name.toLowerCase();
  const rep = {
    '__COMMENT__': hasTr ? 'three <p>:\n  //   p[0] English, p[1] transliteration, p[2] ' + L.name
                         : 'two <p>:\n  //   p[0] English, p[1] ' + L.name,
    '__MIN__': hasTr ? '3' : '2',
    '__TRLINE__': hasTr ? 'translit: ps[1].textContent.trim(),' : "translit: '',",
    '__IDX__': hasTr ? '2' : '1',
    '__KEY__': key,
  };
  let t = document.getElementById('codeTpl').textContent.replace(/^\n/, '');
  for (const k of Object.keys(rep)) t = t.split(k).join(rep[k]);
  return t;
}
function renderAddLang(){
  const f = document.createElement('div');
  const al = state.al;
  const codes = Object.keys(LANGS).sort((a,b)=>LANGS[a].name.localeCompare(LANGS[b].name));
  f.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="backBtn">←</button>
      <div style="font-weight:800;font-size:19px;flex:1">Add language</div>
    </div>
    <div class="wrap statwrap">
      <div class="sectionhead" style="margin-top:8px">Language</div>
      <select class="field" id="alLang">${codes.map(c=>`<option value="${c}"${c===al.lang?' selected':''}>${esc(LANGS[c].name)} — ${esc(LANGS[c].native)}</option>`).join('')}</select>
      <label class="chkrow"><input type="checkbox" id="alTr"${al.tr?' checked':''}> Source page has a transliteration line</label>
      <div class="sectionhead">Console code</div>
      <pre class="code" id="alCode"></pre>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <button class="btn btn-blue btn-sm" id="alCopy">Copy code</button>
        <button class="btn btn-ghost btn-sm" id="alImport">📂 Import file</button>
      </div>
      <div class="hint">The code copies a CSV to your clipboard. Save it as a .csv file, then tap Import.</div>
    </div>`;
  const code = f.querySelector('#alCode');
  const sync = ()=>{ code.textContent = genCode(al.lang, al.tr); };
  sync();
  f.querySelector('#backBtn').onclick = ()=>{ state.screen = 'store'; render(); };
  f.querySelector('#alLang').onchange = e=>{
    al.lang = e.target.value; al.tr = !!LG(al.lang).translit;
    f.querySelector('#alTr').checked = al.tr; sync();
  };
  f.querySelector('#alTr').onchange = e=>{ al.tr = e.target.checked; sync(); };
  f.querySelector('#alCopy').onclick = ()=>copyText(code.textContent).then(ok=>toast(ok ? 'Code copied ✓' : 'Copy failed'));
  f.querySelector('#alImport').onclick = ()=>document.getElementById('fileInput').click();
  return f;
}

/* ==================== IMPORT ==================== */
function openImport(parsed){
  openSheet((sh, close)=>{
    const codes = Object.keys(LANGS).sort((a,b)=>LANGS[a].name.localeCompare(LANGS[b].name));
    const lastImp = loadLS(LS.lastImp, 'de');
    sh.innerHTML = `<h3>Import</h3>
      <div class="hint">Duplicates (same sentence repeated in the file or already in your library)</div>
      <select class="field" id="impDup" style="margin-bottom:12px">
        <option value="skip">Skip duplicates — keep one</option>
        <option value="keep">Keep duplicates</option>
      </select>
      <div id="impList"></div>
      <div class="sheet-actions"><button class="btn btn-ghost" id="impC">Cancel</button><button class="btn btn-green" id="impOk">Import</button></div>`;
    const list = sh.querySelector('#impList');
    const rowsUI = parsed.map(p=>{
      const d = document.createElement('div'); d.className = 'improw';
      const sel = p.hint || lastImp;
      d.innerHTML = `<input class="field" value="${esc(p.name)}">
        <select class="field lsel">${codes.map(c=>`<option value="${c}"${c===sel?' selected':''}>${esc(LANGS[c].name)} — ${esc(LANGS[c].native)}</option>`).join('')}</select>
        <select class="field gsel"></select>
        <div class="cnt">${p.rows.length ? p.rows.length + ' sentences' + (p.hint ? '' : ' · language not detected, check it') : 'No sentences found — skipped'}</div>
        <div class="cnt" data-note style="margin-top:4px"></div>`;
      list.appendChild(d);
      const r = { p, name:d.querySelector('input'), lang:d.querySelector('.lsel'), into:d.querySelector('.gsel'), note:d.querySelector('[data-note]') };
      const upd = ()=>{
        if (!p.rows.length){ r.note.textContent = ''; return; }
        const keys = new Set(p.rows.map(x=>enKey(x.english))), out = [];
        for (const L of Object.keys(EN_IDX)){
          if (L === r.lang.value) continue;
          let m = 0; keys.forEach(k=>{ if (EN_IDX[L].has(k)) m++; });
          const dn = Math.min(keys.size, EN_IDX[L].size);
          if (dn && m/dn >= COMPAT_MIN) out.push(LG(L).name + ' ' + Math.round(m/dn*100) + '%');
        }
        r.note.textContent = out.length ? 'Same sentences (by English) as: ' + out.join(', ') + ' — usable as translation language' : 'No library language shares these English sentences';
      };
      const fillInto = ()=>{
        const gs = LIB.groups.filter(g=>g.lang === r.lang.value);
        r.into.innerHTML = '<option value="">＋ New group</option>' + gs.map(g=>`<option value="${g.id}">Into: ${esc(g.name)} (${g.items.length})</option>`).join('');
        r.name.style.display = '';
      };
      r.lang.onchange = ()=>{ fillInto(); upd(); };
      r.into.onchange = ()=>{ r.name.style.display = r.into.value ? 'none' : ''; };
      fillInto(); upd();
      return r;
    });
    sh.querySelector('#impC').onclick = close;
    sh.querySelector('#impOk').onclick = ()=>{
      const keep = sh.querySelector('#impDup').value === 'keep';
      const taken = new Set(BY_UID.keys());
      let g = 0, n = 0, sk = 0;
      for (const r of rowsUI){
        if (!r.p.rows.length) continue;
        const lang = r.lang.value;
        const res = importItems(r.p.rows, lang, keep, taken);
        sk += res.skipped;
        if (!res.items.length) continue;
        res.items.forEach(s=>taken.add(s.uid));
        const dest = r.into.value ? getGroup(r.into.value) : null;
        if (dest) dest.items.push(...res.items);
        else LIB.groups.push({ id:gid(), name:r.name.value.trim() || r.p.name, lang, items:res.items });
        if (!ACTIVE.includes(lang)) ACTIVE.push(lang);
        saveLS(LS.lastImp, lang);
        g++; n += res.items.length;
      }
      close();
      if (!g){ toast(sk ? 'All ' + sk + ' were duplicates — nothing imported' : 'No sentences found'); return; }
      saveLS(LS.langs, ACTIVE);
      state.screen = 'home'; state.selMode = false;
      afterLibChange();
      toast('Imported ' + n + ' sentences' + (sk ? ' · ' + sk + ' duplicates skipped' : '') + ' ✓');
    };
  });
}
document.getElementById('fileInput').addEventListener('change', async e=>{
  const files = [...(e.target.files || [])]; e.target.value = '';
  if (!files.length) return;
  const parsed = [];
  for (const f of files){
    const txt = (await f.text()).replace(/^\uFEFF/, '');
    const r = parseAny(txt);
    parsed.push({ name:f.name.replace(/\.[^.]+$/, ''), rows:r.rows, hint:r.hint });
  }
  openImport(parsed);
});

/* ==================== UTIL + BOOT ==================== */
function download(name, text, type){
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function boot(){
  backupOnce();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  const saved = loadLS(LS.lib, null);
  if (saved && Array.isArray(saved.groups)) LIB = saved;
  else {
    const r = buildInitialLib();
    LIB = r.lib;
    saveLib();
  }
  try {
    if (!localStorage.getItem('arTrainer:oneBatch')){
      const gs = LIB.groups;
      if (gs.length === 20 && gs.every(g=>g.lang === 'ar' && g.items.length === 25)){
        LIB.groups = oneGroup(gs.flatMap(g=>g.items), 'ar'); saveLib();
      }
      localStorage.setItem('arTrainer:oneBatch', '1');
    }
  } catch(e){}
  sanitizeActive();
  rebuild();
  migrateLegacy();
  try {
    if (localStorage.getItem(LS.intro) === null){
      for (const a of ATTEMPTS) INTRO_SEEN[a.id] = 1;
      saveLS(LS.intro, INTRO_SEEN);
    }
  } catch(e){}
  if (STATS.lastDay && STATS.lastDay !== todayStr()){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    if (STATS.lastDay !== y) STATS.streak = 0;
  }
  render();
}
boot();

</script>
