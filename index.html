/* Phone back button: moves between screens instead of closing the app */
function wantDepth(){
  if (state.screen === 'home' || state.screen === 'onboard') return 0;
  if (state.screen === 'deckopts') return 2;
  if (state.screen === 'lesson') return (state.sess && (state.sess.from === 'group' || state.sess.from === 'flags')) ? 2 : 1;
  return 1;
}
function syncHistory(){
  if (ign > 0) return;
  const want = wantDepth();
  try {
    if (histDepth < want){ while (histDepth < want){ histDepth++; history.pushState({ d:histDepth }, ''); } }
    else if (histDepth > want){ const n = histDepth - want; histDepth = want; ign++; history.go(-n); }
  } catch(e){ ign = 0; }
}
window.addEventListener('popstate', ()=>{
  if (ign > 0){ ign--; if (ign === 0) syncHistory(); return; }
  if (sheetOn){ sheetOn = false; removeSheetDom(); return; }
  if (histDepth > 0){
    histDepth--;
    if (state.screen === 'lesson') exitSession();
    else if (state.screen === 'store'){ state.screen = 'addlang'; render(); }
    else if (state.screen === 'deckopts'){ state.screen = state.deckBack || 'settings'; render(); }
    else if (state.screen === 'gloss'){ state.screen = 'settings'; render(); }
    else { state.screen = 'home'; render(); }
  }
});

      else startSession(g.items, g.name, 'home');
    };

  f.querySelector('#loadBtn').onclick = ()=>document.getElementById('fileInput').click();
  f.querySelector('#allBtn').onclick = ()=>startSession(items, 'Practice all', 'home');
  f.querySelector('#revBtn').onclick = ()=>{
    const counts = {};
    for (const a of ATTEMPTS) if (!a.correct) counts[a.id] = (counts[a.id]||0) + 1;
    const ids = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    const its = ids.map(id=>BY_UID.get(id)).filter(s=>s && ACTIVE.includes(s.lang)).slice(0,20);
    if (!its.length){ toast('No mistakes recorded yet 🎉'); return; }

  };
  f.querySelector('#flagBtn').onclick = ()=>{ state.screen = 'flags'; render(); };
  f.querySelector('#statBtn').onclick = ()=>{ state.screen = 'stats'; render(); };
  f.querySelector('#setBtn').onclick = ()=>{ state.screen = 'settings'; render(); };
  f.querySelector('#notesBtn').onclick = ()=>{ state.screen = 'notes'; render(); };
  f.querySelector('#kwBtn').onclick = ()=>{ state.kwBack = 'home'; state.screen = 'known'; render(); };
  if (f.querySelector('#glBtn')) f.querySelector('#glBtn').onclick = ()=>{ state.screen = 'gloss'; render(); };
  f.querySelectorAll('[data-lv]').forEach(b=>{ b.onclick = ()=>startLevel(b.getAttribute('data-lv')); });
  const tb = f.querySelector('#tashBtn');
  if (tb) tb.onclick = ()=>{ SHOW_TASHKIL = !SHOW_TASHKIL; saveTashkil(); render(true); toast(SHOW_TASHKIL ? 'Tashkīl on' : 'Tashkīl off'); };

  const st = f.querySelector('#selToggle');
  if (st) st.onclick = ()=>{ state.selMode = !state.selMode; state.sel.clear(); render(true); };
  const sa = f.querySelector('#selAll');
  if (sa) sa.onclick = ()=>{ state.sel = state.sel.size === groups.length ? new Set() : new Set(groups.map(g=>g.id)); render(true); };

  const selGs = ()=>[...state.sel].map(getGroup).filter(Boolean);
  const q = id=>f.querySelector(id);
  if (q('#sPractice')) q('#sPractice').onclick = ()=>{ const gs = selGs(); startSession(gs.flatMap(g=>g.items), gs.length === 1 ? gs[0].name : gs.length + ' groups', 'home'); };
  if (q('#sCopy')) q('#sCopy').onclick = ()=>{
    const gs = selGs(), lang = singleLang(gs); if (!lang) return;
    chooseTarget({ title:'Copy ' + gs.length + ' group' + (gs.length>1?'s':'') + ' to…', lang, exclude:gs.map(g=>g.id), dup:true, onPick:t=>transferGroups(gs, t, false) });
  };
  if (q('#sMove')) q('#sMove').onclick = ()=>{
    const gs = selGs(), lang = singleLang(gs); if (!lang) return;
    chooseTarget({ title:'Move ' + gs.length + ' group' + (gs.length>1?'s':'') + ' to…', lang, exclude:gs.map(g=>g.id), onPick:t=>transferGroups(gs, t, true) });
  };

  return f;
}

  q('#gSplit').onclick = ()=>openSplit(g);
  q('#gLang').onclick = ()=>openLangPicker(g);

  q('#gDel').onclick = ()=>deleteGroups([g]);
  if (q('#gAll')) q('#gAll').onclick = ()=>{
    if (ss.size === g.items.length) ss.clear(); else g.items.forEach(s=>ss.add(s.uid));

function renderLesson(){
  const f = document.createElement('div');
  const s = state.sess, ex = state.ex, L = LG(ex.lang);
  const pct = sessPct();

  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = `
    <button class="iconbtn" id="quitBtn" title="Finish">✕</button>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <span class="pill">⭐ ${state.xp}</span>`;
  f.appendChild(top);

  const wrap = document.createElement('div');
  wrap.className = 'exwrap';

  const KN = ex.kLang === 'en' ? 'English' : LG(ex.kLang).name;
  const instruction = {
    'bank-fl':'Build the ' + L.name + ' sentence',
    'choice-fl':'Choose the ' + L.name + ' translation',
    'type-en':'Translate to English',
    'choice-en':'Choose the ' + KN + ' translation',
    'bank-en':'Build the ' + KN + ' sentence',
    'match-en':'Pick the matching ' + KN + ' sentence',
    'match-fl':'Pick the matching ' + L.name + ' sentence',
    'intro':'New sentence',
  }[ex.type] || 'Translate';

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<h2>${esc(instruction)}</h2>`;
  const flag = document.createElement('button');
  flag.className = 'flagbtn' + (state.flagged?' on':'');
  flag.title = 'Flag this sentence (unsure?)';
  flag.textContent = '🚩';
  flag.onclick = ()=>{
    if (state.flagged){ delete FLAGS[ex.sent.uid]; state.flagged = false; toast('Flag removed'); }
    else { FLAGS[ex.sent.uid] = Date.now(); state.flagged = true; toast('Flagged 🚩'); }
    saveFlags(); flag.classList.toggle('on', state.flagged);
  };
  const tools = document.createElement('div'); tools.className = 'qtools';
  const trB = document.createElement('button'); trB.className = 'flagbtn notebtn'; trB.title = 'Edit the translation shown (only for this sentence)'; trB.textContent = '🔤';
  trB.onclick = ()=>openTransEditor(state.cur.sent);
  const addN = document.createElement('button'); addN.className = 'flagbtn notebtn'; addN.title = 'Add a note'; addN.textContent = '✎';
  addN.onclick = ()=>openNoteEditor({ sent:ex.sent });
  const NV_NEXT = { off:'hl', hl:'list', list:'off' };
  const NV_TIP = { off:'Notes hidden', hl:'Highlights only', list:'Highlights + notes list' };
  let showN = null;
  if (HL_ON){                                   // when the highlight system is off in Settings, the button would do nothing: hide it
    showN = document.createElement('button');
    showN.className = 'flagbtn notebtn nv-' + NOTES_VIEW; showN.textContent = '👁';
    showN.title = NV_TIP[NOTES_VIEW] + ' — tap for: ' + NV_TIP[NV_NEXT[NOTES_VIEW]];
    showN.onclick = ()=>{ NOTES_VIEW = NV_NEXT[NOTES_VIEW]; saveLS(LS.notesShow, NOTES_VIEW); toast(NV_TIP[NOTES_VIEW]); render(true); };
  }
  const gradeB = document.createElement('button');
  gradeB.className = 'flagbtn notebtn gradebtn' + (autoGrade() ? ' on' : '');
  gradeB.title = 'Grading: ' + (autoGrade() ? 'automatic (the app decides)' : 'self (you decide)') + ' — tap to switch';
  gradeB.textContent = autoGrade() ? 'Auto' : 'Self';
  gradeB.onclick = ()=>{ GRADE_MODE = autoGrade() ? 'self' : 'auto'; saveLS(LS.grade, GRADE_MODE); toast(autoGrade() ? 'Automatic grading' : 'Self-rating'); render(true); };
  tools.appendChild(trB); tools.appendChild(addN); if (showN) tools.appendChild(showN); tools.appendChild(gradeB); tools.appendChild(flag);
  head.appendChild(tools);
  wrap.appendChild(head);

  if (ex.type === 'intro'){
    wrap.appendChild(buildIntro());
    if (DEBUG_ON) wrap.appendChild(dbgPanel());
    f.appendChild(wrap); f.appendChild(buildFooter());
    setTimeout(()=>{ const q = f.querySelector('#quitBtn'); if (q) q.onclick = exitSession; }, 0);
    return f;
  }
  if (ex.prompt){
    const p = document.createElement('div');
    p.style.margin = '0 0 18px';

      if (ex.sent.transliteration) html += `<div class="translit">${esc(ex.sent.transliteration)}</div>`;
      html += notesStripHTML(ex.sent.target, ex.lang);
      p.innerHTML = html;
    } else {
      p.innerHTML = knBlock(ex.sent, 26, true);
    }
    wrap.appendChild(p);

  if (isBank(ex.type)) wrap.appendChild(buildBankUI());
  else if (ex.type === 'type-en') wrap.appendChild(buildTypeUI());

  if (DEBUG_ON) wrap.appendChild(dbgPanel());

  f.appendChild(wrap);
  f.appendChild(buildFooter());
  setTimeout(()=>{ const q = f.querySelector('#quitBtn'); if (q) q.onclick = exitSession; }, 0);

}

function buildBankUI(){
  const ex = state.ex;
  const aLang = ex.answerLang === 'fl' ? ex.lang : ex.kLang;
  const cls = kcls(aLang);
  const rtl = !!LG(aLang).rtl;
  const box = document.createElement('div');
  const zone = document.createElement('div');
  zone.className = 'answerzone' + (rtl?' rtl':'') + (state.answer.length?' filled':'');
  if (!state.answer.length){
    zone.innerHTML = `<div class="placeholder">Tap the words below…</div>`;
  } else {
    state.answer.forEach((tok, i)=>{
      const c = document.createElement('button');
      c.className = 'chip flat ' + cls;
      c.innerHTML = flHTML(displayWord(tok, aLang), aLang);
      if (!state.feedback){
        c.onclick = ()=>{
          for (let bi=0; bi<ex.bank.length; bi++){
            if (state.usedBank[bi] && ex.bank[bi] === tok){ state.usedBank[bi] = false; break; }
          }
          state.answer.splice(i,1);
          render(true);
        };
      }
      zone.appendChild(c);
    });
  }
  box.appendChild(zone);
  const bank = document.createElement('div');
  bank.className = 'bank' + (rtl?' rtl':'');
  ex.bank.forEach((tok, i)=>{
    const c = document.createElement('button');
    c.className = 'chip ' + cls + (state.usedBank[i]?' used':'');
    c.innerHTML = flHTML(displayWord(tok, aLang), aLang);
    c.onclick = ()=>{ state.usedBank[i] = true; state.answer.push(tok); render(true); };
    bank.appendChild(c);
  });
  box.appendChild(bank);
  return box;
}

function buildTypeUI(){
  const box = document.createElement('div');
  const ta = document.createElement('input');
  ta.type = 'text';
  ta.className = 'typein';
  ta.placeholder = 'Type the English translation…';
  ta.autocomplete = 'off'; ta.autocapitalize = 'off'; ta.spellcheck = false;
  ta.value = state.answer || '';
  ta.disabled = !!state.feedback;
  ta.oninput = ()=>{ state.answer = ta.value; syncFooter(); };
  ta.onkeydown = e=>{ if (e.key === 'Enter' && canSubmit() && !state.feedback) submit(); };
  box.appendChild(ta);
  setTimeout(()=>{ if (!state.feedback) ta.focus(); }, 30);
  return box;
}

function buildChoiceUI(){
  const ex = state.ex;
  const box = document.createElement('div');
  const aLang = ex.answerLang === 'fl' ? ex.lang : ex.kLang;
  ex.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'choice' + (aLang === 'en' ? '' : ' ' + flc(aLang));
    const os = ex.answerLang === 'en' && ex.optSent ? ex.optSent[opt] : null;
    b.innerHTML = `<div>${flHTML(displayFlFromText(opt, aLang), aLang)}</div>${os ? sideHTML(os, false) : ''}`;
    if (state.answer === opt) b.classList.add('sel');
    if (state.feedback){
      b.disabled = true;
      b.classList.remove('sel');
      if (opt === ex.correct) b.classList.add('right');
      else if (opt === state.answer) b.classList.add(autoGrade() ? 'wrong' : 'sel');
    }
    else b.onclick = ()=>{ state.answer = opt; render(true); };
    box.appendChild(b);
  });
  return box;
}

function hintHTML(h){
  const L = LG(h.lang);
  const sp = (L.arf && h.a.fl.length === 1 && h.b.fl.length === 1) ? stemSplit(h.a.fl[0], h.b.fl[0]) : null;
  const row = (side, i)=>`<div class="hintrow"><span class="${flc(h.lang)}">${esc(sp ? sp[i] : side.fl.map(w=>displayWord(w, h.lang)).join(' '))}</span> <b>↔</b> <span class="${kcls(h.kLang)}">${esc(side.en.map(w=>displayWord(w, h.kLang)).join(' '))}</span></div>`;
  return `<div class="cmp-row"><div class="cmp-label">What differs from the closest option</div>${row(h.a,0)}${row(h.b,1)}</div>`;
}
function buildMatchCompare(){
  const ex = state.ex, sent = ex.sent, lang = ex.lang, ok = state.feedback.correct;
  const box = document.createElement('div'); box.className = 'compare';
  const given = state.answer || '', gFl = ex.answerLang === 'fl';
  const aLang = gFl ? lang : ex.kLang;
  let html = `<div class="cmp-row ${autoGrade() && ok ? 'good' : ''}"><div class="cmp-label">${autoGrade() ? 'Correct' : 'Answer'}</div>
    <div class="cmp-text ${flc(lang)}">${flHTML(displayFl(sent), lang)}</div>
    ${sent.transliteration ? `<div class="translit">${esc(sent.transliteration)}</div>` : ''}${notesStripHTML(sent.target, lang)}
    <div class="cmp-text ${kcls(kn(sent).lang)}">${esc(knText(sent))}</div>${sideHTML(sent, true)}${fbNote(sent)}</div>`;
  if (!autoGrade() || !ok) html += `<div class="cmp-row ${autoGrade() ? 'bad' : ''}"><div class="cmp-label">Your answer</div>
    <div class="cmp-text ${kcls(aLang)}">${flHTML(displayFlFromText(given, aLang), aLang)}</div></div>`;
  if (ex.hint && HINTS_ON) html += hintHTML(ex.hint);
  box.innerHTML = html; return box;
}
function buildIntro(){
  const ex = state.ex, s = ex.sent, L = LG(ex.lang);
  const box = document.createElement('div'); box.className = 'introcard';
  const aw = s.target.split(/\s+/).filter(Boolean), tw = (s.transliteration||'').split(/\s+/).filter(Boolean);
  let body;
  if (tw.length && tw.length === aw.length){
    body = `<div class="iwrap${L.rtl?' rtl':''}">${aw.map((w,i)=>`<div class="iw"><div class="w ${flc(ex.lang)}">${flHTML(displayWord(w, ex.lang), ex.lang)}</div><div class="translit">${esc(tw[i])}</div></div>`).join('')}</div>`;
  } else {
    body = `<div class="iwrap${L.rtl?' rtl':''}"><div class="iw"><div class="w ${flc(ex.lang)}">${flHTML(displayFl(s), ex.lang)}</div>${s.transliteration ? `<div class="translit">${esc(s.transliteration)}</div>` : ''}</div></div>`;
  }
  box.innerHTML = `<div class="introtag">New · you will see it once</div>${body}${notesStripHTML(s.target, ex.lang)}<div class="intro-en">${knBlock(s, 21, true)}</div>`;
  return box;
}
function buildCompare(){
  if (isMatch(state.ex.type)) return buildMatchCompare();
  const ex = state.ex;
  const isFl = ex.answerLang === 'fl';
  const aLang = isFl ? ex.lang : ex.kLang;
  const given = Array.isArray(state.answer) ? joinToks(state.answer, aLang) : (state.answer || '');
  const box = document.createElement('div');
  box.className = 'compare';
  const cls = kcls(aLang);

  let expectedHtml;
  if (isFl){
    expectedHtml = `<div class="cmp-text ${cls}">${flHTML(displayFl(ex.sent), ex.lang)}</div>`;
    if (ex.sent.transliteration) expectedHtml += `<div class="translit">${esc(ex.sent.transliteration)}</div>`;
    expectedHtml += notesStripHTML(ex.sent.target, ex.lang);
  } else {
    expectedHtml = `<div class="cmp-text ${cls}">${flHTML(displayFlFromText(ex.correct, aLang), aLang)}</div>${sideHTML(ex.sent, true)}${fbNote(ex.sent)}`;
  }
  let givenHtml;
  if (given){
    givenHtml = `<div class="cmp-text ${cls}">${flHTML(displayFlFromText(given, aLang), aLang)}</div>`;
  } else {
    givenHtml = `<div class="cmp-text ${cls} ${given?'':'empty'}">${given?esc(given):'(empty)'}</div>`;
  }
  box.innerHTML = `
    <div class="cmp-row">
      <div class="cmp-label">Expected</div>
      ${expectedHtml}
    </div>
    <div class="cmp-row ${autoGrade() ? (state.feedback.correct ? 'good' : 'bad') : ''}">
      <div class="cmp-label">Your answer</div>
      ${givenHtml}
    </div>`;
  return box;
}

function canSubmit(){
  const ex = state.ex; if (!ex) return false;
  if (isBank(ex.type)) return state.answer && state.answer.length > 0;
  if (ex.type === 'type-en') return !!(state.answer && state.answer.trim());
  return !!state.answer;
}

function buildFooter(){
  const f = document.createElement('div');
  f.className = 'footer';
  f.id = 'footer';
  const inner = document.createElement('div');
  inner.className = 'footer-inner';
  if (state.ex.type === 'intro'){
    inner.innerHTML = `<button class="btn btn-green" id="gotBtn" style="width:100%">Got it</button>`;
    setTimeout(()=>{ inner.querySelector('#gotBtn').onclick = introDone; }, 0);
  } else if (state.feedback && autoGrade()){
    const ok = state.feedback.correct, AP2 = ankiPreview();
    inner.innerHTML = `<div class="rate-title">${ok ? '<b style="color:var(--green-t)">✓ Correct</b>' : '<b style="color:var(--red-t)">✗ Not quite</b>'}${AP2 ? ' · next in ' + (ok ? AP2.good : AP2.again) : ''}</div>
      <button class="btn ${ok?'btn-green':'btn-red'}" id="contBtn" style="width:100%">Continue</button>`;
    setTimeout(()=>{ inner.querySelector('#contBtn').onclick = ()=>rate(state.feedback.correct); }, 0);
  } else if (state.feedback){
    const AP = ankiPreview();
    inner.innerHTML = `
      <div class="rate-title">Compare with the answer, then <b>rate yourself</b></div>
      <div class="rate-row">
        <button class="btn btn-red" id="wrongBtn">${AP ? '✗ Again · ' + AP.again : '✗ I was wrong'}</button>
        <button class="btn btn-green" id="rightBtn">${AP ? '✓ Good · ' + AP.good : '✓ I was right'}</button>
      </div>
      <div class="footer-hint">You decide — be honest.</div>`;
    setTimeout(()=>{
      inner.querySelector('#wrongBtn').onclick = ()=>rate(false);
      inner.querySelector('#rightBtn').onclick = ()=>rate(true);
    }, 0);
  } else {
    inner.innerHTML = `
      <div class="footer-row">
        <div class="sessmeta">${esc(sessMeta())}</div>
        <button class="btn btn-green" id="checkBtn" ${canSubmit()?'':'disabled'}>Check</button>
      </div>`;
    setTimeout(()=>{
      const cb = inner.querySelector('#checkBtn');
      if (cb) cb.onclick = ()=>submit();
    }, 0);
  }
  f.appendChild(inner);
  return f;
}

function syncFooter(){
  const cb = document.querySelector('#checkBtn');

}

function submit(){
  const ex = state.ex;
  if (!canSubmit()) return;
  let suggested = false;
  const givenStr = Array.isArray(state.answer) ? joinToks(state.answer, ex.answerLang === 'fl' ? ex.lang : ex.kLang) : (state.answer || '');
  if (ex.type === 'bank-fl'){
    suggested = normFl(givenStr, ex.lang) === normFl(ex.correct, ex.lang);
  } else if (ex.type === 'bank-en' || ex.type === 'type-en'){
    if (ex.kLang === 'en'){
      const g = normEn(givenStr), c = normEn(ex.correct);
      suggested = g === c || (lev(g,c) <= 2 && c.length > 10);
    } else suggested = normFl(givenStr, ex.kLang) === normFl(ex.correct, ex.kLang);
  } else {
    suggested = givenStr === ex.correct;
  }
  state.feedback = { correct:suggested, given:givenStr };
  render(true);
}

function rate(userSaysCorrect){
  const ex = state.ex, s = state.sess;
  const undoSnap = undoCapture();                        // everything this answer is about to change
  undoPush('Answer · ' + short(ex.sent.target, 18), ()=>undoRestoreAnswer(undoSnap), 'answer');
  if (UNDO.length){                                      // redo = give the same answer and the same rating again
    const a0 = JSON.parse(JSON.stringify(state.answer === undefined ? null : state.answer)), ub0 = state.usedBank ? state.usedBank.slice() : null, fb0 = Object.assign({}, state.feedback), ok0 = userSaysCorrect;
    UNDO[UNDO.length - 1].redo = ()=>{ state.answer = a0; state.usedBank = ub0; state.feedback = Object.assign({}, fb0); rate(ok0); };
  }
  const given = state.feedback.given;
  ATTEMPTS.push({
    t:Date.now(), id:ex.sent.uid, lang:ex.lang, type:ex.type,
    prompt: ex.prompt || ex.sent.target,
    expected: ex.correct, given,
    correct: !!userSaysCorrect,
    flagged: !!FLAGS[ex.sent.uid],
    autoSuggested: state.feedback.correct,
  });
  if (ATTEMPTS.length > 4000) ATTEMPTS = ATTEMPTS.slice(-4000);
  dbg('answer', (userSaysCorrect ? 'right' : 'wrong') + ' · ' + ex.type + ' · ' + short(ex.sent.target, 20) + ' (app thought: ' + (state.feedback.correct ? 'right' : 'wrong') + ', grading ' + GRADE_MODE + ')');
  saveAttempts();

  STATS.total = (STATS.total||0) + 1;
  state.session++; s.roundDone++;
  if (userSaysCorrect){
    STATS.correct = (STATS.correct||0) + 1;
    state.combo = (state.combo||0) + 1;
    const bonus = Math.min(5, state.combo);
    state.xp += 10 + bonus; STATS.xp = (STATS.xp||0) + 10 + bonus;
    state.correctSession++;
  } else {
    state.combo = 0;
    const at = Math.min(s.queue.length, Math.max(3, gapN() + 1));
    s.queue.splice(at, 0, { sent:ex.sent, forced:ex.type });
    dbg('retry', 'wrong → "' + short(ex.sent.target, 20) + '" comes back as ' + ex.type + ' after ' + at + ' card(s)', { uid:ex.sent.uid, at });
  }
  if (ankiActive(s) && state.cur){
    const kd = state.cur.kind, u = ex.sent.uid, sub = lv(s.lang).sub;
    if (kd === 'srs'){
      const cd = srsAnswer(u, userSaysCorrect);
      dbg('anki', 'review recorded: ' + (userSaysCorrect ? 'Good' : 'Again') + ' → ' + (cd.st === 'r' ? 'review, next in ' + cd.iv + ' day(s)' : 'learning, due in ' + srsFmt(cd.due - Date.now())), { uid:u, card:cd });
    } else if (kd === 'new'){
      if (sub === 0){ srsNoteNew(u); dbg('anki', 'new sentence started today (counts for the deck limit)', { uid:u }); }
      if (sub === 2){ const cd = srsGraduate(u, userSaysCorrect); dbg('anki', 'sentence finished its level cycle → enters spaced review (' + (cd.st === 'r' ? 'first review in ' + cd.iv + ' day(s)' : 'learning steps') + ')', { uid:u, card:cd }); }
    }
  }
  if (s.mode === 'level' && state.cur && state.cur.kind === 'new'){
    lv(s.lang).done[ex.sent.uid] = 1; saveLS(LS.levels, LEVELS);
    dbg('level', 'new sentence counted for the pass: ' + (ex.sent.uid) + ' → ' + (curChunk(s.lang).length - levelPending(s.lang).length) + '/' + curChunk(s.lang).length);
    if (advanceIfDone(s.lang)){ const v = lv(s.lang); dbg('level', 'pass finished → now level ' + v.level + SUBS[v.sub] + ' chunk ' + (v.chunk + 1)); fillLevelQueue(); }
  }
  touchStreak();
  saveStats();
  nextCard();
  render();
}

// Every .txt/.csv file placed in the repository's `languages` folder (or next to index.html) appears here automatically.
const STORE_REPO = '';   // optional override, e.g. 'user/repo'; empty = detected from the github.io address
const STORE_SKIP = /^(readme|license|licence|notice|robots|manifest)/i;
state.store = { status:'idle', packs:[], busy:{}, q:'' };
function storeRepo(){
  if (STORE_REPO) return STORE_REPO;
  const h = location.hostname;
  if (!/\.github\.io$/i.test(h)) return '';
  const owner = h.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return owner + '/' + ((seg && seg.indexOf('.') < 0) ? seg : owner + '.github.io');
}
async function listDir(repo, dir){
  const r = await fetch('https://api.github.com/repos/' + repo + '/contents/' + dir, { headers:{ Accept:'application/vnd.github+json' } });
  if (r.status === 404) return [];
  if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json();
  return Array.isArray(j) ? j.filter(x=>x.type === 'file') : [];
}
function openScrape(){ state.al.tr = !!LG(state.al.lang).translit; state.al.tab = 'store'; state.screen = 'addlang'; render(); if (state.store.status === 'idle') loadCatalog(); }
function openStore(){ state.al.tab = 'store'; state.screen = 'addlang'; render(); if (state.store.status !== 'ok') loadCatalog(); }
async function loadCatalog(){
  const st = state.store; st.status = 'loading';
  if (state.screen === 'addlang' || state.screen === 'store') render(true);
  try {
    const repo = storeRepo(); if (!repo) throw new Error('no repo');
    const [a, b] = await Promise.all([listDir(repo, 'languages'), listDir(repo, '')]);
    const seen = new Set(), packs = [];
    for (const f of a.concat(b)){
      if (!/\.(txt|csv)$/i.test(f.name) || STORE_SKIP.test(f.name)) continue;
      const stem = f.name.replace(/\.[^.]+$/, '').toLowerCase();
      if (seen.has(stem)) continue; seen.add(stem);
      packs.push({ id:stem, file:f.path, bytes:f.size, rev:f.sha });
    }
    st.packs = packs; st.status = 'ok';
  } catch(e){ st.status = 'error'; }
  if (state.screen === 'addlang' || state.screen === 'store') render(true);
}
// which language is this file? 1) header of the 4th column  2) file name  3) script of the text
function guessPackLang(text, stem){
  let hdr = null;
  try { hdr = rowsToItems(parseCSVRows(text)).hint; } catch(e){}
  return hdr || langFromName(stem) || parseAny(text).hint || null;
}
function askLang(stem){
  return new Promise(resolve=>{
    let done = false;
    const fin = v=>{ if (!done){ done = true; resolve(v); } };
    openSheet((sh, close)=>{
      const codes = Object.keys(LANGS).sort((a,b)=>LANGS[a].name.localeCompare(LANGS[b].name));
      sh.innerHTML = `<h3>Which language is “${esc(stem)}”?</h3>
        <select class="field" id="alSel">${codes.map(c=>`<option value="${c}">${esc(LANGS[c].name)} — ${esc(LANGS[c].native)}</option>`).join('')}</select>
        <div class="sheet-actions"><button class="btn btn-ghost" id="alC">Cancel</button><button class="btn btn-green" id="alOk">Add</button></div>`;
      sh.querySelector('#alC').onclick = ()=>{ close(); fin(null); };
      sh.querySelector('#alOk').onclick = ()=>{ const v = sh.querySelector('#alSel').value; close(); fin(v); };
      sh.parentNode.addEventListener('click', e=>{ if (e.target === sh.parentNode) fin(null); });
    });
  });
}
async function installPack(p){
  const st = state.store; if (st.busy[p.id]) return;
  st.busy[p.id] = true; render(true);
  try {
    const r = await fetch(new URL(p.file, location.href), { cache:'no-cache' });
    if (!r.ok) throw new Error('http ' + r.status);
    const text = (await r.text()).replace(/^\uFEFF/, '');
    const parsed = parseAny(text);
    if (!parsed.rows.length) throw new Error('empty');
    const dest = LIB.groups.find(g=>g.pack && g.pack.id === p.id);
    const lang = dest ? dest.lang : (guessPackLang(text, p.id) || await askLang(p.id));
    if (lang){
      const name = LG(lang).name;
      const wasEmpty = !LIB.groups.length;
      const res = importItems(parsed.rows, lang, false, new Set(BY_UID.keys()));
      if (!res.items.length && !dest){ toast('Already in your library'); }
      else {
        if (dest){ dest.items.push(...res.items); dest.pack = { id:p.id, rev:p.rev }; }
        else LIB.groups.push({ id:gid(), name, lang, items:res.items, pack:{ id:p.id, rev:p.rev } });
        ACTIVE = wasEmpty ? [lang] : (ACTIVE.includes(lang) ? ACTIVE : [...ACTIVE, lang]);
        saveLS(LS.langs, ACTIVE);
        afterLibChange((dest ? 'Update ' : 'Add ') + name);
        toast(dest ? (res.items.length ? 'Updated · ' + res.items.length + ' new' : 'Up to date') : name + ' added · ' + res.items.length + ' sentences');
      }
    }
  } catch(e){ toast("Couldn't download. Check your connection and try again."); }
  delete st.busy[p.id];
  if (state.screen === 'addlang' || state.screen === 'store') render(true);
}
function renderStore(){ state.al.tab = 'store'; return renderAddLang(); }
function storeListEl(){
  const f = document.createElement('div'), st = state.store;
  f.innerHTML = `<div class="hint" style="margin-top:6px">Tap <b>Get</b> to add a language. It is saved on this device and works offline.</div>

  const box = f.querySelector('#packs');

    };
    const qq = String(st.q || '').trim().toLowerCase();
    const shown = st.packs.filter(p=>{ if (!qq) return true; const lb = label(p); return (lb.name + ' ' + lb.native + ' ' + p.id).toLowerCase().includes(qq); });
    if (!shown.length) box.innerHTML = '<div class="empty">No language matches.</div>';
    shown.slice().sort((a,b)=>label(a).name.localeCompare(label(b).name)).forEach(p=>{
      const inst = LIB.groups.find(g=>g.pack && g.pack.id === p.id);
      const outdated = inst && p.rev && inst.pack.rev !== p.rev;
      const lb = label(p), busy = !!st.busy[p.id];
      const el = document.createElement('div'); el.className = 'deck'; el.style.cursor = 'default';
      el.innerHTML = `<div class="deck-ico">${esc((lb.code || p.id.slice(0,2)).toUpperCase())}</div>
        <div class="deck-body"><div class="deck-title">${esc(lb.name)}${lb.native && lb.native !== lb.name ? `<span class="lbadge" style="text-transform:none">${esc(lb.native)}</span>` : ''}</div>
        <div class="deck-sub">${p.bytes ? Math.max(1, Math.round(p.bytes/1024)) + ' KB' : ''}</div></div>
        <button class="btn ${inst && !outdated ? 'btn-ghost' : outdated ? 'btn-blue' : 'btn-green'} btn-sm" ${busy || (inst && !outdated) ? 'disabled' : ''}>${busy ? '…' : inst ? (outdated ? 'Update' : 'Added ✓') : 'Get'}</button>`;
      el.querySelector('button').onclick = ()=>installPack(p);
      box.appendChild(el);
    });
  }
  return f;
}

/* ==================== BACKUP ==================== */
function buildBackup(){
  const data = {};
  for (let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k.indexOf('arTrainer:') === 0 && k.indexOf('arTrainer:bak:') !== 0) data[k] = localStorage.getItem(k);
  }
  return JSON.stringify({ app:'arTrainer', version:1, exported:new Date().toISOString(), data });
}
function exportData(){
  const text = buildBackup(), name = 'language-trainer-backup-' + todayStr() + '.json';
  const file = new File([text], name, { type:'application/json' });
  if (navigator.canShare && navigator.canShare({ files:[file] }))
    navigator.share({ files:[file] }).catch(e=>{ if (!e || e.name !== 'AbortError') download(name, text, 'application/json'); });
  else download(name, text, 'application/json');
}
function restoreBackup(text){
  let obj;
  try { obj = JSON.parse(String(text).replace(/^\uFEFF/, '')); } catch(e){ return { ok:false, msg:'Not a valid backup file' }; }
  if (!obj || obj.app !== 'arTrainer' || !obj.data || typeof obj.data !== 'object') return { ok:false, msg:'Not a valid backup file' };
  const keys = Object.keys(obj.data).filter(k=>k.indexOf('arTrainer:') === 0 && k.indexOf('arTrainer:bak:') !== 0 && typeof obj.data[k] === 'string');
  if (!keys.length || keys.indexOf(LS.lib) < 0) return { ok:false, msg:'Backup has no library' };
  try { localStorage.setItem('arTrainer:bak:preimport', buildBackup()); } catch(e){}
  const old = [];
  for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k.indexOf('arTrainer:') === 0 && k.indexOf('arTrainer:bak:') !== 0) old.push(k); }
  old.forEach(k=>localStorage.removeItem(k));
  try { keys.forEach(k=>localStorage.setItem(k, obj.data[k])); }
  catch(e){ return { ok:false, msg:'Storage full — restore failed' }; }
  return { ok:true, msg:'Restored', date:(obj.exported||'').slice(0,10) };
}
document.getElementById('dataInput').addEventListener('change', async e=>{
  const f = (e.target.files || [])[0]; e.target.value = '';
  if (!f) return;
  const text = await f.text();
  let probe = null; try { probe = JSON.parse(text); } catch(err){}
  const when = probe && probe.exported ? probe.exported.slice(0,10) : 'unknown date';
  if (!probe || probe.app !== 'arTrainer'){ toast('Not a valid backup file'); return; }
  if (!confirm('Replace ALL data on this device with the backup from ' + when + '?')) return;
  const r = restoreBackup(text);
  if (!r.ok){ toast(r.msg); return; }
  try { location.reload(); } catch(err){ toast('Restored — reload the page'); }
});

      list.appendChild(d);
      const r = { p, name:d.querySelector('input'), lang:d.querySelector('.lsel'), into:d.querySelector('.gsel'), note:d.querySelector('[data-note]') };
      const upd = ()=>{
        if (!p.rows.length){ r.note.textContent = ''; return; }
        const keys = new Set(p.rows.map(x=>enKey(x.english))), out = [];
        for (const L of Object.keys(EN_IDX)){
          if (L === r.lang.value) continue;
          let m = 0; keys.forEach(k=>{ if (EN_IDX[L].has(k)) m++; });
          const dn = Math.min(keys.size, EN_IDX[L].size);
          if (dn && m/dn >= COMPAT_MIN) out.push(LG(L).name + ' ' + Math.round(m/dn*100) + '%');
        }
        r.note.textContent = out.length ? 'Same sentences (by English) as: ' + out.join(', ') + ' — usable as translation language' : 'No library language shares these English sentences';
      };
      const fillInto = ()=>{
        const gs = LIB.groups.filter(g=>g.lang === r.lang.value);
        r.into.innerHTML = '<option value="">＋ New group</option>' + gs.map(g=>`<option value="${g.id}">Into: ${esc(g.name)} (${g.items.length})</option>`).join('');
        r.name.style.display = '';
      };
      r.lang.onchange = ()=>{ fillInto(); upd(); };
      r.into.onchange = ()=>{ r.name.style.display = r.into.value ? 'none' : ''; };
      fillInto(); upd();
      return r;
    });
    sh.querySelector('#impC').onclick = close;
    sh.querySelector('#impOk').onclick = ()=>{
      const keep = sh.querySelector('#impDup').value === 'keep';
      const taken = new Set(BY_UID.keys());
      let g = 0, n = 0, sk = 0;
      for (const r of rowsUI){
        if (!r.p.rows.length) continue;
        const lang = r.lang.value;
        const res = importItems(r.p.rows, lang, keep, taken);
        sk += res.skipped;
        if (!res.items.length) continue;
        res.items.forEach(s=>taken.add(s.uid));
        const dest = r.into.value ? getGroup(r.into.value) : null;
        if (dest) dest.items.push(...res.items);
        else LIB.groups.push({ id:gid(), name:r.name.value.trim() || r.p.name, lang, items:res.items });
        if (!ACTIVE.includes(lang)) ACTIVE.push(lang);
        saveLS(LS.lastImp, lang);
        g++; n += res.items.length;
      }
      close();
      if (!g){ toast(sk ? 'All ' + sk + ' were duplicates — nothing imported' : 'No sentences found'); return; }
      saveLS(LS.langs, ACTIVE);
      state.screen = 'home'; state.selMode = false;
      afterLibChange('Import');
      toast('Imported ' + n + ' sentences' + (sk ? ' · ' + sk + ' duplicates skipped' : '') + ' ✓');
    };
  });
}

/* ---------- interface translation: exact-text lookup applied to the DOM (numbers become {n}) ---------- */
function uiStrings(){ const p = UI_PACKS[UI_LANG]; return UI_LANG === 'en' || !p ? null : (p.strings || {}); }
let UI_CACHE = null, UI_CACHE_LANG = '';
function uiPack(){ if (UI_CACHE_LANG !== UI_LANG || !UI_CACHE){ UI_CACHE = uiStrings(); UI_CACHE_LANG = UI_LANG; } return UI_CACHE; }
function uiPackReset(){ UI_CACHE = null; }
const uiRtl = ()=>UI_LANG !== 'en' && !!LG(UI_LANG).rtl;
let UI_NAME_RE = null;
function uiNameRe(){
  if (!UI_NAME_RE){
    const ns = ['English', ...Object.keys(LANGS).map(c=>LANGS[c].name)].filter((v, i, a)=>a.indexOf(v) === i).sort((a, b)=>b.length - a.length);
    UI_NAME_RE = new RegExp('\\b(' + ns.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'g');
  }
  return UI_NAME_RE;
}
function uiKey(s){
  const nums = [], names = [];
  const k = s.replace(/\d+/g, m=>{ nums.push(m); return '{n}'; }).replace(uiNameRe(), m=>{ names.push(m); return '{L}'; });
  return { k, nums, names };
}
function uiNames(){ return (UI_PACKS[UI_LANG] || {}).names || {}; }
function uiFill(tpl, nums, names){
  let i = 0, j = 0; const NM = names && names.length ? uiNames() : null;
  return tpl.replace(/\{n\}|\{L\}/g, m=>{
    if (m === '{n}') return nums[i++] !== undefined ? nums[i - 1] : '';
    const nm = names[j++]; return (NM && NM[nm]) || nm || '';
  });
}
function uiTr(raw){
  const P = uiPack(); if (!P) return null;
  const core = raw.trim(); if (!core) return null;
  const lead = raw.slice(0, raw.indexOf(core)), trail = raw.slice(raw.indexOf(core) + core.length);
  if (core === '←' && uiRtl()) return lead + '→' + trail;
  const { k, nums, names } = uiKey(core), v = P[k];
  if (v !== undefined && v !== '') return lead + uiFill(v, nums, names) + trail;
  if (/^\{L\}$/.test(k)) return lead + uiFill('{L}', nums, names) + trail;          // a bare language name
  if (core.indexOf(' · ') > 0){                       // "Level 1 · chunk 2/5 · …": translate the pieces
    let hit = false;
    const out = core.split(' · ').map(p=>{ const q = uiKey(p), x = P[q.k]; if (x !== undefined && x !== ''){ hit = true; return uiFill(x, q.nums, q.names); } if (q.k === '{L}'){ hit = true; return uiFill('{L}', q.nums, q.names); } return p; });
    if (hit) return lead + out.join(' · ') + trail;
  }
  return null;
}
const UI_SKIP = '.fl,.chip,.choice,.cmp-text,.intro-en,.sidetr,.translit,.answerzone,.typein,.ntline,.npat,.ntext,.nv-note,.nview b,.code,textarea,script,style,[data-notr]';
const UI_ORIG = new WeakMap();
function uiText(n){
  const cur = n.nodeValue; if (!cur || !cur.trim()) return;
  const o = UI_ORIG.get(n);
  if (o && o.shown === cur) return;                    // already translated by us
  const tr = uiTr(cur);
  if (tr !== null && tr !== cur){ UI_ORIG.set(n, { orig:cur, shown:tr }); n.nodeValue = tr; }
}
function uiAttrs(el){
  for (const a of ['placeholder', 'title', 'aria-label']){
    const v = el.getAttribute && el.getAttribute(a); if (!v) continue;
    const tr = uiTr(v); if (tr !== null && tr !== v) el.setAttribute(a, tr);
  }
}
function uiKids(el){
  uiAttrs(el);
  for (const c of Array.from(el.childNodes)){
    if (c.nodeType === 3) uiText(c);
    else if (c.nodeType === 1 && !c.matches(UI_SKIP)) uiKids(c);
  }
}
function uiWalk(root){
  if (!uiPack() && !uiRtl()) return;
  if (root.nodeType === 3){ if (!(root.parentElement && root.parentElement.closest(UI_SKIP))) uiText(root); return; }
  if (root.nodeType !== 1 || (root.closest && root.closest(UI_SKIP))) return;
  uiKids(root);
}
const UI_OBS = new MutationObserver(ms=>{
  if (!uiPack() && !uiRtl()) return;
  UI_OBS.disconnect();
  try {
    for (const m of ms){
      if (m.type === 'childList') m.addedNodes.forEach(uiWalk);
      else if (m.type === 'characterData') uiWalk(m.target);
      else if (m.type === 'attributes') uiAttrs(m.target);
    }
  } finally { UI_OBS.observe(document.body, UI_OBS_OPT); }
});
const UI_OBS_OPT = { childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['placeholder', 'title', 'aria-label'] };

}

state.kw = { lang:'', page:0, sel:new Set(), cache:{} };
function vocabFor(lang){
  const c = state.kw.cache[lang]; if (c) return c;
  const df = new Map();
  for (const s of langSentences(lang)){
    const seenHere = new Set();
    for (const w of wordsOfSentence(s)){
      const n = noteNorm(w, lang); if (!n || seenHere.has(n)) continue; seenHere.add(n);
      const e = df.get(n); if (e) e.n++; else df.set(n, { norm:n, disp:w, n:1, ex:s.english });
    }
  }
  const seen = SEEN_WORDS[lang];
  const list = [...df.values()].filter(e=>!(seen && seen.has(e.norm)) && !noteCovers(e.norm, lang));
  list.sort((a, b)=>(b.n - a.n) || (a.norm.length - b.norm.length));
  return state.kw.cache[lang] = list;
}

    b.onclick = ()=>{
      if (multi){ if (ob.learn.has(c)) ob.learn.delete(c); else ob.learn.add(c); b.classList.toggle('on'); }
      else { ob.native = c; box.querySelectorAll('.langopt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const n = document.getElementById('obNote'); if (n) n.textContent = (c !== 'en' && !hasUiPack(c)) ? 'If the repository has the menus in this language they are downloaded when you finish. Otherwise the app stays in English (Settings → Interface language).' : ''; }
    };
    box.appendChild(b);
  });
  if (!list.length) box.innerHTML = '<div class="empty">No language matches.</div>';
}
function presentCodes(){ return langsPresent().map(p=>p.code); }
function finishOnboarding(){
  const ob = state.ob;
  if (ob.native !== 'en' && hasUiPack(ob.native)) { UI_LANG = ob.native; saveLS(LS.ui, UI_LANG); applyUiLang(); }
  else if (ob.native !== 'en'){ const c0 = ob.native; fetchUiPack(c0).then(()=>setUiLang(c0)).catch(()=>{}); }
  else if (ob.native === 'en' && UI_LANG !== 'en'){ UI_LANG = 'en'; saveLS(LS.ui, 'en'); applyUiLang(); }
  const present = presentCodes(), want = [...ob.learn].filter(c=>c !== ob.native || c === 'en' ? true : true);
  const have = want.filter(c=>present.includes(c)), missing = want.filter(c=>!present.includes(c));
  if (have.length){ ACTIVE = have; saveLS(LS.langs, ACTIVE); }
  if (ob.native === 'en') KNOWN = 'en';
  else { const o = EN_IDX[ACTIVE[0]] ? langOption(ob.native) : { ok:false }; KNOWN = (present.includes(ob.native) && o.ok) ? ob.native : 'en'; }
  if (SIDE === KNOWN) SIDE = ''; saveLS(LS.known, KNOWN); saveLS(LS.side, SIDE);
  GRADE_MODE = ob.grade; saveLS(LS.grade, GRADE_MODE);
  ANKI_ON = ob.anki; saveLS(LS.anki, ANKI_ON);
  applyTheme(ob.theme); saveLS(LS.theme, ob.theme);
  ONB_DONE = true; saveLS(LS.onb, true);
  state.ob = null;
  if (missing.length){ state.store.q = LG(missing[0]).name; state.al.tab = 'store'; state.screen = 'addlang'; render(); if (state.store.status !== 'ok') loadCatalog(); toast('Get ' + missing.map(c=>LG(c).name).join(', ') + ' from “Ready-made”'); }
  else { state.screen = 'home'; render(); }
}
function renderOnboard(){
  const f = document.createElement('div'), ob = state.ob || (state.ob = newOb());
  const dots = Array.from({ length:OB_STEPS }, (_, i)=>`<i style="flex:1;height:5px;border-radius:3px;background:${i <= ob.step ? 'var(--accent,var(--green))' : 'var(--line)'}"></i>`).join('');
  f.innerHTML = `<div class="topbar"><div style="display:flex;gap:5px;flex:1">${dots}</div><button class="linkbtn" id="obSkip">Skip</button></div><div class="wrap obstep" id="obBody"></div>
    <div class="footer"><div class="footer-inner"><div class="footer-row">${ob.step > 0 ? '<button class="btn btn-ghost" id="obBack" style="flex:0 0 auto">←</button>' : ''}<button class="btn btn-green" id="obNext">${ob.step === OB_STEPS - 1 ? 'Finish' : 'Next'}</button></div></div></div>`;
  const q = s=>f.querySelector(s), body = q('#obBody');
  if (ob.step === 0){
    body.innerHTML = `<div class="hero"><h1>Welcome 👋</h1><p>Learn real sentences, step by step. A few questions to set the app up for you — you can change everything later in Settings.</p></div>
      <div class="introcard" style="margin-bottom:10px"><b>① Sentences, not lists.</b> You meet a sentence, build it, translate it, and rate yourself honestly.</div>
      <div class="introcard" style="margin-bottom:10px"><b>② Levels grow with you.</b> Short sentences first, then longer ones, in small chunks.</div>
      <div class="introcard"><b>③ Notes make words yours.</b> Tap ✎ in a lesson to save a word, a prefix or a suffix; words you know make the app skip the explanations.</div>`;
  } else if (ob.step === 1){
    body.innerHTML = `<div class="hero"><h1>Your language</h1><p>The language you speak. Sentences are explained in it when your library has that translation; otherwise in English.</p></div>
      <input class="field" id="obQ" placeholder="Search" value="${esc(ob.q)}"><div class="langgrid" id="obGrid"></div><div class="hint" id="obNote"></div>`;
    obLangGrid(ob, false, body.querySelector('#obGrid'));
    body.querySelector('#obQ').oninput = e=>{ ob.q = e.target.value; obLangGrid(ob, false, body.querySelector('#obGrid')); };
    body.querySelector('#obNote').textContent = (ob.native !== 'en' && !hasUiPack(ob.native)) ? 'If the repository has the menus in this language they are downloaded when you finish.' : '';
  } else if (ob.step === 2){
    body.innerHTML = `<div class="hero"><h1>What do you want to learn?</h1><p>Pick one or more. Languages that are not in your library yet are fetched from the ready-made list when you finish.</p></div>
      <input class="field" id="obQ" placeholder="Search" value="${esc(ob.q)}"><div class="langgrid" id="obGrid"></div>`;
    obLangGrid(ob, true, body.querySelector('#obGrid'));
    body.querySelector('#obQ').oninput = e=>{ ob.q = e.target.value; obLangGrid(ob, true, body.querySelector('#obGrid')); };
  } else if (ob.step === 3){
    body.innerHTML = `<div class="hero"><h1>How do you like to study?</h1></div>
      <div class="sectionhead">Answers</div><div id="obGrade"></div>
      <div class="sectionhead">Review</div><div id="obAnki"></div>
      <div class="sectionhead">Look</div><div class="themegrid" id="obTheme"></div>`;
    const row = (host, on, t, s, fn)=>{ const r = document.createElement('div'); r.className = 'rowcb'; r.innerHTML = `<span class="cb${on ? ' on' : ''}">✓</span><div class="body"><div class="en">${t}</div><div class="hint" style="margin:2px 0 0">${s}</div></div>`; r.onclick = fn; host.appendChild(r); };
    const paint = ()=>{
      const g = q('#obGrade'); g.innerHTML = '';
      row(g, ob.grade === 'self', 'Rate myself', 'You press right or wrong after seeing the answer (Anki style).', ()=>{ ob.grade = 'self'; paint(); });
      row(g, ob.grade === 'auto', 'Automatic', 'The app decides if the answer is right.', ()=>{ ob.grade = 'auto'; paint(); });
      const a = q('#obAnki'); a.innerHTML = '';
      row(a, ob.anki, 'Spaced repetition (Anki mode)', 'Sentences you finished come back after growing intervals.', ()=>{ ob.anki = !ob.anki; paint(); });
      const th = q('#obTheme'); th.innerHTML = '';
      THEMES.forEach(t=>{ const b = document.createElement('button'); b.type = 'button'; b.className = 'themecard' + (t.id === ob.theme ? ' on' : ''); b.innerHTML = `<span class="tsw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>${esc(t.name)}</b>`; b.onclick = ()=>{ ob.theme = t.id; applyTheme(t.id); paint(); }; th.appendChild(b); });
    };
    paint();
  } else {
    body.innerHTML = `<div class="hero"><h1>Do you already know some words?</h1><p>If you learned some of the language elsewhere, tell the app which words so it does not explain them again. It takes a minute and you can do it any time from Settings.</p></div>
      <button class="btn btn-blue" id="obKw">✅ Take the quick test after finishing</button>
      <div class="hint" style="margin-top:10px">Or just press Finish and start.</div>`;
    q('#obKw').onclick = ()=>{ ob.kw = !ob.kw; q('#obKw').textContent = ob.kw ? '✅ I will take the test' : '✅ Take the quick test after finishing'; };
  }
  q('#obNext').onclick = ()=>{
    if (ob.step === 2 && !ob.learn.size){ toast('Pick at least one language'); return; }
    if (ob.step === OB_STEPS - 1){ const kw = ob.kw; finishOnboarding(); if (kw && state.screen === 'home'){ state.kwBack = 'home'; state.screen = 'known'; render(); } return; }
    ob.step++; ob.q = ''; render();
  };
  if (q('#obBack')) q('#obBack').onclick = ()=>{ ob.step--; ob.q = ''; render(); };
  q('#obSkip').onclick = ()=>{ ONB_DONE = true; saveLS(LS.onb, true); state.ob = null; state.screen = 'home'; render(); };
  return f;
}

/* ==================== UTIL + BOOT ==================== */
function download(name, text, type){
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function boot(){
  applyTheme(THEME); applyCustomCss(); applyUiLang();
  backupOnce();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  const saved = loadLS(LS.lib, null);
  if (saved && Array.isArray(saved.groups)) LIB = saved;
  else {
    const r = buildInitialLib();
    LIB = r.lib;
    saveLib();
  }
  try {
    if (!localStorage.getItem('arTrainer:oneBatch')){
      const gs = LIB.groups;
      if (gs.length === 20 && gs.every(g=>g.lang === 'ar' && g.items.length === 25)){
        LIB.groups = oneGroup(gs.flatMap(g=>g.items), 'ar'); saveLib();
      }
      localStorage.setItem('arTrainer:oneBatch', '1');
    }
  } catch(e){}
  sanitizeActive();
  rebuild();
  migrateLegacy();
  libShadowRefresh();
  try {
    if (localStorage.getItem(LS.intro) === null){
      for (const a of ATTEMPTS) INTRO_SEEN[a.id] = 1;
      saveLS(LS.intro, INTRO_SEEN);
    }
  } catch(e){}
  buildNoteIdx(); rebuildSeen();
  if (!ONB_DONE && BETA.intro){                     // (beta feature, off by default) existing users are not interrupted; the introduction stays in Settings
    if (ATTEMPTS.length || NOTES.length || Object.keys(LEVELS).length){ ONB_DONE = true; saveLS(LS.onb, true); }
    else { state.ob = newOb(); state.screen = 'onboard'; }
  }
  if (STATS.lastDay && STATS.lastDay !== todayStr()){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    if (STATS.lastDay !== y) STATS.streak = 0;
  }
  render();
  UI_OBS.observe(document.body, UI_OBS_OPT);
  uiWalk(document.body);
}
boot();

</script>
