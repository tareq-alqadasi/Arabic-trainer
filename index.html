<!doctype html>
<html lang="en">
<head>

<title>Language Trainer</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--green:#58cc02;--green-d:#46a302;--green-l:#d7ffb8;--green-t:#2b6b00;
--blue:#1cb0f6;--blue-d:#1899d6;--blue-l:#ddf4ff;--red:#ff4b4b;--red-d:#ea2b2b;
--red-l:#ffdfe0;--red-t:#a30000;--gold:#ffc800;--gold-d:#e5a900;--amber:#ff9600;
--amber-l:#fff3d1;--bg:#fff;--bg2:#f7f7f7;--ink:#3c3c3c;--ink2:#777;--ink3:#afafaf;
--line:#e5e5e5;--line2:#d0d0d0;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.translit{font-size:13.5px;color:var(--ink2);font-style:italic;margin-top:5px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:20}
.iconbtn{background:none;border:none;font-size:22px;cursor:pointer;padding:0 6px;color:var(--ink3);line-height:1;font-weight:700}
.iconbtn:hover{color:var(--ink2)}
.progress{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;box-shadow:inset 0 4px 0 rgba(255,255,255,.25)}
.pill{font-weight:800;font-size:14px;white-space:nowrap}
.btn{border:none;border-radius:var(--r);padding:13px 18px;font-weight:800;font-size:14px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:.1s;box-shadow:0 4px 0 rgba(0,0,0,.18);user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}.btn-green:hover:not(:disabled){background:var(--green-d)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover:not(:disabled){background:var(--red-d)}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:#fff;color:var(--blue);box-shadow:0 4px 0 var(--line2),inset 0 0 0 2px var(--line)}
.btn-ghost:hover{background:#f4fbff}
.btn-amber{background:#fff;color:var(--amber);box-shadow:0 4px 0 var(--line2),inset 0 0 0 2px var(--line)}
.btn-amber.on{background:var(--amber);color:#fff;box-shadow:0 4px 0 #cc7700}
.btn-sm{padding:9px 14px;font-size:12px;border-radius:11px}
.hero{padding:28px 0 8px}
.hero h1{font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.5px}
.hero p{color:var(--ink2);margin:0 0 20px;font-size:15px;line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.statcard{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center}
.statcard b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.statcard span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.decklist{display:flex;flex-direction:column;gap:10px;padding-bottom:120px}
.deck{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:#fff;cursor:pointer;transition:.12s}
.deck:hover{border-color:var(--blue);background:#f7fdff}
.deck:active{transform:scale(.99)}
.deck.done{border-color:var(--green);background:#f4ffe4}
.deck-ico{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:800}
.deck.done .deck-ico{background:var(--green-l);color:var(--green-t)}
.deck-body{flex:1;min-width:0}
.deck-title{font-weight:800;font-size:15px;margin-bottom:2px}
.deck-sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-meta{font-size:11px;color:var(--ink3);font-weight:700;white-space:nowrap;text-align:right}
.sectionhead{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}
.exwrap{max-width:680px;margin:0 auto;padding:8px 16px 230px}
.qhead{display:flex;align-items:center;gap:10px;margin:4px 0 18px;flex-wrap:wrap;justify-content:space-between}
.qhead h2{font-size:22px;font-weight:800;margin:0;line-height:1.35;flex:1;min-width:0}
.flagbtn{background:#fff;border:2px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:.15s}
.flagbtn:hover{border-color:var(--amber);color:var(--amber)}
.flagbtn.on{background:var(--amber);border-color:var(--amber);color:#fff}
.answerzone{min-height:96px;border-bottom:2px solid var(--line);padding:8px 0 12px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answerzone.filled{border-color:var(--blue)}
.placeholder{color:var(--ink3);font-size:14px;font-weight:600;padding:8px 2px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:16px;font-weight:700;cursor:pointer;transition:.1s;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.chip:hover{background:#f7f7f7}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.used{opacity:0;pointer-events:none}
.chip.flat{box-shadow:none;border-color:var(--line2)}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:10px;font-size:16px;font-weight:700;cursor:pointer;transition:.1s;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.choice:hover{background:#f7f7f7}
.choice.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);box-shadow:0 2px 0 var(--blue)}
.choice:disabled{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:17px;font-family:inherit;font-weight:600;outline:none;background:#fff;color:var(--ink)}
.typein:focus{border-color:var(--blue)}
.compare{background:var(--bg2);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cmp-row{margin-bottom:12px}.cmp-row:last-child{margin-bottom:0}
.cmp-label{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.cmp-text{font-size:18px;font-weight:700;line-height:1.5;word-break:break-word}
.cmp-text.empty{color:var(--ink3);font-weight:600;font-style:italic}
.cmp-row.good .cmp-text{color:var(--green-t)}
.cmp-row.bad .cmp-text{color:var(--red-t)}
.footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:30}
.footer-inner{max-width:680px;margin:0 auto}
.footer-row{display:flex;gap:10px;align-items:center}
.footer-row>.btn{flex:1}
.footer-hint{font-size:12.5px;color:var(--ink2);font-weight:600;text-align:center;margin-top:10px}
.rate-title{font-size:15px;font-weight:800;text-align:center;margin-bottom:10px;color:var(--ink2)}
.rate-row{display:flex;gap:10px}
.rate-row>.btn{flex:1}
.statwrap{padding-bottom:80px}
.attemptrow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.attemptrow .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.no{background:var(--red)}.dot.flag{background:var(--amber)}
.attemptrow .body{flex:1;min-width:0}
.attemptrow .en{font-weight:700}
.attemptrow .given{font-size:12.5px;color:var(--ink2);margin-top:3px;word-break:break-word}
.attemptrow .meta{font-size:11px;color:var(--ink3);white-space:nowrap;font-weight:700;text-align:right}
.flagbadge{display:inline-block;background:var(--amber-l);color:#8a5000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink3);padding:50px 20px;font-weight:600}
.notice{background:var(--amber-l);color:#8a5000;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice button{background:transparent;border:1.5px solid #8a5000;color:#8a5000;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}

.fl{line-height:1.6}
.fl.rtl{direction:rtl;unicode-bidi:isolate;line-height:2}
.fl.arf{font-family:'Noto Naskh Arabic','Segoe UI',serif;line-height:2.1}
.answerzone.rtl{direction:rtl}
.bank.rtl{direction:rtl}
.chip.fl{font-size:18px}
.chip.arf{font-size:20px;line-height:1.8;padding:4px 14px}
.choice.rtl{direction:rtl;text-align:right}
.choice.arf{font-size:20px;line-height:2;padding:8px 16px}
.cmp-text.arf{font-size:22px;line-height:2}
.titlebtn{background:none;border:none;font-family:inherit;font-weight:800;font-size:19px;letter-spacing:-.4px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 0;flex:1;min-width:0;text-align:left}
.titlebtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{font-size:14px;color:var(--ink3);transition:transform .15s}
.titlebtn.open .caret{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:12px;right:12px;max-width:340px;background:#fff;border:2px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:40}
.ddrow{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px}
.ddrow:hover{background:var(--bg2)}
.ddrow small{color:var(--ink3);font-weight:600;margin-left:6px}
.ddrow .cnt{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:800}
.ddrow.add{color:var(--blue-d);border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 10px 10px}
.cb{width:22px;height:22px;border:2px solid var(--line2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;font-weight:800;background:#fff}
.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sechead .sectionhead{margin:0}
.linkbtn{background:none;border:none;font-family:inherit;font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--blue-d);cursor:pointer;padding:4px 6px}
.deck .deck-ico.cbwrap{background:none}
.gbar{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.gbar>i{display:block;height:100%;background:var(--green)}
.lbadge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;background:var(--blue-l);color:var(--blue-d);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
.deck.picked{border-color:var(--blue);background:#f4fbff}
.dotmenu{flex-shrink:0;font-size:20px;padding:4px 8px}
.selbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30}
.selbar-inner{max-width:680px;margin:0 auto}
.selcount{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.selbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn-redg{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--line2),inset 0 0 0 2px var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:800;line-height:1.35}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;font-weight:700}
.srow:hover{border-color:var(--blue);background:#f7fdff}
.srow small{margin-left:auto;color:var(--ink3);font-weight:800}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;font-weight:600;outline:none;background:#fff;color:var(--ink)}
.field:focus{border-color:var(--blue)}
.sheet-actions{display:flex;gap:10px;margin-top:14px}
.sheet-actions .btn{flex:1}
.hint{font-size:12.5px;color:var(--ink2);font-weight:600;margin:0 0 10px;line-height:1.5}
.improw{border:2px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.improw .field{margin-bottom:8px}
.improw .cnt{font-size:12px;font-weight:800;color:var(--ink3)}
.chkrow{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-weight:700;font-size:14px;cursor:pointer}
.code{direction:ltr;text-align:left;background:#1e1e1e;color:#e6e6e6;border-radius:12px;padding:14px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;max-height:340px;margin:0 0 12px}
.rowcb{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.rowcb .body{flex:1;min-width:0}
.rowcb .en{font-weight:700;font-size:14px}
.sessmeta{font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap}
.choice.right{border-color:var(--green);background:var(--green-l);color:var(--green-t);box-shadow:0 2px 0 var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-t);box-shadow:0 2px 0 var(--red)}
.hintrow{font-size:16px;font-weight:700;margin-top:4px;line-height:1.8}
.hintrow .fl{font-size:21px}
.introcard{border:2px solid var(--line);border-radius:var(--r);padding:20px 18px}
.introtag{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue-d);margin-bottom:12px}
.iwrap{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px}
.iwrap.rtl{direction:rtl}
.iw{text-align:center}
.iw .w{font-size:28px;font-weight:800}
.iw .translit{margin-top:0;font-style:italic}
.intro-en{font-size:21px;font-weight:700;line-height:1.4}
.lvcard{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.lvinfo{flex:1;min-width:0}
.lvinfo b{display:block;font-size:16px;font-weight:800}
.lvinfo span{font-size:12.5px;color:var(--ink2);font-weight:700}
.sidetr{font-size:17px;font-weight:700;color:var(--ink2);margin-top:4px;line-height:1.7}
.nomatch{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:4px}
.choice .sidetr{font-size:15px;font-weight:600;margin-top:2px}
</style>
</head>

<div id="app"></div>
<input type="file" id="fileInput" accept=".csv,.txt,text/csv,text/plain" multiple hidden>
<input type="file" id="dataInput" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<script type="text/plain" id="codeTpl">
(async () => {
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---- selectors ----------------------------------------------------------
  const getPageInfo = () => {
    const s = [...document.querySelectorAll('span')]
      .find(el => /^Page \d+ of \d+$/.test(el.textContent.trim()));
    if (!s) return null;
    const m = s.textContent.trim().match(/Page (\d+) of (\d+)/);
    return { current: +m[1], total: +m[2] };
  };
  const getNext = () =>
    [...document.querySelectorAll('button')]
      .find(b => b.textContent.trim().toLowerCase() === 'next');

  // Each card: a <span>#123</span> followed by __COMMENT__
  const parsePage = () => {
    const out = [];
    document.querySelectorAll('span').forEach(span => {
      const m = span.textContent.trim().match(/^#(\d+)$/);
      if (!m) return;
      const ps = span.parentElement.querySelectorAll('p');
      if (ps.length < __MIN__) return;
      out.push({
        id: +m[1],
        english: ps[0].textContent.trim(),
        __TRLINE__
        __KEY__:  ps[__IDX__].textContent.trim(),
      });
    });
    return out;
  };

  const waitForPage = async (prev, timeout = 15000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
      await sleep(100);
      const info = getPageInfo();
      if (info && info.current !== prev) return info;
    }
    throw new Error('timed out waiting for next page');
  };

  // ---- the loop -----------------------------------------------------------
  const byId = new Map();
  let guard = 0;
  while (guard++ < 200) {
    const info = getPageInfo();
    if (!info) { console.warn('no pagination found'); break; }

    parsePage().forEach(c => byId.set(c.id, c));
    console.log(`page ${info.current}/${info.total} — total ${byId.size}`);

    if (info.current >= info.total) break;
    const next = getNext();
    if (!next || next.disabled) { console.warn('next unavailable'); break; }
    next.click();
    await waitForPage(info.current);
  }

  // ---- output -------------------------------------------------------------
  const rows = [...byId.values()].sort((a, b) => a.id - b.id);
  window.__sentences = rows;               // keep it around for more poking
  console.log('DONE:', rows.length, 'sentences');

  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = 'id,english,transliteration,__KEY__\n' +
    rows.map(r => [r.id, r.english, r.translit, r.__KEY__].map(q).join(',')).join('\n');

  try { await navigator.clipboard.writeText(csv); console.log('CSV → clipboard'); }
  catch { console.log(csv); }

  return rows;
})();
</script>

const LG = c => LANGS[c] || { name:String(c).toUpperCase(), native:'', hello:'' };
function langFromName(s){
  const t = String(s||'').trim().toLowerCase(); if (!t) return null;
  for (const c of Object.keys(LANGS)){
    const L = LANGS[c];
    if (c === t || L.name.toLowerCase() === t || L.native.toLowerCase() === t) return c;
  }
  return null;
}

function toks(text, lang){
  const t = String(text||'');
  return LG(lang).noSpace ? Array.from(t.replace(/\s+/g,'')) : t.split(/\s+/).filter(Boolean);
}
function joinToks(arr, lang){ return arr.join(LG(lang).noSpace ? '' : ' '); }

function normFl(s, lang){

  if (L.arf) return normAr(s);

}

/* ==================== TASHKIL ENGINE ==================== */
const FATHA='\u064E', KASRA='\u0650', DAMMA='\u064F', SUKUN='\u0652', SHADDA='\u0651';
const TASHKIL_MULTI = {'ṯ':'ث','ḏ':'ذ','ǧ':'ج','ḥ':'ح','ḫ':'خ','š':'ش','ṣ':'ص','ḍ':'ض','ṭ':'ط','ẓ':'ظ','ʿ':'ع','ġ':'غ'};
const TASHKIL_SINGLE = {
  'ʾ':['ء','أ','إ','آ','ؤ','ئ'],
  'b':['ب'],'t':['ت'],'d':['د'],'r':['ر'],'z':['ز'],'s':['س'],
  'f':['ف'],'q':['ق'],'k':['ك'],'l':['ل'],'m':['م'],'n':['ن'],
  'h':['ه','ة'],'w':['و'],'y':['ي','ى']
};
const LONG_VOWEL_LETTERS = new Set(['ا','و','ي','ى','آ','أ','إ']);
function tashkilMark(v){ return v==='a'?FATHA : v==='i'?KASRA : v==='u'?DAMMA : ''; }
function isArDiacritic(ch){ return /[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/.test(ch); }
function tokenizeTranslit(word){
  const tokens = []; let i = 0;
  while (i < word.length){
    const ch = word[i];
    if (ch==='ā'||ch==='â'||ch==='á'){ tokens.push({t:'L',v:'a'}); i++; continue; }
    if (ch==='ī'||ch==='î'||ch==='í'){ tokens.push({t:'L',v:'i'}); i++; continue; }
    if (ch==='ū'||ch==='û'||ch==='ú'){ tokens.push({t:'L',v:'u'}); i++; continue; }
    if (TASHKIL_MULTI[ch]){ tokens.push({t:'C',m:TASHKIL_MULTI[ch],key:ch}); i++; continue; }
    if (ch==='a'||ch==='i'||ch==='u'){ tokens.push({t:'V',v:ch}); i++; continue; }
    if (TASHKIL_SINGLE[ch]){ tokens.push({t:'C',m:TASHKIL_SINGLE[ch][0],alts:TASHKIL_SINGLE[ch],key:ch}); i++; continue; }
    i++;
  }
  return tokens;
}
function arMatches(arCh, tok){ return tok.alts ? tok.alts.includes(arCh) : arCh === tok.m; }
function tashkilWord(arabicWord, translitWord){
  const clean = String(translitWord).replace(/[.,!?؟،؛:·"“”'‘’()\[\]{}—–_\-]/g,'').trim();
  if (!clean) return arabicWord;
  const tokens = tokenizeTranslit(clean);
  if (!tokens.length) return arabicWord;
  const result = []; let ti = 0;
  for (let ai = 0; ai < arabicWord.length; ai++){
    const arCh = arabicWord[ai];
    result.push(arCh);
    if (isArDiacritic(arCh)) continue;
    const tok = tokens[ti]; if (!tok) continue;
    if (tok.t === 'L' && LONG_VOWEL_LETTERS.has(arCh)){ ti++; continue; }
    if (arCh === 'ا' && tok.t === 'V'){ ti++; continue; }
    if (tok.t === 'C' && arMatches(arCh, tok)){
      ti++;
      const next = tokens[ti]; if (!next) continue;
      if (next.t === 'V'){ result.push(tashkilMark(next.v)); ti++; }
      else if (next.t === 'C'){
        if (next.key === tok.key){
          result.push(SHADDA); ti++;
          const after = tokens[ti];
          if (after && after.t === 'V'){ result.push(tashkilMark(after.v)); ti++; }
          else if (after && after.t === 'C'){ result.push(SUKUN); }
          else if (after && after.t === 'L'){ result.push(tashkilMark(after.v)); }
        } else { result.push(SUKUN); }
      } else if (next.t === 'L'){ result.push(tashkilMark(next.v)); }
    }
  }
  return result.join('');
}
function addTashkil(arabic, translit){
  if (!arabic || !translit) return arabic;
  const aw = arabic.split(/\s+/);
  const tw = translit.split(/\s+/);
  if (aw.length !== tw.length) return arabic;
  return aw.map((w,i)=>tashkilWord(w, tw[i])).join(' ');
}

/* ==================== NORMALIZATION ==================== */
const AR_DIA = /[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/g;
function normAr(s){
  return String(s).replace(AR_DIA,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
    .replace(/[.,!?؟،؛:·"“”'‘’()\[\]{}—–_\-]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function normEn(s){
  return String(s).toLowerCase().replace(/[’‘]/g,"'")
    .replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  if (a===b) return 0;
  const m=a.length,n=b.length;
  if (!m) return n; if (!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for (let j=0;j<=n;j++) prev[j]=j;
  for (let i=1;i<=m;i++){
    cur[0]=i;
    for (let j=1;j<=n;j++){
      const c = a[i-1]===b[j-1]?0:1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a.slice()).slice(0,n); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ==================== PARSING ==================== */
function parseRaw(text){
  const out = [];
  for (const line of text.split('\n')){
    const t = line.trim(); if (!t) continue;
    const p = t.split('|'); if (p.length < 4) continue;
    const n = parseInt(p[0],10); if (isNaN(n)) continue;
    const english = p[1].trim(), target = p[3].trim();
    if (!english || !target) continue;
    out.push({ n, english, transliteration:p[2].trim(), target });
  }
  out.sort((a,b)=>a.n-b.n);
  return out;
}
function parseCSVRows(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f += c;
    } else {
      if (c==='"') q=true;
      else if (c===','){ row.push(f); f=''; }
      else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if (c==='\r'){}
      else f += c;
    }
  }
  if (f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function rowsToItems(rows){
  const out = []; let hint = null;
  for (const r of rows){
    if (!r || r.length < 4) continue;
    const n = parseInt(String(r[0]).trim(),10);
    if (isNaN(n)){ if (!out.length && !hint) hint = langFromName(r[3]); continue; }
    const english = String(r[1]||'').trim(), tr = String(r[2]||'').trim(), target = String(r[3]||'').trim();
    if (!english || !target) continue;
    out.push({ n, english, transliteration:tr, target });
  }
  out.sort((a,b)=>a.n-b.n);
  return { items:out, hint };
}
function parseAny(text){
  let rows = parseRaw(text), hint = null;
  if (rows.length < 5){
    try {
      const c = rowsToItems(parseCSVRows(text));
      if (c.items.length > rows.length){ rows = c.items; hint = c.hint; }
    } catch(e){}
  }
  if (!hint && rows.length) hint = detectLang(rows.slice(0,20).map(r=>r.target).join(' '));
  return { rows, hint };
}
function toCSV(items, lang){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  return 'id,english,transliteration,' + LG(lang).name.toLowerCase() + '\n' +
    items.map((s,i)=>[i+1, s.english, s.transliteration||'', s.target].map(q).join(',')).join('\n');
}

function h32(s, seed){ let h = seed; for (let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h>>>0).toString(36); }
function mkUid(lang, en, tg){ const k = en + '\u0001' + tg; return lang + ':' + h32(k,2166136261) + h32(k,5381); }
function gid(){ return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function mkItems(rows, lang){
  const seen = new Set(), out = [];
  for (const r of rows){
    const uid = mkUid(lang, r.english, r.target);
    if (seen.has(uid)) continue; seen.add(uid);
    out.push({ uid, n:r.n, english:r.english, transliteration:r.transliteration||'', target:r.target, lang });
  }
  return out;
}
function uniq(items){ const m = new Map(); for (const s of items) if (!m.has(s.uid)) m.set(s.uid, s); return [...m.values()]; }
function oneGroup(items, lang){ return [{ id:gid(), name:LG(lang).name + ' sentences', lang, items }]; }
function importItems(rows, lang, keepDup, taken){
  const used = new Set(), count = {}, out = []; let skipped = 0;
  for (const r of rows){
    const base = mkUid(lang, r.english, r.target);
    let uid = base;
    if (keepDup){
      const n = count[base] || 0; count[base] = n + 1;
      if (n > 0 || taken.has(base)){ let k = Math.max(n,1); do { uid = base + '#' + k++; } while (taken.has(uid) || used.has(uid)); }
    } else if (taken.has(base) || used.has(base)){ skipped++; continue; }
    used.add(uid);
    out.push({ uid, n:r.n, english:r.english, transliteration:r.transliteration||'', target:r.target, lang });
  }
  return { items:out, skipped };
}
function buildInitialLib(){

  if (legacy){ const p = parseAny(legacy); if (p.rows.length >= 5) rows = p.rows; }
  const fromRaw = !rows;
  if (fromRaw) rows = parseRaw(RAW);                       // built-in 500 Arabic sentences
  const groups = oneGroup(mkItems(rows, 'ar'), 'ar');
  if (fromRaw) groups[0].pack = { id:'arabic', rev:'embedded' };   // lets arabic.txt in the store extend this group
  const lib = { groups };
  return { lib, legacy: !!legacy };
}

// Runs every boot: converts numeric ids written by the old version (also if it is used again later) to uids. Never deletes anything.
function migrateLegacy(){
  const map = {};
  for (const s of BY_UID.values()) if (s.lang === 'ar' && s.n != null && !(s.n in map)) map[s.n] = s.uid;
  let ch = false;
  for (const a of ATTEMPTS){ if (typeof a.id === 'number'){ a.id = map[a.id] || ('ar:old' + a.id); ch = true; } }
  if (ch) saveAttempts();
  const nf = {}; let fch = false;
  for (const k of Object.keys(FLAGS)){
    if (/^\d+$/.test(k)){ fch = true; const u = map[+k] || ('ar:old' + k); if (!(u in nf)) nf[u] = FLAGS[k]; }
    else nf[k] = FLAGS[k];
  }
  if (fch){ FLAGS = nf; saveFlags(); }
}
function getGroup(id){ return LIB.groups.find(g=>g.id===id); }
function rebuild(){
  BY_UID = new Map(); T2S = new Map(); WORD_TASHKIL = {}; EN_IDX = {}; EK = new Map();
  for (const g of LIB.groups) for (const s of g.items){
    s.lang = g.lang;
    if (!BY_UID.has(s.uid)){
      BY_UID.set(s.uid, s); T2S.set(g.lang + '|' + s.target, s);
      const k = enKey(s.english); EK.set(s.uid, k);
      if (!EN_IDX[g.lang]) EN_IDX[g.lang] = new Map();
      if (!EN_IDX[g.lang].has(k)) EN_IDX[g.lang].set(k, s);
    }
  }
  for (const s of BY_UID.values()){
    if (s.lang !== 'ar' || !s.transliteration) continue;
    const aw = s.target.split(/\s+/), tw = s.transliteration.split(/\s+/);
    if (aw.length !== tw.length) continue;
    for (let i=0;i<aw.length;i++){
      const raw = aw[i]; if (WORD_TASHKIL[raw]) continue;
      const t = tashkilWord(raw, tw[i]);
      if (t && t !== raw) WORD_TASHKIL[raw] = t;
    }
  }
  fixLangPrefs();
}

/* Display helpers */
function displayFl(s){
  if (!s) return '';
  if (s.lang === 'ar' && SHOW_TASHKIL && s.transliteration) return addTashkil(s.target, s.transliteration) || s.target;
  return s.target;
}
function displayWord(w, lang){
  if (lang !== 'ar' || !SHOW_TASHKIL || !w) return w;
  return WORD_TASHKIL[w] || w;
}
function displayFlFromText(t, lang){
  if (lang !== 'ar' || !SHOW_TASHKIL || !t) return t;
  const s = T2S.get(lang + '|' + t);
  if (s && s.transliteration) return addTashkil(s.target, s.transliteration) || t;
  return t.split(/\s+/).map(w=>displayWord(w, lang)).join(' ');
}


/* ==================== CROSS-LANGUAGE LINKS (matched by English) ==================== */
const COMPAT_MIN = 0.5;
function enKey(t){ return String(t||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim(); }
function ekOf(s){ let k = EK.get(s.uid); if (k === undefined){ k = enKey(s.english); EK.set(s.uid, k); } return k; }
function counterpart(s, L){
  const m = EN_IDX[L];
  if (!m || s.lang === L) return null;
  return m.get(ekOf(s)) || null;
}
// known side of a sentence: English, or its translation in the chosen known language
function kn(s){
  if (KNOWN === 'en' || s.lang === KNOWN) return { text:s.english, lang:'en', sent:null, fb:false };
  const c = counterpart(s, KNOWN);
  if (c) return { text:c.target, lang:KNOWN, sent:c, fb:false };
  return { text:s.english, lang:'en', sent:null, fb:true };
}
// optional extra translation shown beside the known side
function sideOf(s){
  if (!SIDE) return null;
  const k = kn(s);
  if (SIDE === k.lang || SIDE === s.lang) return null;
  if (SIDE === 'en') return { text:s.english, lang:'en', sent:null };
  const c = counterpart(s, SIDE);
  return c ? { text:c.target, lang:SIDE, sent:c } : { miss:SIDE };
}
function matchRatio(A, B){
  const ia = EN_IDX[A], ib = EN_IDX[B];
  if (!ia || !ib) return 0;
  let m = 0; for (const k of ia.keys()) if (ib.has(k)) m++;
  const d = Math.min(ia.size, ib.size);
  return d ? m/d : 0;
}
// can language K serve as known/side language for the languages being learned?
function langOption(K){
  const ts = ACTIVE.filter(t=>t !== K && EN_IDX[t]);
  if (!ts.length) return { ok:false, pct:null };
  const r = Math.min(...ts.map(t=>matchRatio(t, K)));
  return { ok: r >= COMPAT_MIN, pct: Math.round(r*100) };
}

/* ==================== EXERCISE BUILDER ==================== */
function pickDistractors(pool, sent, tokensOf, normOf, used, count){
  const dPool = [];
  for (const s of pool){ if (s.uid === sent.uid) continue;
    for (const t of tokensOf(s)) if (t && !used.has(normOf(t))) dPool.push(t);
  }
  const distr = [], seenD = new Set();
  for (const t of shuffle(dPool)){
    if (distr.length >= count) break;
    const k = normOf(t); if (seenD.has(k)) continue;
    seenD.add(k); distr.push(t);
  }
  return distr;
}
const PUNCT = /[.,!?;:"“”()،؟؛]/g;
function flToks(s){ return toks(s.target, s.lang).map(t=>t.replace(PUNCT,'')).filter(Boolean); }
function enToks(s){ return s.english.replace(PUNCT,' ').split(/\s+/).filter(Boolean); }
function jac(a, b){
  const A = new Set(a), B = new Set(b); let i = 0;
  A.forEach(x=>{ if (B.has(x)) i++; });
  const u = A.size + B.size - i; return u ? i/u : 0;
}
function kToks(k){ return toks(k.text, k.lang).map(t=>t.replace(PUNCT,'')).filter(Boolean); }
// Minimal-pair hint: what differs between the target sentence and a close option
function pairDiff(a, d){
  const ka = kn(a), kd = kn(d);
  if (ka.lang !== kd.lang) return null;
  const nf = t=>normFl(t, a.lang), nk = t=>normFl(t, ka.lang);
  const af = flToks(a), df = flToks(d), ae = kToks(ka), de = kToks(kd);
  const aS = new Set(af.map(nf)), dS = new Set(df.map(nf));
  const aeS = new Set(ae.map(nk)), deS = new Set(de.map(nk));
  const aOnly = af.filter(t=>!dS.has(nf(t))), dOnly = df.filter(t=>!aS.has(nf(t)));
  const aeOnly = ae.filter(t=>!deS.has(nk(t))), deOnly = de.filter(t=>!aeS.has(nk(t)));
  if (!aOnly.length || !dOnly.length || !aeOnly.length || !deOnly.length) return null;
  if (aOnly.length !== 1 || dOnly.length !== 1 || aeOnly.length > 2 || deOnly.length > 2) return null;
  if (af.length - aOnly.length < 1) return null;
  return { lang:a.lang, kLang:ka.lang, a:{ fl:aOnly, en:aeOnly }, b:{ fl:dOnly, en:deOnly } };
}
function buildMatch(sent, pool, dir){
  const lang = sent.lang, nf = t=>normFl(t, lang), k = kn(sent);
  const sf = flToks(sent).map(nf), se = enToks(sent).map(t=>t.toLowerCase());
  const txt = d => dir === 'en' ? kn(d).text : d.target;
  const correct = dir === 'en' ? k.text : sent.target;
  const cands = [];
  for (const d of pool){
    if (d.uid === sent.uid || d.lang !== lang || d.english === sent.english || d.target === sent.target) continue;
    if (dir === 'en'){ const kd = kn(d); if (kd.lang !== k.lang || kd.text === k.text) continue; }
    const df = flToks(d).map(nf), de = enToks(d).map(t=>t.toLowerCase());
    cands.push({ d, sc: jac(sf,df) + 0.5*jac(se,de) - 0.03*Math.abs(sf.length - df.length) });
  }
  if (!cands.length) return null;
  cands.sort((x,y)=>y.sc - x.sc);
  const top = cands.slice(0,10);
  let best = null, hint = null;
  for (const c of top){ const h = pairDiff(sent, c.d); if (h){ best = c; hint = h; break; } }
  const chosen = [];
  const add = c=>{ const t = txt(c.d); if (!chosen.includes(c) && t !== correct && !chosen.some(x=>txt(x.d) === t)) chosen.push(c); };
  add(best || cands[0]);
  for (const c of shuffle(top.slice())){ if (chosen.length >= 2) break; add(c); }
  const rest = cands.slice(10, 60);
  for (const c of shuffle((rest.length ? rest : cands).slice())){ if (chosen.length >= 3) break; add(c); }
  for (const c of cands){ if (chosen.length >= 3) break; add(c); }
  if (!chosen.length) return null;
  const optSent = {}; optSent[correct] = sent; chosen.forEach(c=>{ optSent[txt(c.d)] = c.d; });
  return { options: shuffle([correct, ...chosen.map(c=>txt(c.d))]), hint, optSent };
}
function buildExercise(sent, pool, type){
  const lang = sent.lang, k = kn(sent);
  const ex = { type, sent, lang, kLang:k.lang, prompt:'', promptLang:'en', answerLang:'fl', options:null, optSent:null, bank:null, correct:'', hint:null };
  const same = pool.filter(s=>s.lang === lang);
  const sameK = same.filter(s=>kn(s).lang === k.lang);
  const flT = toks(sent.target, lang);
  const kT = toks(k.text, k.lang);

  if (isMatch(type)){
    const dir = type === 'match-en' ? 'en' : 'fl';
    const m = buildMatch(sent, same, dir);
    if (!m) return null;
    ex.prompt = dir === 'en' ? sent.target : k.text;
    ex.promptLang = dir === 'en' ? 'fl' : 'en';
    ex.answerLang = dir === 'en' ? 'en' : 'fl';
    ex.correct = dir === 'en' ? k.text : sent.target;
    ex.options = m.options; ex.hint = m.hint; ex.optSent = m.optSent;
  }
  else if (type === 'bank-fl'){
    ex.prompt = k.text; ex.promptLang = 'en'; ex.answerLang = 'fl';
    ex.correct = joinToks(flT, lang);
    const nf = t => normFl(t, lang);
    const used = new Set(flT.map(nf));
    const dCount = Math.max(3, Math.min(6, Math.round(flT.length*0.7)));
    ex.bank = shuffle([...flT, ...pickDistractors(same, sent, s=>toks(s.target, lang), nf, used, dCount)]);
  }
  else if (type === 'bank-en'){
    ex.prompt = sent.target; ex.promptLang = 'fl'; ex.answerLang = 'en';
    ex.correct = joinToks(kT, k.lang);
    const nk = t => normFl(t, k.lang);
    const used = new Set(kT.map(nk));
    const dCount = Math.max(3, Math.min(6, Math.round(kT.length*0.6)));
    ex.bank = shuffle([...kT, ...pickDistractors(sameK, sent, s=>toks(kn(s).text, k.lang), nk, used, dCount)]);
  }
  else if (type === 'choice-fl'){
    ex.prompt = k.text; ex.promptLang = 'en'; ex.answerLang = 'fl';
    ex.correct = sent.target;
    const len = sent.target.length;
    const cands = same.filter(s=>s.uid !== sent.uid && s.target && s.target !== sent.target);
    cands.sort((a,b)=>Math.abs(a.target.length-len)-Math.abs(b.target.length-len));
    const near = shuffle(cands.slice(0,40)).slice(0,3);
    ex.options = shuffle([sent.target, ...near.map(s=>s.target)]);
  }
  else if (type === 'choice-en'){
    ex.prompt = sent.target; ex.promptLang = 'fl'; ex.answerLang = 'en';
    ex.correct = k.text;
    const len = k.text.length;
    const cands = sameK.filter(s=>s.uid !== sent.uid && kn(s).text !== k.text);
    cands.sort((a,b)=>Math.abs(kn(a).text.length-len)-Math.abs(kn(b).text.length-len));
    const near = shuffle(cands.slice(0,40)).slice(0,3);
    ex.options = shuffle([k.text, ...near.map(s=>kn(s).text)]);
    ex.optSent = {}; ex.optSent[k.text] = sent; near.forEach(s=>{ ex.optSent[kn(s).text] = s; });
  }
  else if (type === 'type-en'){
    if (k.lang !== 'en') return null;
    ex.prompt = sent.target; ex.promptLang = 'fl'; ex.answerLang = 'en';
    ex.correct = sent.english;
  }
  return ex;
}
function stemSplit(a, b){
  const x = normAr(a), y = normAr(b); let k = 0;
  while (k < x.length && k < y.length && x[x.length-1-k] === y[y.length-1-k]) k++;
  if (k < 2 || x.length-k < 1 || y.length-k < 1 || x.length-k > 2 || y.length-k > 2) return null;
  return [x.slice(0, x.length-k) + 'ـ-' + x.slice(x.length-k), y.slice(0, y.length-k) + 'ـ-' + y.slice(y.length-k)];
}

/* ==================== LEVELS ==================== */
const SUBS = ['a','b','c'];
const SUB_NEW = [['match-en','match-fl'], ['bank-fl','choice-fl'], ['type-en','choice-en','bank-en']];
const SUB_DESC = ['Intro & match','Build sentences','Translate to English'];
function sentLen(s){ return LG(s.lang).noSpace ? s.english.split(/\s+/).filter(Boolean).length : toks(s.target, s.lang).length; }
function levelOfLen(n){ return Math.max(1, Math.ceil((n-1)/2)); }
function levelWords(L){ return L === 1 ? '1–3' : (2*L) + '–' + (2*L+1); }
function langSentences(lang){ return [...BY_UID.values()].filter(s=>s.lang === lang); }
function levelPool(lang, L){ return langSentences(lang).filter(s=>levelOfLen(sentLen(s)) === L); }
function maxLevel(lang){ let m = 1; for (const s of langSentences(lang)) m = Math.max(m, levelOfLen(sentLen(s))); return m; }
const CHUNK_TARGET = 12;   // sentences per mini-cycle (a → b → c)
function lv(lang){
  if (!LEVELS[lang]) LEVELS[lang] = { level:1, sub:0, chunk:0, done:{} };
  const v = LEVELS[lang]; if (v.chunk == null) v.chunk = 0;
  return v;
}
function levelSorted(lang, L){
  return levelPool(lang, L).sort((a,b)=>((a.n||0)-(b.n||0)) || (a.uid < b.uid ? -1 : 1));
}
function chunkLayout(n){ const cnt = Math.max(1, Math.round(n/CHUNK_TARGET)); return { cnt, size:Math.ceil(n/cnt) }; }
function chunkCount(lang, L){ return chunkLayout(levelPool(lang, L).length).cnt; }
function chunkPool(lang, L, ci){
  const p = levelSorted(lang, L), ly = chunkLayout(p.length);
  return p.slice(ci*ly.size, (ci+1)*ly.size);
}
function normalizeLevel(lang){
  const v = lv(lang), mx = maxLevel(lang); let ch = false;
  while (v.level <= mx && !levelPool(lang, v.level).length){ v.level++; v.sub = 0; v.chunk = 0; v.done = {}; ch = true; }
  if (v.level <= mx){
    const cc = chunkCount(lang, v.level);
    if (v.chunk >= cc){ v.chunk = 0; v.done = {}; ch = true; }
    if (!chunkPool(lang, v.level, v.chunk).length){ v.chunk = 0; ch = true; }
  }
  if (ch) saveLS(LS.levels, LEVELS);
  return v.level > mx ? 'complete' : 'ok';
}
function curChunk(lang){ const v = lv(lang); return chunkPool(lang, v.level, v.chunk); }
function levelPending(lang){ const v = lv(lang); return curChunk(lang).filter(s=>!v.done[s.uid]); }
function advanceIfDone(lang){
  const v = lv(lang);
  if (levelPending(lang).length) return false;
  const before = v.level;
  v.sub++; v.done = {};
  if (v.sub > 2){
    v.sub = 0; v.chunk++;
    if (v.chunk >= chunkCount(lang, v.level)){ v.chunk = 0; v.level++; }
  }
  const st = normalizeLevel(lang); saveLS(LS.levels, LEVELS);
  if (st === 'complete') toast('All levels completed');
  else if (v.level !== before) toast('Level ' + v.level + ' unlocked');
  else if (v.sub === 0) toast('Chunk done ✓ · next ' + (v.chunk+1) + '/' + chunkCount(lang, v.level));
  return true;
}
function fillLevelQueue(){
  const s = state.sess, lang = s.lang;
  if (normalizeLevel(lang) === 'complete'){
    s.complete = true;
    s.queue = s.queue.concat(shuffle(langSentences(lang)).map(x=>({ sent:x, kind:'rev' })));
    return;
  }
  const q = shuffle(levelPending(lang)).map(x=>({ sent:x, kind:'new' }));
  if (q.length > 1 && s.last && q[0].sent.uid === s.last){ const t = q[0]; q[0] = q[q.length-1]; q[q.length-1] = t; }
  // review mix: sentences already met (not in this chunk), unknown ones first; any enabled exercise type
  const last = lastMap(), cur = new Set(curChunk(lang).map(x=>x.uid));
  const seen = langSentences(lang).filter(x=>!cur.has(x.uid) && last.has(x.uid));
  const n = Math.min(seen.length, Math.max(3, Math.ceil(q.length*0.5)));
  const unk = shuffle(seen.filter(x=>last.get(x.uid) === false));
  const ok = shuffle(seen.filter(x=>last.get(x.uid) === true));
  unk.concat(ok).slice(0, n).forEach(x=>q.splice(Math.floor(Math.random()*(q.length+1)), 0, { sent:x, kind:'rev' }));
  s.queue = s.queue.concat(q);
}

/* ==================== STATE / SESSION ==================== */
const state = {
  screen:'home', ddOpen:false, selMode:false, sel:new Set(), gid:null, ssel:new Set(),
  sess:null, cur:null, ex:null, answer:null, usedBank:null, feedback:null, flagged:false,
  xp:0, session:0, correctSession:0, combo:0, al:{ lang:'de', tr:false },
};

function lang_pool(lang){
  const s = state.sess;
  if (!s.byLang[lang]){
    const p = s.pool.filter(x=>x.lang === lang);
    s.byLang[lang] = p.length >= 4 ? p : [...BY_UID.values()].filter(x=>x.lang === lang);
  }
  return s.byLang[lang];
}
function fillQueue(){
  const s = state.sess;
  const q = shuffle(s.pool.slice()).map(x=>({ sent:x }));
  if (q.length > 1 && s.last && q[0].sent.uid === s.last){ const t = q[0]; q[0] = q[q.length-1]; q[q.length-1] = t; }
  s.queue = q;
}
function newSess(o){
  state.sess = Object.assign({ mode:'free', pool:[], label:'', queue:[], round:1, roundDone:0, last:null, byLang:{}, from:'home' }, o);
  state.xp = 0; state.session = 0; state.correctSession = 0; state.combo = 0;
}
function startSession(items, label, from){
  const pool = uniq(items);
  if (!pool.length){ toast('Nothing to practice'); return; }
  newSess({ pool, label, from:from||'home' });
  fillQueue(); nextCard();
  state.screen = 'lesson'; render();
}
function startLevel(lang){
  newSess({ mode:'level', lang, label:'Level' });
  fillLevelQueue();
  if (!state.sess.queue.length){ toast('No sentences in this language'); return; }
  nextCard();
  state.screen = 'lesson'; render();
}
function pickType(c){
  const en = enabledTypes(); let set = en;
  const s = state.sess;
  if (s.mode === 'level' && c.kind === 'new'){
    const n = SUB_NEW[lv(s.lang).sub].filter(t=>en.includes(t));
    if (n.length) set = n;
  }
  if (kn(c.sent).lang !== 'en'){ const w = set.filter(t=>t !== 'type-en'); if (w.length) set = w; }
  return set[Math.floor(Math.random()*set.length)];
}
function makeEx(c){
  const pool = lang_pool(c.sent.lang);
  const order = [c.forced || pickType(c)];
  const ex0 = buildExercise(c.sent, pool, order[0]);
  if (ex0) return ex0;
  for (const t of shuffle(enabledTypes().filter(x=>!isMatch(x)))){ const e = buildExercise(c.sent, pool, t); if (e) return e; }
  return buildExercise(c.sent, pool, 'bank-fl');
}
function needsIntro(sent){ return TYPE_ON.intro !== false && !INTRO_SEEN[sent.uid]; }
function showCard(c){
  state.cur = c; state.sess.last = c.sent.uid;
  state.flagged = !!FLAGS[c.sent.uid];
  if (needsIntro(c.sent)){
    state.ex = { type:'intro', sent:c.sent, lang:c.sent.lang };
    state.answer = null; state.feedback = null;
  } else {
    state.ex = makeEx(c); prepareAnswer();
  }
}
function introDone(){
  INTRO_SEEN[state.ex.sent.uid] = 1; saveLS(LS.intro, INTRO_SEEN);
  state.ex = makeEx(state.cur); prepareAnswer(); render();
}
function nextCard(){
  const s = state.sess;
  if (!s.queue.length){
    if (s.mode === 'level') fillLevelQueue();
    else { s.round++; s.roundDone = 0; fillQueue(); }
  }
  if (!s.queue.length){ exitSession(); return; }
  showCard(s.queue.shift());
}
function prepareAnswer(){
  state.feedback = null;
  state.flagged = !!FLAGS[state.ex.sent.uid];
  if (isBank(state.ex.type)){
    state.answer = [];
    state.usedBank = state.ex.bank.map(()=>false);
  } else if (state.ex.type === 'type-en'){
    state.answer = '';
  } else {
    state.answer = null;
  }
}
function exitSession(){
  const from = state.sess ? state.sess.from : 'home';
  state.screen = (from === 'group' && getGroup(state.gid)) ? 'group' : (from === 'flags' ? 'flags' : 'home');
  render(); toast('Progress saved ✓');
}

function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(t).then(()=>true, ()=>fallbackCopy(t));
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch(e){ return false; }
}

/* ==================== LIBRARY ACTIONS ==================== */
function transferGroups(gs, t, move){
  const lang = gs[0].lang;
  let msg;
  if (t.type === 'dup'){
    for (const g of gs) LIB.groups.push({ id:gid(), name:g.name + ' copy', lang:g.lang, items:g.items.map(x=>({ ...x })) });
    msg = 'Duplicated ' + gs.length + ' group' + (gs.length>1?'s':'');
  } else {
    let dest;
    if (t.type === 'new'){ dest = { id:gid(), name:t.name, lang, items:[] }; LIB.groups.push(dest); }
    else dest = getGroup(t.gid);
    const added = addUnique(dest, gs.flatMap(g=>g.items));
    msg = (move?'Moved ':'Copied ') + added + ' sentence' + (added===1?'':'s') + ' → ' + dest.name;
    if (move) LIB.groups = LIB.groups.filter(g=>!gs.includes(g));
  }
  afterLibChange(); toast(msg);
}
function transferSentences(g, uids, t, move){
  const items = g.items.filter(s=>uids.has(s.uid));
  let dest;
  if (t.type === 'new'){ dest = { id:gid(), name:t.name, lang:g.lang, items:[] }; LIB.groups.push(dest); }
  else dest = getGroup(t.gid);
  const added = addUnique(dest, items);
  if (move) g.items = g.items.filter(s=>!uids.has(s.uid));
  afterLibChange();
  toast((move?'Moved ':'Copied ') + added + ' sentence' + (added===1?'':'s') + ' → ' + dest.name);
}
function deleteGroups(gs){
  const n = gs.reduce((a,g)=>a+g.items.length, 0);
  if (!confirm('Delete ' + gs.length + ' group' + (gs.length>1?'s':'') + ' (' + n + ' sentences)? Your answer history is kept.')) return;
  LIB.groups = LIB.groups.filter(g=>!gs.includes(g));
  afterLibChange(); toast('Deleted');
}
function relabelGroup(g, nl){
  const old = g.lang; if (old === nl) return;
  const stillOld = new Set();
  for (const o of LIB.groups) if (o !== g && o.lang === old) o.items.forEach(s=>stillOld.add(s.uid));
  const map = {};
  for (const s of g.items){
    const nu = nl + ':' + s.uid.replace(/^[^:]*:/, '');
    if (nu !== s.uid){ if (!stillOld.has(s.uid)) map[s.uid] = nu; s.uid = nu; }
    s.lang = nl;
  }
  g.lang = nl;
  for (const a of ATTEMPTS) if (map[a.id]){ a.id = map[a.id]; a.lang = nl; }
  const nf = {}; for (const k of Object.keys(FLAGS)) nf[map[k] || k] = FLAGS[k]; FLAGS = nf;
  const ni = {}; for (const k of Object.keys(INTRO_SEEN)) ni[map[k] || k] = INTRO_SEEN[k]; INTRO_SEEN = ni;
  for (const c of Object.keys(LEVELS)){
    const d = LEVELS[c].done || {}, nd = {};
    for (const k of Object.keys(d)) nd[map[k] || k] = d[k];
    LEVELS[c].done = nd;
  }
  saveAttempts(); saveFlags(); saveLS(LS.intro, INTRO_SEEN); saveLS(LS.levels, LEVELS);
  if (ACTIVE.includes(old) && !ACTIVE.includes(nl)) ACTIVE.push(nl);
  afterLibChange();
  toast('Language changed to ' + LG(nl).name);
}
function singleLang(gs){
  const ls = [...new Set(gs.map(g=>g.lang))];
  if (ls.length > 1){ toast('Select groups of one language'); return null; }
  return ls[0];
}

/* Phone back button: moves between screens instead of closing the app */
function wantDepth(){
  if (state.screen === 'home') return 0;
  if (state.screen === 'addlang') return 2;
  if (state.screen === 'lesson') return (state.sess && (state.sess.from === 'group' || state.sess.from === 'flags')) ? 2 : 1;
  return 1;
}
function syncHistory(){
  if (ign > 0) return;
  const want = wantDepth();
  try {
    if (histDepth < want){ while (histDepth < want){ histDepth++; history.pushState({ d:histDepth }, ''); } }
    else if (histDepth > want){ const n = histDepth - want; histDepth = want; ign++; history.go(-n); }
  } catch(e){ ign = 0; }
}
window.addEventListener('popstate', ()=>{
  if (ign > 0){ ign--; if (ign === 0) syncHistory(); return; }
  if (sheetOn){ sheetOn = false; removeSheetDom(); return; }
  if (histDepth > 0){
    histDepth--;
    if (state.screen === 'lesson') exitSession();
    else if (state.screen === 'addlang'){ state.screen = 'store'; render(); }
    else { state.screen = 'home'; render(); }
  }
});

function renderLesson(){
  const f = document.createElement('div');
  const s = state.sess, ex = state.ex, L = LG(ex.lang);
  const pct = sessPct();

  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = `
    <button class="iconbtn" id="quitBtn" title="Finish">✕</button>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <span class="pill">⭐ ${state.xp}</span>`;
  f.appendChild(top);

  const wrap = document.createElement('div');
  wrap.className = 'exwrap';

  const KN = ex.kLang === 'en' ? 'English' : LG(ex.kLang).name;
  const instruction = {
    'bank-fl':'Build the ' + L.name + ' sentence',
    'choice-fl':'Choose the ' + L.name + ' translation',
    'type-en':'Translate to English',
    'choice-en':'Choose the ' + KN + ' translation',
    'bank-en':'Build the ' + KN + ' sentence',
    'match-en':'Pick the matching ' + KN + ' sentence',
    'match-fl':'Pick the matching ' + L.name + ' sentence',
    'intro':'New sentence',
  }[ex.type] || 'Translate';

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<h2>${esc(instruction)}</h2>`;
  const flag = document.createElement('button');
  flag.className = 'flagbtn' + (state.flagged?' on':'');
  flag.title = 'Flag this sentence (unsure?)';
  flag.textContent = '🚩';
  flag.onclick = ()=>{
    if (state.flagged){ delete FLAGS[ex.sent.uid]; state.flagged = false; toast('Flag removed'); }
    else { FLAGS[ex.sent.uid] = Date.now(); state.flagged = true; toast('Flagged 🚩'); }
    saveFlags(); flag.classList.toggle('on', state.flagged);
  };
  head.appendChild(flag);
  wrap.appendChild(head);

  if (ex.type === 'intro'){
    wrap.appendChild(buildIntro());
    f.appendChild(wrap); f.appendChild(buildFooter());
    setTimeout(()=>{ const q = f.querySelector('#quitBtn'); if (q) q.onclick = exitSession; }, 0);
    return f;
  }
  if (ex.prompt){
    const p = document.createElement('div');
    p.style.margin = '0 0 18px';
    if (ex.promptLang === 'fl'){
      let html = `<div style="font-size:26px;font-weight:800" class="${flc(ex.lang)}">${esc(displayFl(ex.sent))}</div>`;
      if (ex.sent.transliteration) html += `<div class="translit">${esc(ex.sent.transliteration)}</div>`;
      p.innerHTML = html;
    } else {
      p.innerHTML = knBlock(ex.sent, 26, true);
    }
    wrap.appendChild(p);
  }

  if (isBank(ex.type)) wrap.appendChild(buildBankUI());
  else if (ex.type === 'type-en') wrap.appendChild(buildTypeUI());
  else wrap.appendChild(buildChoiceUI());

  if (state.feedback) wrap.appendChild(buildCompare());

  f.appendChild(wrap);
  f.appendChild(buildFooter());
  setTimeout(()=>{ const q = f.querySelector('#quitBtn'); if (q) q.onclick = exitSession; }, 0);
  return f;
}

function buildBankUI(){
  const ex = state.ex;
  const aLang = ex.answerLang === 'fl' ? ex.lang : ex.kLang;
  const cls = kcls(aLang);
  const rtl = !!LG(aLang).rtl;
  const box = document.createElement('div');
  const zone = document.createElement('div');
  zone.className = 'answerzone' + (rtl?' rtl':'') + (state.answer.length?' filled':'');
  if (!state.answer.length){
    zone.innerHTML = `<div class="placeholder">Tap the words below…</div>`;
  } else {
    state.answer.forEach((tok, i)=>{
      const c = document.createElement('button');
      c.className = 'chip flat ' + cls;
      c.textContent = displayWord(tok, aLang);
      if (!state.feedback){
        c.onclick = ()=>{
          for (let bi=0; bi<ex.bank.length; bi++){
            if (state.usedBank[bi] && ex.bank[bi] === tok){ state.usedBank[bi] = false; break; }
          }
          state.answer.splice(i,1);
          render(true);
        };
      }
      zone.appendChild(c);
    });
  }
  box.appendChild(zone);
  const bank = document.createElement('div');
  bank.className = 'bank' + (rtl?' rtl':'');
  ex.bank.forEach((tok, i)=>{
    const c = document.createElement('button');
    c.className = 'chip ' + cls + (state.usedBank[i]?' used':'');
    c.textContent = displayWord(tok, aLang);
    c.onclick = ()=>{ state.usedBank[i] = true; state.answer.push(tok); render(true); };
    bank.appendChild(c);
  });
  box.appendChild(bank);
  return box;
}

function buildTypeUI(){
  const box = document.createElement('div');
  const ta = document.createElement('input');
  ta.type = 'text';
  ta.className = 'typein';
  ta.placeholder = 'Type the English translation…';
  ta.autocomplete = 'off'; ta.autocapitalize = 'off'; ta.spellcheck = false;
  ta.value = state.answer || '';
  ta.disabled = !!state.feedback;
  ta.oninput = ()=>{ state.answer = ta.value; syncFooter(); };
  ta.onkeydown = e=>{ if (e.key === 'Enter' && canSubmit() && !state.feedback) submit(); };
  box.appendChild(ta);
  setTimeout(()=>{ if (!state.feedback) ta.focus(); }, 30);
  return box;
}

function buildChoiceUI(){
  const ex = state.ex;
  const box = document.createElement('div');
  const aLang = ex.answerLang === 'fl' ? ex.lang : ex.kLang;
  ex.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'choice' + (aLang === 'en' ? '' : ' ' + flc(aLang));
    const os = ex.answerLang === 'en' && ex.optSent ? ex.optSent[opt] : null;
    b.innerHTML = `<div>${esc(displayFlFromText(opt, aLang))}</div>${os ? sideHTML(os, false) : ''}`;
    if (state.answer === opt) b.classList.add('sel');
    if (state.feedback){
      b.disabled = true;
      if (isMatch(ex.type)){
        b.classList.remove('sel');
        if (opt === ex.correct) b.classList.add('right');
        else if (opt === state.answer) b.classList.add('wrong');
      }
    }
    else b.onclick = ()=>{ state.answer = opt; render(true); };
    box.appendChild(b);
  });
  return box;
}

function hintHTML(h){
  const L = LG(h.lang);
  const sp = (L.arf && h.a.fl.length === 1 && h.b.fl.length === 1) ? stemSplit(h.a.fl[0], h.b.fl[0]) : null;
  const row = (side, i)=>`<div class="hintrow"><span class="${flc(h.lang)}">${esc(sp ? sp[i] : side.fl.map(w=>displayWord(w, h.lang)).join(' '))}</span> <b>↔</b> <span class="${kcls(h.kLang)}">${esc(side.en.map(w=>displayWord(w, h.kLang)).join(' '))}</span></div>`;
  return `<div class="cmp-row"><div class="cmp-label">What differs from the closest option</div>${row(h.a,0)}${row(h.b,1)}</div>`;
}
function buildMatchCompare(){
  const ex = state.ex, sent = ex.sent, lang = ex.lang, ok = state.feedback.correct;
  const box = document.createElement('div'); box.className = 'compare';
  const given = state.answer || '', gFl = ex.answerLang === 'fl';
  const aLang = gFl ? lang : ex.kLang;
  let html = `<div class="cmp-row ${ok?'good':''}"><div class="cmp-label">Correct</div>
    <div class="cmp-text ${flc(lang)}">${esc(displayFl(sent))}</div>
    ${sent.transliteration ? `<div class="translit">${esc(sent.transliteration)}</div>` : ''}
    <div class="cmp-text ${kcls(kn(sent).lang)}">${esc(knText(sent))}</div>${sideHTML(sent, true)}${fbNote(sent)}</div>`;
  if (!ok) html += `<div class="cmp-row bad"><div class="cmp-label">Your answer</div>
    <div class="cmp-text ${kcls(aLang)}">${esc(displayFlFromText(given, aLang))}</div></div>`;
  if (ex.hint && HINTS_ON) html += hintHTML(ex.hint);
  box.innerHTML = html; return box;
}
function buildIntro(){
  const ex = state.ex, s = ex.sent, L = LG(ex.lang);
  const box = document.createElement('div'); box.className = 'introcard';
  const aw = s.target.split(/\s+/).filter(Boolean), tw = (s.transliteration||'').split(/\s+/).filter(Boolean);
  let body;
  if (tw.length && tw.length === aw.length){
    body = `<div class="iwrap${L.rtl?' rtl':''}">${aw.map((w,i)=>`<div class="iw"><div class="w ${flc(ex.lang)}">${esc(displayWord(w, ex.lang))}</div><div class="translit">${esc(tw[i])}</div></div>`).join('')}</div>`;
  } else {
    body = `<div class="iwrap${L.rtl?' rtl':''}"><div class="iw"><div class="w ${flc(ex.lang)}">${esc(displayFl(s))}</div>${s.transliteration ? `<div class="translit">${esc(s.transliteration)}</div>` : ''}</div></div>`;
  }
  box.innerHTML = `<div class="introtag">New · you will see it once</div>${body}<div class="intro-en">${knBlock(s, 21, true)}</div>`;
  return box;
}
function buildCompare(){
  if (isMatch(state.ex.type)) return buildMatchCompare();
  const ex = state.ex;
  const isFl = ex.answerLang === 'fl';
  const aLang = isFl ? ex.lang : ex.kLang;
  const given = Array.isArray(state.answer) ? joinToks(state.answer, aLang) : (state.answer || '');
  const box = document.createElement('div');
  box.className = 'compare';
  const cls = kcls(aLang);

  let expectedHtml;
  if (isFl){
    expectedHtml = `<div class="cmp-text ${cls}">${esc(displayFl(ex.sent))}</div>`;
    if (ex.sent.transliteration) expectedHtml += `<div class="translit">${esc(ex.sent.transliteration)}</div>`;
  } else {
    expectedHtml = `<div class="cmp-text ${cls}">${esc(displayFlFromText(ex.correct, aLang))}</div>${sideHTML(ex.sent, true)}${fbNote(ex.sent)}`;
  }
  let givenHtml;
  if (given){
    givenHtml = `<div class="cmp-text ${cls}">${esc(displayFlFromText(given, aLang))}</div>`;
  } else {
    givenHtml = `<div class="cmp-text ${cls} ${given?'':'empty'}">${given?esc(given):'(empty)'}</div>`;
  }
  box.innerHTML = `
    <div class="cmp-row">
      <div class="cmp-label">Expected</div>
      ${expectedHtml}
    </div>
    <div class="cmp-row ${state.feedback.correct?'good':'bad'}">
      <div class="cmp-label">Your answer</div>
      ${givenHtml}
    </div>`;
  return box;
}

function canSubmit(){
  const ex = state.ex; if (!ex) return false;
  if (isBank(ex.type)) return state.answer && state.answer.length > 0;
  if (ex.type === 'type-en') return !!(state.answer && state.answer.trim());
  return !!state.answer;
}

function buildFooter(){
  const f = document.createElement('div');
  f.className = 'footer';
  f.id = 'footer';
  const inner = document.createElement('div');
  inner.className = 'footer-inner';
  if (state.ex.type === 'intro'){
    inner.innerHTML = `<button class="btn btn-green" id="gotBtn" style="width:100%">Got it</button>`;
    setTimeout(()=>{ inner.querySelector('#gotBtn').onclick = introDone; }, 0);
  } else if (state.feedback && isMatch(state.ex.type)){
    const ok = state.feedback.correct;
    inner.innerHTML = `<div class="rate-title">${ok ? '<b style="color:var(--green-t)">✓ Correct</b>' : '<b style="color:var(--red-t)">✗ Not quite</b>'}</div>
      <button class="btn ${ok?'btn-green':'btn-red'}" id="contBtn" style="width:100%">Continue</button>`;
    setTimeout(()=>{ inner.querySelector('#contBtn').onclick = ()=>rate(state.feedback.correct); }, 0);
  } else if (state.feedback){
    const suggested = state.feedback.correct;
    inner.innerHTML = `
      <div class="rate-title">
        ${suggested
          ? `Looks correct — <b style="color:var(--green-t)">rate it</b>`
          : `Doesn't match — <b style="color:var(--red-t)">rate yourself</b>`}
      </div>
      <div class="rate-row">
        <button class="btn btn-red" id="wrongBtn">✗ I was wrong</button>
        <button class="btn btn-green" id="rightBtn">✓ I was right</button>
      </div>
      <div class="footer-hint">The suggestion is only a hint. Trust yourself.</div>`;
    setTimeout(()=>{
      inner.querySelector('#wrongBtn').onclick = ()=>rate(false);
      inner.querySelector('#rightBtn').onclick = ()=>rate(true);
    }, 0);
  } else {
    inner.innerHTML = `
      <div class="footer-row">
        <div class="sessmeta">${esc(sessMeta())}</div>
        <button class="btn btn-green" id="checkBtn" ${canSubmit()?'':'disabled'}>Check</button>
      </div>`;
    setTimeout(()=>{
      const cb = inner.querySelector('#checkBtn');
      if (cb) cb.onclick = ()=>submit();
    }, 0);
  }
  f.appendChild(inner);
  return f;
}

function syncFooter(){
  const cb = document.querySelector('#checkBtn');
  if (cb) cb.disabled = !canSubmit();
}

function submit(){
  const ex = state.ex;
  if (!canSubmit()) return;
  let suggested = false;
  const givenStr = Array.isArray(state.answer) ? joinToks(state.answer, ex.answerLang === 'fl' ? ex.lang : ex.kLang) : (state.answer || '');
  if (ex.type === 'bank-fl'){
    suggested = normFl(givenStr, ex.lang) === normFl(ex.correct, ex.lang);
  } else if (ex.type === 'bank-en' || ex.type === 'type-en'){
    if (ex.kLang === 'en'){
      const g = normEn(givenStr), c = normEn(ex.correct);
      suggested = g === c || (lev(g,c) <= 2 && c.length > 10);
    } else suggested = normFl(givenStr, ex.kLang) === normFl(ex.correct, ex.kLang);
  } else {
    suggested = givenStr === ex.correct;
  }
  state.feedback = { correct:suggested, given:givenStr };
  render(true);
}

function rate(userSaysCorrect){
  const ex = state.ex, s = state.sess;
  const given = state.feedback.given;
  ATTEMPTS.push({
    t:Date.now(), id:ex.sent.uid, lang:ex.lang, type:ex.type,
    prompt: ex.prompt || ex.sent.target,
    expected: ex.correct, given,
    correct: !!userSaysCorrect,
    flagged: !!FLAGS[ex.sent.uid],
    autoSuggested: state.feedback.correct,
  });
  if (ATTEMPTS.length > 4000) ATTEMPTS = ATTEMPTS.slice(-4000);
  saveAttempts();

  STATS.total = (STATS.total||0) + 1;
  state.session++; s.roundDone++;
  if (userSaysCorrect){
    STATS.correct = (STATS.correct||0) + 1;
    state.combo = (state.combo||0) + 1;
    const bonus = Math.min(5, state.combo);
    state.xp += 10 + bonus; STATS.xp = (STATS.xp||0) + 10 + bonus;
    state.correctSession++;
  } else {
    state.combo = 0;
    s.queue.splice(Math.min(s.queue.length, 3), 0, { sent:ex.sent, forced:ex.type });
  }
  if (s.mode === 'level' && state.cur && state.cur.kind === 'new'){
    lv(s.lang).done[ex.sent.uid] = 1; saveLS(LS.levels, LEVELS);
    if (advanceIfDone(s.lang)) fillLevelQueue();
  }
  touchStreak();
  saveStats();
  nextCard();
  render();
}

// Every .txt/.csv file placed in the repository's `languages` folder (or next to index.html) appears here automatically.
const STORE_REPO = '';   // optional override, e.g. 'user/repo'; empty = detected from the github.io address
const STORE_SKIP = /^(readme|license|licence|notice|robots|manifest)/i;
state.store = { status:'idle', packs:[], busy:{} };
function storeRepo(){
  if (STORE_REPO) return STORE_REPO;
  const h = location.hostname;
  if (!/\.github\.io$/i.test(h)) return '';
  const owner = h.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return owner + '/' + ((seg && seg.indexOf('.') < 0) ? seg : owner + '.github.io');
}
async function listDir(repo, dir){
  const r = await fetch('https://api.github.com/repos/' + repo + '/contents/' + dir, { headers:{ Accept:'application/vnd.github+json' } });
  if (r.status === 404) return [];
  if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json();
  return Array.isArray(j) ? j.filter(x=>x.type === 'file') : [];
}
function openStore(){ state.screen = 'store'; render(); loadCatalog(); }
async function loadCatalog(){
  const st = state.store; st.status = 'loading';
  if (state.screen === 'store') render(true);
  try {
    const repo = storeRepo(); if (!repo) throw new Error('no repo');
    const [a, b] = await Promise.all([listDir(repo, 'languages'), listDir(repo, '')]);
    const seen = new Set(), packs = [];
    for (const f of a.concat(b)){
      if (!/\.(txt|csv)$/i.test(f.name) || STORE_SKIP.test(f.name)) continue;
      const stem = f.name.replace(/\.[^.]+$/, '').toLowerCase();
      if (seen.has(stem)) continue; seen.add(stem);
      packs.push({ id:stem, file:f.path, bytes:f.size, rev:f.sha });
    }
    st.packs = packs; st.status = 'ok';
  } catch(e){ st.status = 'error'; }
  if (state.screen === 'store') render(true);
}
// which language is this file? 1) header of the 4th column  2) file name  3) script of the text
function guessPackLang(text, stem){
  let hdr = null;
  try { hdr = rowsToItems(parseCSVRows(text)).hint; } catch(e){}
  return hdr || langFromName(stem) || parseAny(text).hint || null;
}
function askLang(stem){
  return new Promise(resolve=>{
    let done = false;
    const fin = v=>{ if (!done){ done = true; resolve(v); } };
    openSheet((sh, close)=>{
      const codes = Object.keys(LANGS).sort((a,b)=>LANGS[a].name.localeCompare(LANGS[b].name));
      sh.innerHTML = `<h3>Which language is “${esc(stem)}”?</h3>
        <select class="field" id="alSel">${codes.map(c=>`<option value="${c}">${esc(LANGS[c].name)} — ${esc(LANGS[c].native)}</option>`).join('')}</select>
        <div class="sheet-actions"><button class="btn btn-ghost" id="alC">Cancel</button><button class="btn btn-green" id="alOk">Add</button></div>`;
      sh.querySelector('#alC').onclick = ()=>{ close(); fin(null); };
      sh.querySelector('#alOk').onclick = ()=>{ const v = sh.querySelector('#alSel').value; close(); fin(v); };
      sh.parentNode.addEventListener('click', e=>{ if (e.target === sh.parentNode) fin(null); });
    });
  });
}
async function installPack(p){
  const st = state.store; if (st.busy[p.id]) return;
  st.busy[p.id] = true; render(true);
  try {
    const r = await fetch(new URL(p.file, location.href), { cache:'no-cache' });
    if (!r.ok) throw new Error('http ' + r.status);
    const text = (await r.text()).replace(/^\uFEFF/, '');
    const parsed = parseAny(text);
    if (!parsed.rows.length) throw new Error('empty');
    const dest = LIB.groups.find(g=>g.pack && g.pack.id === p.id);
    const lang = dest ? dest.lang : (guessPackLang(text, p.id) || await askLang(p.id));
    if (lang){
      const name = LG(lang).name;
      const wasEmpty = !LIB.groups.length;
      const res = importItems(parsed.rows, lang, false, new Set(BY_UID.keys()));
      if (!res.items.length && !dest){ toast('Already in your library'); }
      else {
        if (dest){ dest.items.push(...res.items); dest.pack = { id:p.id, rev:p.rev }; }
        else LIB.groups.push({ id:gid(), name, lang, items:res.items, pack:{ id:p.id, rev:p.rev } });
        ACTIVE = wasEmpty ? [lang] : (ACTIVE.includes(lang) ? ACTIVE : [...ACTIVE, lang]);
        saveLS(LS.langs, ACTIVE);
        afterLibChange();
        toast(dest ? (res.items.length ? 'Updated · ' + res.items.length + ' new' : 'Up to date') : name + ' added · ' + res.items.length + ' sentences');
      }
    }
  } catch(e){ toast("Couldn't download. Check your connection and try again."); }
  delete st.busy[p.id];
  if (state.screen === 'store') render(true);
}
function renderStore(){
  const f = document.createElement('div'), st = state.store;

      const outdated = inst && p.rev && inst.pack.rev !== p.rev;

        <div class="deck-body"><div class="deck-title">${esc(lb.name)}${lb.native && lb.native !== lb.name ? `<span class="lbadge" style="text-transform:none">${esc(lb.native)}</span>` : ''}</div>
        <div class="deck-sub">${p.bytes ? Math.max(1, Math.round(p.bytes/1024)) + ' KB' : ''}</div></div>
        <button class="btn ${inst && !outdated ? 'btn-ghost' : outdated ? 'btn-blue' : 'btn-green'} btn-sm" ${busy || (inst && !outdated) ? 'disabled' : ''}>${busy ? '…' : inst ? (outdated ? 'Update' : 'Added ✓') : 'Get'}</button>`;
      el.querySelector('button').onclick = ()=>installPack(p);
      box.appendChild(el);
    });
  }
  f.querySelector('#backBtn').onclick = ()=>{ state.screen = 'home'; render(); };
  f.querySelector('#stImp').onclick = ()=>document.getElementById('fileInput').click();
  f.querySelector('#stAdv').onclick = ()=>{ state.al.tr = !!LG(state.al.lang).translit; state.screen = 'addlang'; render(); };
  return f;
}

/* ==================== BACKUP ==================== */
function buildBackup(){
  const data = {};
  for (let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k.indexOf('arTrainer:') === 0 && k.indexOf('arTrainer:bak:') !== 0) data[k] = localStorage.getItem(k);
  }
  return JSON.stringify({ app:'arTrainer', version:1, exported:new Date().toISOString(), data });
}
function exportData(){
  const text = buildBackup(), name = 'language-trainer-backup-' + todayStr() + '.json';
  const file = new File([text], name, { type:'application/json' });
  if (navigator.canShare && navigator.canShare({ files:[file] }))
    navigator.share({ files:[file] }).catch(e=>{ if (!e || e.name !== 'AbortError') download(name, text, 'application/json'); });
  else download(name, text, 'application/json');
}
function restoreBackup(text){
  let obj;
  try { obj = JSON.parse(String(text).replace(/^\uFEFF/, '')); } catch(e){ return { ok:false, msg:'Not a valid backup file' }; }
  if (!obj || obj.app !== 'arTrainer' || !obj.data || typeof obj.data !== 'object') return { ok:false, msg:'Not a valid backup file' };
  const keys = Object.keys(obj.data).filter(k=>k.indexOf('arTrainer:') === 0 && k.indexOf('arTrainer:bak:') !== 0 && typeof obj.data[k] === 'string');
  if (!keys.length || keys.indexOf(LS.lib) < 0) return { ok:false, msg:'Backup has no library' };
  try { localStorage.setItem('arTrainer:bak:preimport', buildBackup()); } catch(e){}
  const old = [];
  for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k.indexOf('arTrainer:') === 0 && k.indexOf('arTrainer:bak:') !== 0) old.push(k); }
  old.forEach(k=>localStorage.removeItem(k));
  try { keys.forEach(k=>localStorage.setItem(k, obj.data[k])); }
  catch(e){ return { ok:false, msg:'Storage full — restore failed' }; }
  return { ok:true, msg:'Restored', date:(obj.exported||'').slice(0,10) };
}
document.getElementById('dataInput').addEventListener('change', async e=>{
  const f = (e.target.files || [])[0]; e.target.value = '';
  if (!f) return;
  const text = await f.text();
  let probe = null; try { probe = JSON.parse(text); } catch(err){}
  const when = probe && probe.exported ? probe.exported.slice(0,10) : 'unknown date';
  if (!probe || probe.app !== 'arTrainer'){ toast('Not a valid backup file'); return; }
  if (!confirm('Replace ALL data on this device with the backup from ' + when + '?')) return;
  const r = restoreBackup(text);
  if (!r.ok){ toast(r.msg); return; }
  try { location.reload(); } catch(err){ toast('Restored — reload the page'); }
});
