<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Language Trainer V2.5</title>
<style>
  /* ==================== CSS VARIABLES & THEMES ==================== */
  :root {
    --bg-color: #ffffff;
    --bg-secondary: #f7f7f7;
    --primary: #58cc02;
    --primary-hover: #46a302;
    --text-color: #3c3c3c;
    --text-secondary: #777777;
    --border-color: #e5e5e5;
    --danger: #ff4b4b;
    --card-bg: #ffffff;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  [data-theme="paper"] {
    --bg-color: #f5efe3; --bg-secondary: #fbf7ee; --primary: #8c2f1b; --primary-hover: #6d2415;
    --text-color: #2a2118; --border-color: #d4c5b0; --card-bg: #fbf7ee;
    --font-main: "Georgia", "Times New Roman", serif;
  }
  [data-theme="terminal"] {
    --bg-color: #0a0f0a; --bg-secondary: #101810; --primary: #3dff7a; --primary-hover: #2bc55e;
    --text-color: #b6ffcb; --border-color: #1f3322; --card-bg: #101810;
    --font-main: "Courier New", monospace;
  }
  [data-theme="aurora"] {
    --bg-color: #1b1740; --bg-secondary: #2a2563; --primary: #8b7bff; --primary-hover: #6d5ce7;
    --text-color: #eef0ff; --border-color: #3d387a; --card-bg: #2a2563;
  }
  [data-theme="brutal"] {
    --bg-color: #fff3b0; --bg-secondary: #ffffff; --primary: #ff4f81; --primary-hover: #e03e6e;
    --text-color: #111111; --border-color: #111111; --card-bg: #ffffff;
    --shadow: 4px 4px 0px #111111;
  }
  [data-theme="zen"] {
    --bg-color: #f1ece1; --bg-secondary: #faf7f0; --primary: #6f9275; --primary-hover: #5a7a60;
    --text-color: #3b3a33; --border-color: #d8d0c0; --card-bg: #faf7f0;
  }

  /* ==================== BASE STYLES ==================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-main);
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* RTL/LTR Utilities for Note Rendering */
  .rtl-segment { direction: rtl; unicode-bidi: isolate; display: inline-flex; }
  .ltr-segment { direction: ltr; unicode-bidi: isolate; display: inline-flex; }
  .auto-dir { direction: auto; unicode-bidi: plaintext; }

  .app-container { max-width: 800px; margin: 0 auto; padding: 16px; width: 100%; flex: 1; }
  
  /* Buttons & Inputs */
  .btn {
    padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer;
    font-weight: 700; font-size: 15px; transition: all 0.2s;
    background: var(--bg-secondary); color: var(--text-color); border: 2px solid var(--border-color);
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

  .field {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--border-color);
    background: var(--card-bg); color: var(--text-color); font-family: inherit; font-size: 15px;
    margin-bottom: 12px;
  }
  .field:focus { outline: none; border-color: var(--primary); }

  /* Cards & Layout */
  .card {
    background: var(--card-bg); border-radius: 16px; padding: 24px;
    box-shadow: var(--shadow); border: 2px solid var(--border-color); margin-bottom: 16px;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 2px solid var(--border-color);
  }
  .topbar h2 { flex: 1; font-size: 20px; font-weight: 800; }

  /* Exercise View */
  .exercise-card { text-align: center; min-height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .sentence-display { font-size: 28px; font-weight: 700; margin-bottom: 16px; line-height: 1.8; }
  .translation-display { font-size: 18px; color: var(--text-secondary); margin-bottom: 24px; font-style: italic; }
  .exercise-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  
  /* Notes & Tags */
  .nt { background: rgba(88, 204, 2, 0.2); border-radius: 4px; padding: 0 4px; cursor: pointer; border-bottom: 2px solid var(--primary); }
  .nt:hover { background: rgba(88, 204, 2, 0.4); }
  .ntag {
    display: inline-block; background: var(--bg-secondary); border: 1px solid var(--border-color);
    border-radius: 20px; padding: 2px 10px; font-size: 12px; margin: 2px; color: var(--text-secondary);
  }
  .tchip {
    background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 4px 12px; font-size: 13px; cursor: pointer; margin: 2px; transition: all 0.2s;
  }
  .tchip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Flexible Tag Table */
  .tag-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
  .tag-table th, .tag-table td { border: 1px solid var(--border-color); padding: 10px; text-align: center; }
  .tag-table th { background: var(--bg-secondary); font-weight: 700; }
  .tag-table td[contenteditable="true"]:focus { outline: 2px solid var(--primary); background: var(--bg-secondary); }

  /* Custom CSS Area */
  .css-editor {
    width: 100%; height: 200px; font-family: var(--font-mono); font-size: 13px;
    background: #1e1e1e; color: #d4d4d4; border-radius: 8px; padding: 12px; direction: ltr; text-align: left;
  }

  /* Onboarding Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--card-bg); border-radius: 20px; padding: 32px; max-width: 500px; width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
  }
  .hidden { display: none !important; }

  /* Theme Grid */
  .themegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
  .themecard {
    border: 2px solid var(--border-color); border-radius: 12px; padding: 12px; cursor: pointer;
    background: var(--card-bg); text-align: center; transition: all 0.2s;
  }
  .themecard.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
  .tsw { display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .tsw i { flex: 1; display: block; }

  /* V2.6 Roadmap */
  .roadmap-item { padding: 12px; background: var(--bg-secondary); border-radius: 8px; margin-bottom: 8px; border-right: 4px solid var(--primary); }
  .roadmap-item h4 { margin-bottom: 4px; }
  .roadmap-item p { font-size: 13px; color: var(--text-secondary); }

  /* Responsive */
  @media (max-width: 600px) {
    .sentence-display { font-size: 22px; }
    .exercise-actions { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- Views will be injected here by JavaScript -->
</div>

<!-- Custom CSS Injection -->
<style id="user-custom-css"></style>

<script>
/* ========================================================================
   LANGUAGE TRAINER V2.5 - Single File Application
   Features: Anki-like queue resume, Back button, RTL/LTR note fixing,
   Flexible tag translation table, Custom CSS, Onboarding, UI Translation.
   ======================================================================== */

// ==================== STATE & LOCALSTORAGE ====================
const LS = {
  theme: 'arTrainer:theme', customCss: 'arTrainer:customCss', queue: 'arTrainer:queue',
  notes: 'arTrainer:notes', onboarding: 'arTrainer:onboarding', uiLang: 'arTrainer:uiLang',
  tagMap: 'arTrainer:tagMap', knownWords: 'arTrainer:knownWords', groups: 'arTrainer:groups'
};

let state = {
  view: 'home',
  queue: [],
  queueIndex: 0,
  cardHistory: [], // For "Back" button
  currentCard: null,
  showAnswer: false,
  uiLang: 'ar'
};

// Load helpers
const loadLS = (key, def) => { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } };
const saveLS = (key, val) => localStorage.setItem(key, JSON.stringify(val));

// Initialize Data
let NOTES = loadLS(LS.notes, []);
let TAG_MAP = loadLS(LS.tagMap, {
  "pronoun_2nd": { en: ["you"], ar: ["أنتَ", "أنتِ"], fr: ["tu", "vous"] },
  "noun_definite": { en: ["the (definite)"], ar: ["ألـ التعريف"], fr: ["le, la, les"] }
});
let KNOWN_WORDS = loadLS(LS.knownWords, []);
let GROUPS = loadLS(LS.groups, [
  { id: 'g1', name: 'Default Arabic', lang: 'ar', items: [
    { uid: 's1', target: 'الكتابُ جديدٌ', translation: 'The book is new', lang: 'ar' },
    { uid: 's2', target: 'ذهبتُ إلى المدرسةِ', translation: 'I went to school', lang: 'ar' }
  ]}
]);

// ==================== UI TRANSLATION DICTIONARY ====================
const UI_STRINGS = {
  ar: { home: 'الرئيسية', exercise: 'تمرين', notes: 'الملاحظات', settings: 'الإعدادات', back: 'رجوع', next: 'التالي', showAnswer: 'إظهار الإجابة', editTranslation: 'تعديل الترجمة', addNote: 'إضافة ملاحظة', tags: 'الوسوم', customCss: 'CSS مخصص', resume: 'استئناف الجلسة', newSession: 'جلسة جديدة', knownWordsTest: 'اختبار الكلمات المعروفة', tagTranslator: 'مترجم الوسوم المرن', onboardingTitle: 'مرحباً بك في Language Trainer' },
  en: { home: 'Home', exercise: 'Exercise', notes: 'Notes', settings: 'Settings', back: 'Back', next: 'Next', showAnswer: 'Show Answer', editTranslation: 'Edit Translation', addNote: 'Add Note', tags: 'Tags', customCss: 'Custom CSS', resume: 'Resume Session', newSession: 'New Session', knownWordsTest: 'Known Words Test', tagTranslator: 'Flexible Tag Translator', onboardingTitle: 'Welcome to Language Trainer' }
};
const t = (key) => (UI_STRINGS[state.uiLang] || UI_STRINGS['ar'])[key] || key;

// ==================== CORE FUNCTIONS ====================
function init() {
  applyTheme(loadLS(LS.theme, 'classic'));
  applyCustomCSS();
  
  const onboard = loadLS(LS.onboarding, null);
  if (!onboard) {
    showOnboarding();
  } else {
    state.uiLang = loadLS(LS.uiLang, 'ar');
    checkQueueResume();
  }
}

function applyTheme(id) {
  document.documentElement.setAttribute('data-theme', id);
  saveLS(LS.theme, id);
}

function applyCustomCSS() {
  const css = loadLS(LS.customCss, '');
  document.getElementById('user-custom-css').textContent = css;
}

// ==================== QUEUE & RESUME LOGIC (Anki-like) ====================
function checkQueueResume() {
  const saved = loadLS(LS.queue, null);
  if (saved && (Date.now() - saved.timestamp < 86400000)) { // Valid for 24h
    if (confirm(t('resume') + '?')) {
      state.queue = saved.queue;
      state.queueIndex = saved.index;
      state.view = 'exercise';
    } else {
      clearQueue();
    }
  }
  render();
}

function saveQueue() {
  saveLS(LS.queue, { queue: state.queue, index: state.queueIndex, timestamp: Date.now() });
}

function clearQueue() {
  state.queue = [];
  state.queueIndex = 0;
  state.cardHistory = [];
  localStorage.removeItem(LS.queue);
}

function pushHistory() {
  if (state.currentCard) {
    state.cardHistory.push(JSON.parse(JSON.stringify({
      card: state.currentCard,
      showAnswer: state.showAnswer,
      queueIndex: state.queueIndex
    })));
    if (state.cardHistory.length > 10) state.cardHistory.shift();
  }
}

function goBack() {
  if (state.cardHistory.length > 0) {
    const prev = state.cardHistory.pop();
    state.currentCard = prev.card;
    state.showAnswer = prev.showAnswer;
    state.queueIndex = prev.queueIndex;
    renderExercise();
  }
}

// ==================== EXERCISE VIEW ====================
function startExercise(groupId) {
  const group = GROUPS.find(g => g.id === groupId);
  if (!group) return;
  
  // Build queue (simplified SRS: random shuffle for demo)
  state.queue = [...group.items].sort(() => Math.random() - 0.5);
  state.queueIndex = 0;
  state.cardHistory = [];
  state.view = 'exercise';
  saveQueue();
  render();
}

function renderExercise() {
  if (state.queueIndex >= state.queue.length) {
    state.view = 'home';
    clearQueue();
    render();
    return;
  }

  const card = state.queue[state.queueIndex];
  state.currentCard = card;
  const isRtl = card.lang === 'ar';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-sm btn-ghost" onclick="goBack()" ${state.cardHistory.length === 0 ? 'disabled' : ''}>← ${t('back')}</button>
      <h2>${state.queueIndex + 1} / ${state.queue.length}</h2>
      <button class="btn btn-sm btn-ghost" onclick="state.view='home';render()">✕</button>
    </div>
    <div class="card exercise-card">
      <div class="sentence-display auto-dir" dir="${isRtl ? 'rtl' : 'ltr'}">${highlightNotes(card.target, card.lang)}</div>
      
      ${state.showAnswer ? `
        <div class="translation-display auto-dir">${card.translation || '(No translation)'}</div>
        <div style="margin-bottom:16px;">
          <button class="btn btn-sm btn-ghost" onclick="editTranslationInline('${card.uid}')">✎ ${t('editTranslation')}</button>
          <button class="btn btn-sm btn-ghost" onclick="openNoteEditor({sent: state.currentCard})">+ ${t('addNote')}</button>
        </div>
        <div class="exercise-actions">
          <button class="btn btn-danger" onclick="rateCard('again')">Again</button>
          <button class="btn btn-primary" onclick="rateCard('good')">Good</button>
          <button class="btn btn-primary" style="background:#1cb0f6;border-color:#1cb0f6" onclick="rateCard('easy')">Easy</button>
        </div>
      ` : `
        <div class="exercise-actions">
          <button class="btn btn-primary" style="width:200px" onclick="revealAnswer()">${t('showAnswer')}</button>
        </div>
      `}
    </div>
  `;
}

function revealAnswer() {
  pushHistory();
  state.showAnswer = true;
  renderExercise();
}

function rateCard(rating) {
  // In a full app, this updates SRS intervals. Here we just advance.
  state.queueIndex++;
  state.showAnswer = false;
  saveQueue();
  renderExercise();
}

function editTranslationInline(uid) {
  const newTrans = prompt(t('editTranslation') + ':', state.currentCard.translation);
  if (newTrans !== null) {
    state.currentCard.translation = newTrans;
    // Update in groups
    for (const g of GROUPS) {
      const item = g.items.find(i => i.uid === uid);
      if (item) { item.translation = newTrans; break; }
    }
    saveLS(LS.groups, GROUPS);
    renderExercise();
  }
}

// ==================== NOTES & RTL/LTR FIX ====================
function highlightNotes(text, lang) {
  // Simplified highlighter. In full app, matches NOTE_IDX.
  // Fix for "word after prefix renders as suffix": use unicode-bidi: isolate
  let html = esc(text);
  // Demo: wrap known patterns if they exist in notes
  NOTES.forEach(n => {
    if (n.lang === lang && text.includes(n.text)) {
      const cls = (lang === 'ar') ? 'rtl-segment' : 'ltr-segment';
      html = html.replace(new RegExp(esc(n.text), 'g'), `<span class="nt ${cls}" onclick="openNoteView('${n.id}')">${esc(n.text)}</span>`);
    }
  });
  return html;
}

function openNoteEditor(o = {}) {
  const lang = o.sent ? o.sent.lang : 'ar';
  const tagSet = new Set(o.note ? o.note.tags : []);
  
  // Dynamic tag chips including secondary languages
  const allTags = [...new Set([...tagSet, 'noun', 'verb', 'prefix', 'suffix', 'اسم', 'فعل', 'حرف جر'])];
  
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <h3>${o.note ? 'Edit Note' : 'Add Note'}</h3>
      <div class="hint" style="margin:12px 0; color:var(--text-secondary)">
        Tap a word, then select the exact part (prefix, suffix, or full word). 
        <br><b>RTL Fix:</b> Prefixes and suffixes are isolated to prevent rendering flips.
      </div>
      <input class="field auto-dir" id="nPat" value="${o.note ? esc(o.note.text) : ''}" placeholder="Pattern / Word">
      <select class="field" id="nType">
        <option value="word" ${o.note?.type==='word'?'selected':''}>Word (كلمة)</option>
        <option value="prefix" ${o.note?.type==='prefix'?'selected':''}>Prefix (بادئة)</option>
        <option value="suffix" ${o.note?.type==='suffix'?'selected':''}>Suffix (لاحقة)</option>
        <option value="infix" ${o.note?.type==='infix'?'selected':''}>Infix (داخل الكلمة)</option>
      </select>
      <textarea class="field" id="nTxt" rows="3" placeholder="Meaning / Note (can be in any language)">${o.note ? esc(o.note.note) : ''}</textarea>
      
      <div style="margin:12px 0"><b>${t('tags')} (Any Language):</b></div>
      <div id="nChips" style="margin-bottom:12px"></div>
      <div style="display:flex;gap:8px">
        <input class="field" id="nTagIn" placeholder="New tag (e.g., 'اسم')" style="margin-bottom:0">
        <button class="btn btn-sm btn-primary" id="nTagAdd">Add</button>
      </div>

      <div style="display:flex;gap:12px;margin-top:20px">
        <button class="btn btn-ghost" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" id="nSave">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const paintTags = () => {
    const box = modal.querySelector('#nChips');
    box.innerHTML = allTags.map(tag => 
      `<button class="tchip ${tagSet.has(tag)?'on':''}" data-tag="${esc(tag)}">${esc(tag)}</button>`
    ).join('');
    box.querySelectorAll('.tchip').forEach(btn => {
      btn.onclick = () => {
        const tg = btn.dataset.tag;
        tagSet.has(tg) ? tagSet.delete(tg) : tagSet.add(tg);
        paintTags();
      };
    });
  };
  paintTags();

  modal.querySelector('#nTagAdd').onclick = () => {
    const v = modal.querySelector('#nTagIn').value.trim();
    if (v) { tagSet.add(v); allTags.push(v); modal.querySelector('#nTagIn').value = ''; paintTags(); }
  };

  modal.querySelector('#nSave').onclick = () => {
    const pat = modal.querySelector('#nPat').value.trim();
    if (!pat) return alert('Pattern required');
    
    if (o.note) {
      o.note.text = pat;
      o.note.type = modal.querySelector('#nType').value;
      o.note.note = modal.querySelector('#nTxt').value.trim();
      o.note.tags = [...tagSet];
    } else {
      NOTES.push({
        id: 'n' + Date.now(), lang: lang, type: modal.querySelector('#nType').value,
        text: pat, note: modal.querySelector('#nTxt').value.trim(), tags: [...tagSet], created: Date.now()
      });
    }
    saveLS(LS.notes, NOTES);
    modal.remove();
    if (state.view === 'exercise') renderExercise();
    else if (state.view === 'notes') renderNotes();
  };
}

function openNoteView(noteId) {
  const n = NOTES.find(x => x.id === noteId);
  if (!n) return;
  alert(`Note: ${n.text}\nType: ${n.type}\nMeaning: ${n.note}\nTags: ${n.tags.join(', ')}`);
}

// ==================== FLEXIBLE TAG TRANSLATOR TABLE ====================
function renderTagTranslator() {
  const app = document.getElementById('app');
  const langs = ['en', 'ar', 'fr']; // Extensible
  
  let tableRows = '';
  for (const [conceptId, mappings] of Object.entries(TAG_MAP)) {
    tableRows += `<tr data-id="${conceptId}">
      <td><button class="btn btn-sm btn-danger" onclick="deleteTagRow('${conceptId}')">×</button> ${conceptId}</td>
      ${langs.map(lang => `<td contenteditable="true" onblur="updateTagCell('${conceptId}', '${lang}', this.innerText)">${(mappings[lang] || []).join(' ، ')}</td>`).join('')}
    </tr>`;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-sm btn-ghost" onclick="state.view='home';render()">← ${t('home')}</button>
      <h2>${t('tagTranslator')}</h2>
    </div>
    <div class="card">
      <p class="hint" style="margin-bottom:16px">
        هذا الجدول مرن: يمكنك ربط كلمة إنجليزية واحدة (مثل "you") بعدة كلمات عربية ("أنتَ"، "أنتِ"). 
        انقر على أي خلية لتعديلها. يتم الحفظ تلقائياً.
      </p>
      <table class="tag-table">
        <thead><tr><th>Concept ID</th><th>English</th><th>العربية</th><th>Français</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
      <button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="addNewTagRow()">+ Add New Concept Row</button>
    </div>
  `;
}

function updateTagCell(conceptId, lang, value) {
  const arr = value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
  if (!TAG_MAP[conceptId]) TAG_MAP[conceptId] = {};
  TAG_MAP[conceptId][lang] = arr;
  saveLS(LS.tagMap, TAG_MAP);
}

function addNewTagRow() {
  const id = 'concept_' + Date.now();
  TAG_MAP[id] = { en: ['new'], ar: ['جديد'], fr: ['nouveau'] };
  saveLS(LS.tagMap, TAG_MAP);
  renderTagTranslator();
}

function deleteTagRow(id) {
  if (confirm('Delete this concept mapping?')) {
    delete TAG_MAP[id];
    saveLS(LS.tagMap, TAG_MAP);
    renderTagTranslator();
  }
}

// ==================== KNOWN WORDS TEST ====================
function renderKnownWordsTest() {
  const app = document.getElementById('app');
  // Demo words pool
  const pool = ['كتاب', 'مدرسة', 'ذهب', 'جميل', 'في', 'على', 'من', 'إلى'];
  const unknown = pool.filter(w => !KNOWN_WORDS.includes(w));
  
  if (unknown.length === 0) {
    app.innerHTML = `<div class="topbar"><button class="btn btn-sm btn-ghost" onclick="state.view='home';render()">←</button><h2>Completed</h2></div>
    <div class="card"><p>All demo words are marked as known!</p></div>`;
    return;
  }

  const currentWord = unknown[0];
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-sm btn-ghost" onclick="state.view='home';render()">←</button>
      <h2>${t('knownWordsTest')}</h2>
    </div>
    <div class="card" style="text-align:center; padding:40px 20px;">
      <div class="sentence-display auto-dir" style="font-size:36px; margin-bottom:32px;">${currentWord}</div>
      <div style="display:flex;gap:16px;justify-content:center;">
        <button class="btn btn-danger" style="flex:1" onclick="markWordKnown('${currentWord}', false)">I don't know</button>
        <button class="btn btn-primary" style="flex:1" onclick="markWordKnown('${currentWord}', true)">I know this</button>
      </div>
      <p style="margin-top:20px;color:var(--text-secondary);font-size:13px;">
        Remaining: ${unknown.length} words. Known words will be auto-tagged and skipped in intros.
      </p>
    </div>
  `;
}

function markWordKnown(word, isKnown) {
  if (isKnown) {
    KNOWN_WORDS.push(word);
    // Auto-create a note with a special tag
    NOTES.push({
      id: 'n' + Date.now(), lang: 'ar', type: 'word', text: word,
      note: 'Known from outside app', tags: ['known_outside', 'معروف مسبقاً'], created: Date.now()
    });
    saveLS(LS.notes, NOTES);
  }
  saveLS(LS.knownWords, KNOWN_WORDS);
  renderKnownWordsTest();
}

// ==================== SETTINGS & CUSTOM CSS ====================
function renderSettings() {
  const app = document.getElementById('app');
  const currentCss = loadLS(LS.customCss, '/* \n  Custom CSS Override \n  Example: \n  .card { border-radius: 0px; }\n  :root { --primary: #ff0000; }\n*/');
  
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-sm btn-ghost" onclick="state.view='home';render()">←</button>
      <h2>${t('settings')}</h2>
    </div>
    
    <div class="card">
      <h3>Appearance</h3>
      <div class="themegrid">
        ${['classic','paper','terminal','aurora','brutal','zen'].map(id => `
          <button class="themecard ${loadLS(LS.theme,'classic')===id?'on':''}" onclick="applyTheme('${id}');renderSettings()">
            <div class="tsw" id="sw-${id}"></div>
            <b>${id.charAt(0).toUpperCase() + id.slice(1)}</b>
          </button>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <h3>Language & UI</h3>
      <label>UI Language / لغة الواجهة</label>
      <select class="field" onchange="state.uiLang=this.value;saveLS(LS.uiLang,this.value);render()">
        <option value="ar" ${state.uiLang==='ar'?'selected':''}>العربية</option>
        <option value="en" ${state.uiLang==='en'?'selected':''}>English</option>
      </select>
      <button class="btn btn-sm btn-ghost" onclick="localStorage.removeItem(LS.onboarding);state.view='home';render();">Restart Onboarding (إعادة المقدمة)</button>
    </div>

    <div class="card">
      <h3>${t('customCss')}</h3>
      <p class="hint" style="margin-bottom:8px;font-size:13px">
        Pick a theme above, then add overrides here. Changes apply instantly.
      </p>
      <textarea class="css-editor" id="cssEditor" oninput="saveLS(LS.customCss,this.value);applyCustomCSS()">${esc(currentCss)}</textarea>
    </div>

    <div class="card">
      <h3>V2.6 Roadmap (Teaching Pronunciation)</h3>
      <div class="roadmap-item">
        <h4>🎙️ Shadowing Mode</h4>
        <p>Listen to native TTS, then record your voice with a visual waveform overlay to match pitch and timing.</p>
      </div>
      <div class="roadmap-item">
        <h4>🗣️ Phoneme-Level Feedback</h4>
        <p>AI-driven validation highlighting specific mispronounced letters (e.g., س vs ص) with color-coded accuracy.</p>
      </div>
      <div class="roadmap-item">
        <h4>🎧 Minimal Pair Drills</h4>
        <p>Interactive audio quizzes distinguishing similar sounds, building phonetic awareness before sentence-level practice.</p>
      </div>
      <div class="roadmap-item">
        <h4>📊 Speech-to-Text Auto-Grading</h4>
        <p>Speak the sentence; the app compares the STT transcript to the target and calculates a pronunciation score.</p>
      </div>
    </div>
  `;

  // Draw theme swatches dynamically
  const themes = {
    classic: ['#ffffff','#f7f7f7','#58cc02','#3c3c3c'],
    paper: ['#f5efe3','#fbf7ee','#8c2f1b','#2a2118'],
    terminal: ['#0a0f0a','#101810','#3dff7a','#b6ffcb'],
    aurora: ['#1b1740','#2a2563','#8b7bff','#eef0ff'],
    brutal: ['#fff3b0','#ffffff','#ff4f81','#111111'],
    zen: ['#f1ece1','#faf7f0','#6f9275','#3b3a33']
  };
  for (const [id, colors] of Object.entries(themes)) {
    const el = document.getElementById(`sw-${id}`);
    if (el) el.innerHTML = colors.map(c => `<i style="background:${c}"></i>`).join('');
  }
}

// ==================== ONBOARDING ====================
function showOnboarding() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <h2 style="margin-bottom:16px">${t('onboardingTitle')}</h2>
      <p style="margin-bottom:16px;color:var(--text-secondary)">Let's set up your language learning environment.</p>
      
      <label style="font-weight:700">Your Primary Language (for UI & Tag Translation):</label>
      <select class="field" id="obUiLang">
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>

      <label style="font-weight:700;margin-top:12px;display:block">Target Language:</label>
      <select class="field" id="obTarget">
        <option value="ar">Arabic (العربية)</option>
        <option value="en">English</option>
        <option value="fr">French</option>
      </select>

      <div style="background:var(--bg-secondary);padding:16px;border-radius:12px;margin:16px 0;font-size:14px">
        <b>How it works:</b><br>
        1. Sentences are shown in a spaced-repetition queue.<br>
        2. Tap highlighted words to add notes in <i>any</i> language.<br>
        3. Use the "Flexible Tag Translator" to map concepts (e.g., "you" → "أنتَ/أنتِ").<br>
        4. Your queue is saved automatically. You can resume where you left off.
      </div>

      <button class="btn btn-primary" style="width:100%" onclick="completeOnboarding()">Get Started</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function completeOnboarding() {
  const uiLang = document.getElementById('obUiLang').value;
  state.uiLang = uiLang;
  saveLS(LS.uiLang, uiLang);
  saveLS(LS.onboarding, { completed: true, date: Date.now() });
  document.querySelector('.modal-overlay').remove();
  checkQueueResume();
}

// ==================== HOME VIEW ====================
function renderHome() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <h2>Language Trainer</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm btn-ghost" onclick="state.view='notes';render()">📝</button>
        <button class="btn btn-sm btn-ghost" onclick="state.view='settings';render()">⚙️</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">Your Decks</h3>
      ${GROUPS.map(g => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg-secondary);border-radius:10px;margin-bottom:8px;">
          <div>
            <div style="font-weight:700">${esc(g.name)}</div>
            <div style="font-size:13px;color:var(--text-secondary)">${g.items.length} sentences</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="startExercise('${g.id}')">Study</button>
        </div>
      `).join('')}
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;border:2px dashed var(--border-color)">+ Add Language / Deck (Scraper Accessible)</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
      <button class="btn" style="text-align:center" onclick="state.view='tagTranslator';render()">
        🌐<br><b>${t('tagTranslator')}</b>
      </button>
      <button class="btn" style="text-align:center" onclick="state.view='knownWords';render()">
        ✅<br><b>${t('knownWordsTest')}</b>
      </button>
    </div>
  `;
}

// ==================== NOTES VIEW ====================
function renderNotes() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-sm btn-ghost" onclick="state.view='home';render()">←</button>
      <h2>${t('notes')} (${NOTES.length})</h2>
      <button class="btn btn-sm btn-primary" onclick="openNoteEditor()">+ New</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      ${NOTES.length === 0 ? '<div class="card" style="text-align:center;color:var(--text-secondary)">No notes yet. Tap words during exercise to add them.</div>' : ''}
      ${NOTES.map(n => `
        <div class="card" style="padding:16px;cursor:pointer" onclick='openNoteEditor(${JSON.stringify(n).replace(/'/g, "&#39;")})'>
          <div style="display:flex;justify-content:space-between;align-items:start">
            <span class="auto-dir" style="font-size:18px;font-weight:700">${esc(n.text)}</span>
            <span class="ntag">${n.type}</span>
          </div>
          <div style="margin-top:8px;color:var(--text-secondary);font-size:14px">${esc(n.note || '(No meaning added)')}</div>
          <div style="margin-top:8px">${(n.tags||[]).map(tg => `<span class="ntag">${esc(tg)}</span>`).join('')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ==================== ROUTER ====================
function render() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'exercise') renderExercise();
  else if (state.view === 'notes') renderNotes();
  else if (state.view === 'settings') renderSettings();
  else if (state.view === 'tagTranslator') renderTagTranslator();
  else if (state.view === 'knownWords') renderKnownWordsTest();
}

// ==================== UTILS ====================
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Start App
init();
</script>
</body>
</html>
