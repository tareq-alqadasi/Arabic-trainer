<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Language Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#58cc02;--green-d:#46a302;--green-l:#d7ffb8;--green-t:#2b6b00;
--blue:#1cb0f6;--blue-d:#1899d6;--blue-l:#ddf4ff;--red:#ff4b4b;--red-d:#ea2b2b;
--red-l:#ffdfe0;--red-t:#a30000;--gold:#ffc800;--gold-d:#e5a900;--amber:#ff9600;
--amber-l:#fff3d1;--bg:#fff;--bg2:#f7f7f7;--ink:#3c3c3c;--ink2:#777;--ink3:#afafaf;
--line:#e5e5e5;--line2:#d0d0d0;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.translit{font-size:13.5px;color:var(--ink2);font-style:italic;margin-top:5px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:20}
.iconbtn{background:none;border:none;font-size:22px;cursor:pointer;padding:0 6px;color:var(--ink3);line-height:1;font-weight:700}
.iconbtn:hover{color:var(--ink2)}
.progress{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;box-shadow:inset 0 4px 0 rgba(255,255,255,.25)}
.pill{font-weight:800;font-size:14px;white-space:nowrap}
.btn{border:none;border-radius:var(--r);padding:13px 18px;font-weight:800;font-size:14px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:.1s;box-shadow:0 4px 0 rgba(0,0,0,.18);user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}.btn-green:hover:not(:disabled){background:var(--green-d)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover:not(:disabled){background:var(--red-d)}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:#fff;color:var(--blue);box-shadow:0 4px 0 var(--line2),inset 0 0 0 2px var(--line)}
.btn-ghost:hover{background:#f4fbff}
.btn-amber{background:#fff;color:var(--amber);box-shadow:0 4px 0 var(--line2),inset 0 0 0 2px var(--line)}
.btn-amber.on{background:var(--amber);color:#fff;box-shadow:0 4px 0 #cc7700}
.btn-sm{padding:9px 14px;font-size:12px;border-radius:11px}
.hero{padding:28px 0 8px}
.hero h1{font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.5px}
.hero p{color:var(--ink2);margin:0 0 20px;font-size:15px;line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.statcard{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center}
.statcard b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.statcard span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.decklist{display:flex;flex-direction:column;gap:10px;padding-bottom:120px}
.deck{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:#fff;cursor:pointer;transition:.12s}
.deck:hover{border-color:var(--blue);background:#f7fdff}
.deck:active{transform:scale(.99)}
.deck.done{border-color:var(--green);background:#f4ffe4}
.deck-ico{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:800}
.deck.done .deck-ico{background:var(--green-l);color:var(--green-t)}
.deck-body{flex:1;min-width:0}
.deck-title{font-weight:800;font-size:15px;margin-bottom:2px}
.deck-sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-meta{font-size:11px;color:var(--ink3);font-weight:700;white-space:nowrap;text-align:right}
.sectionhead{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}
.exwrap{max-width:680px;margin:0 auto;padding:8px 16px 230px}
.qhead{display:flex;align-items:center;gap:10px;margin:4px 0 18px;flex-wrap:wrap;justify-content:space-between}
.qhead h2{font-size:22px;font-weight:800;margin:0;line-height:1.35;flex:1;min-width:0}
.flagbtn{background:#fff;border:2px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:.15s}
.flagbtn:hover{border-color:var(--amber);color:var(--amber)}
.flagbtn.on{background:var(--amber);border-color:var(--amber);color:#fff}
.answerzone{min-height:96px;border-bottom:2px solid var(--line);padding:8px 0 12px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answerzone.filled{border-color:var(--blue)}
.placeholder{color:var(--ink3);font-size:14px;font-weight:600;padding:8px 2px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:16px;font-weight:700;cursor:pointer;transition:.1s;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.chip:hover{background:#f7f7f7}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.used{opacity:0;pointer-events:none}
.chip.flat{box-shadow:none;border-color:var(--line2)}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:10px;font-size:16px;font-weight:700;cursor:pointer;transition:.1s;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.choice:hover{background:#f7f7f7}
.choice.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);box-shadow:0 2px 0 var(--blue)}
.choice:disabled{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:17px;font-family:inherit;font-weight:600;outline:none;background:#fff;color:var(--ink)}
.typein:focus{border-color:var(--blue)}
.compare{background:var(--bg2);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cmp-row{margin-bottom:12px}.cmp-row:last-child{margin-bottom:0}
.cmp-label{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.cmp-text{font-size:18px;font-weight:700;line-height:1.5;word-break:break-word}
.cmp-text.empty{color:var(--ink3);font-weight:600;font-style:italic}
.cmp-row.good .cmp-text{color:var(--green-t)}
.cmp-row.bad .cmp-text{color:var(--red-t)}
.footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:30}
.footer-inner{max-width:680px;margin:0 auto}
.footer-row{display:flex;gap:10px;align-items:center}
.footer-row>.btn{flex:1}
.footer-hint{font-size:12.5px;color:var(--ink2);font-weight:600;text-align:center;margin-top:10px}
.rate-title{font-size:15px;font-weight:800;text-align:center;margin-bottom:10px;color:var(--ink2)}
.rate-row{display:flex;gap:10px}
.rate-row>.btn{flex:1}
.statwrap{padding-bottom:80px}
.attemptrow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.attemptrow .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.no{background:var(--red)}.dot.flag{background:var(--amber)}
.attemptrow .body{flex:1;min-width:0}
.attemptrow .en{font-weight:700}
.attemptrow .given{font-size:12.5px;color:var(--ink2);margin-top:3px;word-break:break-word}
.attemptrow .meta{font-size:11px;color:var(--ink3);white-space:nowrap;font-weight:700;text-align:right}
.flagbadge{display:inline-block;background:var(--amber-l);color:#8a5000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink3);padding:50px 20px;font-weight:600}
.notice{background:var(--amber-l);color:#8a5000;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice button{background:transparent;border:1.5px solid #8a5000;color:#8a5000;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}

.fl{line-height:1.6}
.fl.rtl{direction:rtl;unicode-bidi:isolate;line-height:2}
.fl.arf{font-family:'Noto Naskh Arabic','Segoe UI',serif;line-height:2.1}
.answerzone.rtl{direction:rtl}
.bank.rtl{direction:rtl}
.chip.fl{font-size:18px}
.chip.arf{font-size:20px;line-height:1.8;padding:4px 14px}
.choice.rtl{direction:rtl;text-align:right}
.choice.arf{font-size:20px;line-height:2;padding:8px 16px}
.cmp-text.arf{font-size:22px;line-height:2}
.titlebtn{background:none;border:none;font-family:inherit;font-weight:800;font-size:19px;letter-spacing:-.4px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 0;flex:1;min-width:0;text-align:left}
.titlebtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{font-size:14px;color:var(--ink3);transition:transform .15s}
.titlebtn.open .caret{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:12px;right:12px;max-width:340px;background:#fff;border:2px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:40}
.ddrow{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px}
.ddrow:hover{background:var(--bg2)}
.ddrow small{color:var(--ink3);font-weight:600;margin-left:6px}
.ddrow .cnt{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:800}
.ddrow.add{color:var(--blue-d);border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 10px 10px}
.cb{width:22px;height:22px;border:2px solid var(--line2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;font-weight:800;background:#fff}
.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sechead .sectionhead{margin:0}
.linkbtn{background:none;border:none;font-family:inherit;font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--blue-d);cursor:pointer;padding:4px 6px}
.deck .deck-ico.cbwrap{background:none}
.gbar{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.gbar>i{display:block;height:100%;background:var(--green)}
.lbadge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;background:var(--blue-l);color:var(--blue-d);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
.deck.picked{border-color:var(--blue);background:#f4fbff}
.dotmenu{flex-shrink:0;font-size:20px;padding:4px 8px}
.selbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30}
.selbar-inner{max-width:680px;margin:0 auto}
.selcount{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.selbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn-redg{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--line2),inset 0 0 0 2px var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:800;line-height:1.35}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;font-weight:700}
.srow:hover{border-color:var(--blue);background:#f7fdff}
.srow small{margin-left:auto;color:var(--ink3);font-weight:800}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;font-weight:600;outline:none;background:#fff;color:var(--ink)}
.field:focus{border-color:var(--blue)}
.sheet-actions{display:flex;gap:10px;margin-top:14px}
.sheet-actions .btn{flex:1}
.hint{font-size:12.5px;color:var(--ink2);font-weight:600;margin:0 0 10px;line-height:1.5}
.improw{border:2px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.improw .field{margin-bottom:8px}
.improw .cnt{font-size:12px;font-weight:800;color:var(--ink3)}
.chkrow{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-weight:700;font-size:14px;cursor:pointer}
.code{direction:ltr;text-align:left;background:#1e1e1e;color:#e6e6e6;border-radius:12px;padding:14px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;max-height:340px;margin:0 0 12px}
.rowcb{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.rowcb .body{flex:1;min-width:0}
.rowcb .en{font-weight:700;font-size:14px}
.sessmeta{font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap}
.choice.right{border-color:var(--green);background:var(--green-l);color:var(--green-t);box-shadow:0 2px 0 var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-t);box-shadow:0 2px 0 var(--red)}
.hintrow{font-size:16px;font-weight:700;margin-top:4px;line-height:1.8}
.hintrow .fl{font-size:21px}
.introcard{border:2px solid var(--line);border-radius:var(--r);padding:20px 18px}
.introtag{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue-d);margin-bottom:12px}
.iwrap{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px}
.iwrap.rtl{direction:rtl}
.iw{text-align:center}
.iw .w{font-size:28px;font-weight:800}
.iw .translit{margin-top:0;font-style:italic}
.intro-en{font-size:21px;font-weight:700;line-height:1.4}
.lvcard{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.lvinfo{flex:1;min-width:0}
.lvinfo b{display:block;font-size:16px;font-weight:800}
.lvinfo span{font-size:12.5px;color:var(--ink2);font-weight:700}
.sidetr{font-size:17px;font-weight:700;color:var(--ink2);margin-top:4px;line-height:1.7}
.nomatch{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:4px}
.choice .sidetr{font-size:15px;font-weight:600;margin-top:2px}
:root{--hl:rgba(255,200,0,.38);--hl-line:rgba(230,150,0,.6)}
.qtools{display:flex;gap:8px;align-items:center}
.notebtn{width:38px;height:38px;font-size:17px}
.flagbtn.notebtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.nt{background:var(--hl);border-radius:4px;box-shadow:0 1px 0 var(--hl-line);cursor:pointer}
button .nt{cursor:inherit}
.ntstrip{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ntline{font-size:14px;line-height:1.5;color:var(--ink2);font-weight:600;white-space:pre-wrap;border-left:3px solid var(--hl-line);padding-left:10px}
.ntline b{font-size:18px;color:var(--ink);margin-right:4px}
.ntype{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--amber-l);color:#8a5000;padding:2px 6px;border-radius:6px;vertical-align:middle}
.ntag{display:inline-block;font-size:11px;font-weight:700;background:var(--blue-l);color:var(--blue-d);padding:2px 8px;border-radius:10px;margin-left:5px;vertical-align:middle}
.nview{border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.nv-top b{font-size:22px}
.nv-note{margin:6px 0;font-size:15px;line-height:1.55;white-space:pre-wrap}
.nv-meta{font-size:11.5px;color:var(--ink3);font-weight:700}
.nv-actions{display:flex;gap:8px;margin-top:8px}
.npick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.nletters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.nletter{min-width:40px;height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
.nletter.on{background:var(--hl);border-color:var(--hl-line)}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:2px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2)}
.tchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.nctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nctl label{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);display:block}
.nctl .field{margin-top:4px;padding:8px 10px;font-size:14px}
.nrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.npat{min-width:56px;max-width:110px;font-size:22px;font-weight:800;text-align:center;word-break:break-all}
.nrow .body{flex:1;min-width:0}
.nmeta{font-size:11.5px;color:var(--ink3);font-weight:700}
.ntext{font-size:14.5px;line-height:1.5;margin-top:3px;white-space:pre-wrap}
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themecard{text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-family:inherit;color:var(--ink)}
.themecard.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-l)}
.themecard small{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.3}
.tsw{display:flex;border-radius:8px;overflow:hidden;height:22px;margin-bottom:4px;border:1px solid rgba(0,0,0,.12)}
.tsw i{flex:1}
.flagbtn.gradebtn{width:auto;border-radius:21px;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.3px}
.flagbtn.notebtn.nv-off{opacity:.55;position:relative}
.flagbtn.notebtn.nv-off::after{content:'';position:absolute;left:22%;right:22%;top:50%;height:2px;background:currentColor;transform:rotate(-40deg)}
.flagbtn.notebtn.nv-hl{border-color:var(--accent,var(--blue));color:var(--accent,var(--blue))}
.flagbtn.notebtn.nv-list{background:var(--accent,var(--blue));border-color:var(--accent,var(--blue));color:var(--accent-ink,#fff)}

.dbgpanel{margin-top:16px;border:2px dashed var(--line2);border-radius:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg2);color:var(--ink)}
.dbgbar{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;font-weight:700}
.dbgrow{display:flex;gap:8px;padding:5px 12px;border-top:1px solid var(--line)}
.dbgrow b{flex:0 0 84px;color:var(--ink2)}

/* ===== Looks: every theme except "classic" is driven by these variables + shared structure ===== */
@keyframes lt-blink{50%{opacity:0}}

html[data-theme]:not([data-theme="classic"]) .btn-sm{border-radius:var(--r)}
html[data-theme]:not([data-theme="classic"]) :is(.deck,.lvcard,.choice,.chip,.improw,.introcard,.srow,.dd,.themecard,.nview,.tchip,.nletter,.field,.typein,.flagbtn,.cb,.sheet,.selbar,.footer){background:var(--card);border-color:var(--line);color:var(--ink)}

html[data-theme]:not([data-theme="classic"]) .choice.sel{border-color:var(--accent);background:var(--card2);color:var(--ink);box-shadow:var(--sel-sh,inset 0 0 0 1px var(--accent))}

<script type="text/plain" id="codeTpl">
(async () => {
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---- selectors ----------------------------------------------------------
  const getPageInfo = () => {
    const s = [...document.querySelectorAll('span')]
      .find(el => /^Page \d+ of \d+$/.test(el.textContent.trim()));
    if (!s) return null;
    const m = s.textContent.trim().match(/Page (\d+) of (\d+)/);
    return { current: +m[1], total: +m[2] };
  };
  const getNext = () =>
    [...document.querySelectorAll('button')]
      .find(b => b.textContent.trim().toLowerCase() === 'next');

  // Each card: a <span>#123</span> followed by __COMMENT__
  const parsePage = () => {
    const out = [];
    document.querySelectorAll('span').forEach(span => {
      const m = span.textContent.trim().match(/^#(\d+)$/);
      if (!m) return;
      const ps = span.parentElement.querySelectorAll('p');
      if (ps.length < __MIN__) return;
      out.push({
        id: +m[1],
        english: ps[0].textContent.trim(),
        __TRLINE__
        __KEY__:  ps[__IDX__].textContent.trim(),
      });
    });
    return out;
  };

  const waitForPage = async (prev, timeout = 15000) => {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
      await sleep(100);
      const info = getPageInfo();
      if (info && info.current !== prev) return info;
    }
    throw new Error('timed out waiting for next page');
  };

  // ---- the loop -----------------------------------------------------------
  const byId = new Map();
  let guard = 0;
  while (guard++ < 200) {
    const info = getPageInfo();
    if (!info) { console.warn('no pagination found'); break; }

    parsePage().forEach(c => byId.set(c.id, c));
    console.log(`page ${info.current}/${info.total} — total ${byId.size}`);

    if (info.current >= info.total) break;
    const next = getNext();
    if (!next || next.disabled) { console.warn('next unavailable'); break; }
    next.click();
    await waitForPage(info.current);
  }

  // ---- output -------------------------------------------------------------
  const rows = [...byId.values()].sort((a, b) => a.id - b.id);
  window.__sentences = rows;               // keep it around for more poking
  console.log('DONE:', rows.length, 'sentences');

  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = 'id,english,transliteration,__KEY__\n' +
    rows.map(r => [r.id, r.english, r.translit, r.__KEY__].map(q).join(',')).join('\n');

  try { await navigator.clipboard.writeText(csv); console.log('CSV → clipboard'); }
  catch { console.log(csv); }

  return rows;
})();
</script>

/* ==================== TASHKIL ENGINE ==================== */
const FATHA='\u064E', KASRA='\u0650', DAMMA='\u064F', SUKUN='\u0652', SHADDA='\u0651';
const TASHKIL_MULTI = {'ṯ':'ث','ḏ':'ذ','ǧ':'ج','ḥ':'ح','ḫ':'خ','š':'ش','ṣ':'ص','ḍ':'ض','ṭ':'ط','ẓ':'ظ','ʿ':'ع','ġ':'غ'};
const TASHKIL_SINGLE = {
  'ʾ':['ء','أ','إ','آ','ؤ','ئ'],
  'b':['ب'],'t':['ت'],'d':['د'],'r':['ر'],'z':['ز'],'s':['س'],
  'f':['ف'],'q':['ق'],'k':['ك'],'l':['ل'],'m':['م'],'n':['ن'],
  'h':['ه','ة'],'w':['و'],'y':['ي','ى']
};
const LONG_VOWEL_LETTERS = new Set(['ا','و','ي','ى','آ','أ','إ']);
function tashkilMark(v){ return v==='a'?FATHA : v==='i'?KASRA : v==='u'?DAMMA : ''; }
function isArDiacritic(ch){ return /[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/.test(ch); }
function tokenizeTranslit(word){
  const tokens = []; let i = 0;
  while (i < word.length){
    const ch = word[i];
    if (ch==='ā'||ch==='â'||ch==='á'){ tokens.push({t:'L',v:'a'}); i++; continue; }
    if (ch==='ī'||ch==='î'||ch==='í'){ tokens.push({t:'L',v:'i'}); i++; continue; }
    if (ch==='ū'||ch==='û'||ch==='ú'){ tokens.push({t:'L',v:'u'}); i++; continue; }
    if (TASHKIL_MULTI[ch]){ tokens.push({t:'C',m:TASHKIL_MULTI[ch],key:ch}); i++; continue; }
    if (ch==='a'||ch==='i'||ch==='u'){ tokens.push({t:'V',v:ch}); i++; continue; }
    if (TASHKIL_SINGLE[ch]){ tokens.push({t:'C',m:TASHKIL_SINGLE[ch][0],alts:TASHKIL_SINGLE[ch],key:ch}); i++; continue; }
    i++;
  }
  return tokens;
}
function arMatches(arCh, tok){ return tok.alts ? tok.alts.includes(arCh) : arCh === tok.m; }
function tashkilWord(arabicWord, translitWord){
  const clean = String(translitWord).replace(/[.,!?؟،؛:·"“”'‘’()\[\]{}—–_\-]/g,'').trim();
  if (!clean) return arabicWord;
  const tokens = tokenizeTranslit(clean);
  if (!tokens.length) return arabicWord;
  const result = []; let ti = 0;
  for (let ai = 0; ai < arabicWord.length; ai++){
    const arCh = arabicWord[ai];
    result.push(arCh);
    if (isArDiacritic(arCh)) continue;
    const tok = tokens[ti]; if (!tok) continue;
    if (tok.t === 'L' && LONG_VOWEL_LETTERS.has(arCh)){ ti++; continue; }
    if (arCh === 'ا' && tok.t === 'V'){ ti++; continue; }
    if (tok.t === 'C' && arMatches(arCh, tok)){
      ti++;
      const next = tokens[ti]; if (!next) continue;
      if (next.t === 'V'){ result.push(tashkilMark(next.v)); ti++; }
      else if (next.t === 'C'){
        if (next.key === tok.key){
          result.push(SHADDA); ti++;
          const after = tokens[ti];
          if (after && after.t === 'V'){ result.push(tashkilMark(after.v)); ti++; }
          else if (after && after.t === 'C'){ result.push(SUKUN); }
          else if (after && after.t === 'L'){ result.push(tashkilMark(after.v)); }
        } else { result.push(SUKUN); }
      } else if (next.t === 'L'){ result.push(tashkilMark(next.v)); }
    }
  }
  return result.join('');
}
function addTashkil(arabic, translit){
  if (!arabic || !translit) return arabic;
  const aw = arabic.split(/\s+/);
  const tw = translit.split(/\s+/);
  if (aw.length !== tw.length) return arabic;
  return aw.map((w,i)=>tashkilWord(w, tw[i])).join(' ');
}

/* ==================== NORMALIZATION ==================== */
const AR_DIA = /[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/g;
function normAr(s){
  return String(s).replace(AR_DIA,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
    .replace(/[.,!?؟،؛:·"“”'‘’()\[\]{}—–_\-]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function normEn(s){
  return String(s).toLowerCase().replace(/[’‘]/g,"'")
    .replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  if (a===b) return 0;
  const m=a.length,n=b.length;
  if (!m) return n; if (!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for (let j=0;j<=n;j++) prev[j]=j;
  for (let i=1;i<=m;i++){
    cur[0]=i;
    for (let j=1;j<=n;j++){
      const c = a[i-1]===b[j-1]?0:1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a.slice()).slice(0,n); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ==================== PARSING ==================== */
function parseRaw(text){
  const out = [];
  for (const line of text.split('\n')){
    const t = line.trim(); if (!t) continue;
    const p = t.split('|'); if (p.length < 4) continue;
    const n = parseInt(p[0],10); if (isNaN(n)) continue;
    const english = p[1].trim(), target = p[3].trim();
    if (!english || !target) continue;
    out.push({ n, english, transliteration:p[2].trim(), target });
  }
  out.sort((a,b)=>a.n-b.n);
  return out;
}
function parseCSVRows(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f += c;
    } else {
      if (c==='"') q=true;
      else if (c===','){ row.push(f); f=''; }
      else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if (c==='\r'){}
      else f += c;
    }
  }
  if (f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function rowsToItems(rows){
  const out = []; let hint = null;
  for (const r of rows){
    if (!r || r.length < 4) continue;
    const n = parseInt(String(r[0]).trim(),10);
    if (isNaN(n)){ if (!out.length && !hint) hint = langFromName(r[3]); continue; }
    const english = String(r[1]||'').trim(), tr = String(r[2]||'').trim(), target = String(r[3]||'').trim();
    if (!english || !target) continue;
    out.push({ n, english, transliteration:tr, target });
  }
  out.sort((a,b)=>a.n-b.n);
  return { items:out, hint };
}
function parseAny(text){
  let rows = parseRaw(text), hint = null;
  if (rows.length < 5){
    try {
      const c = rowsToItems(parseCSVRows(text));
      if (c.items.length > rows.length){ rows = c.items; hint = c.hint; }
    } catch(e){}
  }
  if (!hint && rows.length) hint = detectLang(rows.slice(0,20).map(r=>r.target).join(' '));
  return { rows, hint };
}
function toCSV(items, lang){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  return 'id,english,transliteration,' + LG(lang).name.toLowerCase() + '\n' +
    items.map((s,i)=>[i+1, s.english, s.transliteration||'', s.target].map(q).join(',')).join('\n');
}

/* ==================== LIBRARY ==================== */
function h32(s, seed){ let h = seed; for (let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h>>>0).toString(36); }
function mkUid(lang, en, tg){ const k = en + '\u0001' + tg; return lang + ':' + h32(k,2166136261) + h32(k,5381); }
function gid(){ return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function mkItems(rows, lang){
  const seen = new Set(), out = [];
  for (const r of rows){
    const uid = mkUid(lang, r.english, r.target);
    if (seen.has(uid)) continue; seen.add(uid);
    out.push({ uid, n:r.n, english:r.english, transliteration:r.transliteration||'', target:r.target, lang });
  }
  return out;
}
function uniq(items){ const m = new Map(); for (const s of items) if (!m.has(s.uid)) m.set(s.uid, s); return [...m.values()]; }
function oneGroup(items, lang){ return [{ id:gid(), name:LG(lang).name + ' sentences', lang, items }]; }
function importItems(rows, lang, keepDup, taken){
  const used = new Set(), count = {}, out = []; let skipped = 0;
  for (const r of rows){
    const base = mkUid(lang, r.english, r.target);
    let uid = base;
    if (keepDup){
      const n = count[base] || 0; count[base] = n + 1;
      if (n > 0 || taken.has(base)){ let k = Math.max(n,1); do { uid = base + '#' + k++; } while (taken.has(uid) || used.has(uid)); }
    } else if (taken.has(base) || used.has(base)){ skipped++; continue; }
    used.add(uid);
    out.push({ uid, n:r.n, english:r.english, transliteration:r.transliteration||'', target:r.target, lang });
  }
  return { items:out, skipped };
}
function buildInitialLib(){
  let rows = null, legacy = null;
  try { legacy = localStorage.getItem(LS.customCSV); } catch(e){}
  if (legacy){ const p = parseAny(legacy); if (p.rows.length >= 5) rows = p.rows; }
  const fromRaw = !rows;
  if (fromRaw) rows = parseRaw(RAW);                       // built-in 500 Arabic sentences
  const groups = oneGroup(mkItems(rows, 'ar'), 'ar');
  if (fromRaw) groups[0].pack = { id:'arabic', rev:'embedded' };   // lets arabic.txt in the store extend this group
  const lib = { groups };
  return { lib, legacy: !!legacy };
}
function backupOnce(){
  try {
    if (localStorage.getItem('arTrainer:bak:done')) return;
    for (const k of ['attempts','stats','flags','decks','customCSV']){
      const v = localStorage.getItem('arTrainer:' + k);
      if (v != null) localStorage.setItem('arTrainer:bak:' + k, v);
    }
    localStorage.setItem('arTrainer:bak:done', '1');
  } catch(e){}
}
// Runs every boot: converts numeric ids written by the old version (also if it is used again later) to uids. Never deletes anything.
function migrateLegacy(){
  const map = {};
  for (const s of BY_UID.values()) if (s.lang === 'ar' && s.n != null && !(s.n in map)) map[s.n] = s.uid;
  let ch = false;
  for (const a of ATTEMPTS){ if (typeof a.id === 'number'){ a.id = map[a.id] || ('ar:old' + a.id); ch = true; } }
  if (ch) saveAttempts();
  const nf = {}; let fch = false;
  for (const k of Object.keys(FLAGS)){
    if (/^\d+$/.test(k)){ fch = true; const u = map[+k] || ('ar:old' + k); if (!(u in nf)) nf[u] = FLAGS[k]; }
    else nf[k] = FLAGS[k];
  }
  if (fch){ FLAGS = nf; saveFlags(); }
}
function getGroup(id){ return LIB.groups.find(g=>g.id===id); }
function rebuild(){
  BY_UID = new Map(); T2S = new Map(); WORD_TASHKIL = {}; EN_IDX = {}; EK = new Map(); LENC = new Map(); GROUP_OF = null;
  for (const g of LIB.groups) for (const s of g.items){
    s.lang = g.lang;
    if (!BY_UID.has(s.uid)){
      BY_UID.set(s.uid, s); T2S.set(g.lang + '|' + s.target, s);
      const k = enKey(s.english); EK.set(s.uid, k);
      if (!EN_IDX[g.lang]) EN_IDX[g.lang] = new Map();
      if (!EN_IDX[g.lang].has(k)) EN_IDX[g.lang].set(k, s);
    }
  }
  for (const s of BY_UID.values()){
    if (s.lang !== 'ar' || !s.transliteration) continue;
    const aw = s.target.split(/\s+/), tw = s.transliteration.split(/\s+/);
    if (aw.length !== tw.length) continue;
    for (let i=0;i<aw.length;i++){
      const raw = aw[i]; if (WORD_TASHKIL[raw]) continue;
      const t = tashkilWord(raw, tw[i]);
      if (t && t !== raw) WORD_TASHKIL[raw] = t;
    }
  }
  fixLangPrefs();
  rebuildSeen();
}
function fixLangPrefs(){
  if (KNOWN !== 'en' && !EN_IDX[KNOWN]){ KNOWN = 'en'; saveLS(LS.known, KNOWN); }
  if (SIDE && SIDE !== 'en' && !EN_IDX[SIDE]){ SIDE = ''; saveLS(LS.side, SIDE); }
}
function sanitizeActive(){

  ACTIVE = (ACTIVE||[]).filter(c=>present.includes(c));
  if (!ACTIVE.length) ACTIVE = present.length ? [present[0]] : ['ar'];
  saveLS(LS.langs, ACTIVE);

function afterLibChange(opt){

  if (!o.skipUndo) libUndoPush(o.label || 'Library change');          // the shadow still holds the library as it was before this change
  saveLib(); sanitizeActive(); rebuild(); libShadowRefresh();
  state.sel.clear(); state.ssel.clear();

function activeItems(){ return uniq(activeGroups().flatMap(g=>g.items)); }
function langsPresent(){

function lastMap(){ const m = new Map(); for (const a of ATTEMPTS) m.set(a.id, a.correct); return m; }
function addUnique(dest, items){

/* Display helpers */
function displayFl(s){
  if (!s) return '';
  if (s.lang === 'ar' && SHOW_TASHKIL && s.transliteration) return addTashkil(s.target, s.transliteration) || s.target;
  return s.target;

function displayWord(w, lang){
  if (lang !== 'ar' || !SHOW_TASHKIL || !w) return w;
  return WORD_TASHKIL[w] || w;
}
function displayFlFromText(t, lang){
  if (lang !== 'ar' || !SHOW_TASHKIL || !t) return t;
  const s = T2S.get(lang + '|' + t);
  if (s && s.transliteration) return addTashkil(s.target, s.transliteration) || t;
  return t.split(/\s+/).map(w=>displayWord(w, lang)).join(' ');

/* ==================== CROSS-LANGUAGE LINKS (matched by English) ==================== */
const COMPAT_MIN = 0.5;
function enKey(t){ return String(t||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim(); }
function ekOf(s){ let k = EK.get(s.uid); if (k === undefined){ k = enKey(s.english); EK.set(s.uid, k); } return k; }
function counterpart(s, L){
  const m = EN_IDX[L];
  if (!m || s.lang === L) return null;
  return m.get(ekOf(s)) || null;
}
// known side of a sentence: English, or its translation in the chosen known language
function ovrOf(s, lang){ const o = OVR[s.uid]; return o && typeof o[lang] === 'string' ? o[lang] : null; }
// known side of a sentence exactly as the library has it
function knBase(s){
  if (KNOWN === 'en' || s.lang === KNOWN) return { text:s.english, lang:'en', sent:null, fb:false };
  const c = counterpart(s, KNOWN);
  if (c) return { text:c.target, lang:KNOWN, sent:c, fb:false };
  return { text:s.english, lang:'en', sent:null, fb:true };
}
// known side as shown: English, or its translation in the chosen known language, or the user's own rewrite of it
function kn(s){
  let r = knBase(s);
  if (r.fb && ovrOf(s, KNOWN) !== null) r = { text:'', lang:KNOWN, sent:null, fb:false };   // the user supplied the missing translation
  const ov = ovrOf(s, r.lang);
  if (ov !== null){ r = { text:ov, lang:r.lang, sent:null, fb:false, ov:true }; }
  return r;
}
function sideBase(s){
  if (!SIDE) return null;
  const k = kn(s);
  if (SIDE === k.lang || SIDE === s.lang) return null;

    if (ty === 'prefix'){ if (norm.startsWith(np)) out.push({ s:0, e:np.length, note:a.note }); }
    else if (ty === 'suffix'){ if (norm.endsWith(np)) out.push({ s:norm.length - np.length, e:norm.length, note:a.note }); }
    else { const i = norm.indexOf(np); if (i >= 0) out.push({ s:i, e:i + np.length, note:a.note }); }
  }
  for (const m of ix.multi){ const r = multiRanges(norm, m.parts); if (r) for (const x of r) out.push({ s:x.s, e:x.e, note:m.note }); }
  return out;
}
function hlRun(seg, lang, ix, sub){
  const al = alignText(seg, lang);
  if (!al.norm) return esc(seg);
  const hits = matchRanges(al.norm, ix, sub).filter(h=>!h.note.auto);
  if (!hits.length) return esc(seg);
  const per = al.info.map(()=>null);
  al.info.forEach((ci, k)=>{
    const len = ci.n.length; if (!len) return;
    for (const h of hits) if (ci.s < h.e && ci.s + len > h.s) (per[k] || (per[k] = new Set())).add(h.note.id);
  });
  for (let k=1; k<per.length; k++) if (!per[k] && al.info[k].mark && per[k-1]) per[k] = per[k-1];   // diacritics follow their letter
  let out = '', buf = '', cur = null, curKey = '';
  const flush = ()=>{ if (buf){ out += cur ? `<span class="nt" data-n="${[...cur].join(' ')}">${esc(buf)}</span>` : esc(buf); buf = ''; } };
  al.info.forEach((ci, k)=>{
    const key = per[k] ? [...per[k]].sort().join(' ') : '';
    if (key !== curKey){ flush(); curKey = key; cur = per[k] ? new Set(per[k]) : null; }
    buf += ci.c;
  });
  flush(); return out;
}
// foreign text as HTML; words/affixes that have a user note are wrapped in <span class="nt">
function flHTML(text, lang){
  text = String(text == null ? '' : text);
  const ix = notesHL() && NOTE_IDX[lang];
  if (!ix) return esc(text);
  if (LG(lang).noSpace) return hlRun(text, lang, ix, true);
  return text.split(/(\s+)/).map(p=>(!p || /^\s+$/.test(p)) ? esc(p) : hlRun(p, lang, ix, false)).join('');
}
function noteMatches(text, lang){
  const ix = NOTE_IDX[lang]; if (!ix) return [];
  const seen = new Map();
  const run = (seg, sub)=>{
    const n = noteNorm(seg, lang); if (!n) return;
    for (const h of matchRanges(n, ix, sub)) if (!h.note.auto && !seen.has(h.note.id)) seen.set(h.note.id, h.note);
  };
  if (LG(lang).noSpace) run(text, true); else String(text).split(/\s+/).forEach(w=>{ if (w) run(w, false); });
  return [...seen.values()];
}
function notesStripHTML(text, lang){
  if (!notesList()) return '';
  const ms = noteMatches(text, lang); if (!ms.length) return '';
  return '<div class="ntstrip">' + ms.map(n=>`<div class="ntline"><b class="${flc(lang)}">${esc(notePat(n))}</b> ${n.note ? esc(n.note) : ''}${tagsHTML(n.tags)}</div>`).join('') + '</div>';
}
// tapping a highlight opens its note(s); chips/option buttons are left alone
document.addEventListener('click', e=>{

/* ---------- words of a sentence ---------- */
function segWords(text, lang){
  try {
    if (typeof Intl !== 'undefined' && Intl.Segmenter){
      const code = lang === 'yue' ? 'zh' : lang;
      const seg = SEGS[code] || (SEGS[code] = new Intl.Segmenter(code, { granularity:'word' }));
      const out = []; for (const x of seg.segment(text)) if (x.isWordLike) out.push(x.segment);
      if (out.length) return out;
    }
  } catch(e){}
  return null;
}
function wordsOfText(text, lang){   // words of any displayed text (known side, side translation)
  if (LG(lang).noSpace) return segWords(text, lang) || Array.from(String(text).replace(/[\s\p{P}\p{S}]/gu, ''));
  return String(text).split(/\s+/).map(t=>t.replace(PUNCT, '')).filter(Boolean);
}
function wordsOfSentence(s){   // display forms, used to pick the word of a note
  if (LG(s.lang).noSpace) return segWords(s.target, s.lang) || Array.from(s.target.replace(/[\s\p{P}\p{S}]/gu, ''));
  return displayFl(s).split(/\s+/).map(t=>t.replace(PUNCT, '')).filter(Boolean);   // as displayed (with tashkil)
}

/* ---------- completely unknown words (intro skip) ---------- */
let SEEN_WORDS = {}, WORDC = new Map();
function sentWords(s){
  let w = WORDC.get(s.uid);
  if (!w){ w = [...new Set(wordsOfSentence(s).map(x=>noteNorm(x, s.lang)).filter(Boolean))]; WORDC.set(s.uid, w); }
  return w;
}
function addSeen(s){
  const set = SEEN_WORDS[s.lang] || (SEEN_WORDS[s.lang] = new Set());
  for (const w of sentWords(s)) set.add(w);
}
function rebuildSeen(){
  SEEN_WORDS = {}; WORDC = new Map();
  const last = lastMap();
  for (const s of BY_UID.values()) if (INTRO_SEEN[s.uid] || last.has(s.uid)) addSeen(s);
}
function noteCovers(w, lang){
  const ix = NOTE_IDX[lang]; if (!ix) return false;
  if (LG(lang).noSpace){ for (const a of ix.all) if (w.includes(a.np)) return true; return false; }
  if (ix.word.has(w)) return true;
  for (const a of ix.aff){
    const ty = a.type;
    if (ty === 'prefix' ? w.startsWith(a.np) : ty === 'suffix' ? w.endsWith(a.np) : w.includes(a.np)) return true;
  }
  for (const m of ix.multi) if (multiRanges(w, m.parts)) return true;
  return false;
}
// cheapest test first: seen before (O(1)) → word note (O(1)) → affix notes. One match is enough to make a word "known".
function unknownCount(s, limit){
  const seen = SEEN_WORDS[s.lang]; let n = 0;
  for (const w of sentWords(s)){
    if (seen && seen.has(w)) continue;
    if (noteCovers(w, s.lang)) continue;
    if (++n > limit) break;
  }
  return n;
}
function introThreshold(level){
  const t = INTRO_T;
  if (t.mode === 'manual'){ const v = t.manual[level]; return (v === undefined || v === null || v === '') ? t.other : +v; }
  if (t.mode === 'formula') return Math.max(0, Math.min(+t.max, Math.floor(+t.a + +t.b * (level - 1))));
  return +t.fixed;
}
function maxLevelAll(){ let m = 1; for (const c of Object.keys(EN_IDX)) m = Math.max(m, maxLevel(c)); return m; }

/* ---------- note view / editor ---------- */
function noteCtx(sent){
  let g = null;
  if (state.sess && state.sess.from === 'group'){ const cg = getGroup(state.gid); if (cg && cg.items.some(s=>s.uid === sent.uid)) g = cg; }
  if (!g) g = LIB.groups.find(gr=>gr.items.some(s=>s.uid === sent.uid)) || null;
  return { gid:g ? g.id : null, gname:g ? g.name : '', level:levelOfLen(sentLen(sent)), uid:sent.uid };
}
let NOTES_SHADOW = JSON.stringify(NOTES);       // notes as they were before the next edit (for undo)
function saveNotes(){
  const now = JSON.stringify(NOTES), before = NOTES_SHADOW;
  if (before !== now) undoPush('Notes', ()=>{ NOTES = JSON.parse(before); NOTES_SHADOW = before; saveLS(LS.notes, NOTES); buildNoteIdx(); }, 'edit');
  NOTES_SHADOW = now; saveLS(LS.notes, NOTES); buildNoteIdx();
}
function findNote(lang, pat){
  const sp = patSpec(pat, lang, null); if (!sp) return null;
  return NOTES.find(n=>{ if (n.lang !== lang) return false; const s = patSpec(n.text, n.lang, n.type); return s && s.key === sp.key; }) || null;
}
function openNoteView(ids){
  const list = ids.map(id=>NOTES.find(n=>n.id === id)).filter(Boolean);
  if (!list.length) return;
  openSheet((sh, close)=>{
    sh.innerHTML = `<h3>Note${list.length > 1 ? 's' : ''}</h3><div id="nvList"></div><div class="sheet-actions"><button class="btn btn-ghost" id="nvC">Close</button></div>`;
    const box = sh.querySelector('#nvList');
    list.forEach(n=>{
      const d = document.createElement('div'); d.className = 'nview';
      d.innerHTML = `<div class="nv-top"><b class="${flc(n.lang)}">${esc(notePat(n))}</b> ${tagsHTML(n.tags)}</div>
        <div class="nv-note">${n.note ? esc(n.note) : '<i>(no text)</i>'}</div>
        <div class="nv-meta">${esc(LG(n.lang).name)}${n.gname ? ' · ' + esc(n.gname) : ''}${n.level ? ' · Level ' + n.level : ''}</div>
        <div class="nv-actions"><button class="btn btn-ghost btn-sm" data-e>Edit</button><button class="btn btn-redg btn-sm" data-d>Delete</button></div>`;
      d.querySelector('[data-e]').onclick = ()=>{ close(); setTimeout(()=>openNoteEditor({ note:n }), 90); };
      d.querySelector('[data-d]').onclick = ()=>{
        if (!confirm('Delete this note?')) return;
        NOTES = NOTES.filter(x=>x.id !== n.id); saveNotes(); close(); render(true); toast('Note deleted');
      };
      box.appendChild(d);
    });
    sh.querySelector('#nvC').onclick = close;
  });
}
function openNoteEditor(o){
  o = o || {};
  const ex = o.note || null, sent = o.sent || null;
  let lang = ex ? ex.lang : (sent ? sent.lang : (o.lang || ACTIVE[0] || 'ar'));
  const tagSet = new Set(ex ? ex.tags || [] : []);
  openSheet((sh, close)=>{
    const codes = Object.keys(LANGS).sort((a,b)=>LANGS[a].name.localeCompare(LANGS[b].name));
    sh.innerHTML = `<h3>${ex ? 'Edit note' : 'Add note'}</h3>
      ${sent ? `<div id="nSrcBox" hidden><div class="hint">Take the word from</div><select class="field" id="nSrc"></select></div>
        <div class="hint" style="margin-top:8px">Tap a word. Then tap the first and last letter of the part you want. Need two parts of the same word (like both ends of ي-غادر-ون)? Press “＋ another part”.</div>
        <div class="npick ${flc(lang)}" id="nWords"></div><div class="nletters ${flc(lang)}" id="nLetters" hidden></div>
        <div id="nPartBtn" style="display:flex;gap:8px;margin:0 0 10px" hidden><button type="button" class="btn btn-ghost btn-sm" id="nMore">＋ another part</button><button type="button" class="btn btn-ghost btn-sm" id="nClr">Clear</button></div>` : ''}
      ${!sent && !ex ? `<div class="hint">Language</div><select class="field" id="nLang"><option value="en"${lang==='en'?' selected':''}>English</option>${codes.map(c=>`<option value="${c}"${c===lang?' selected':''}>${esc(LANGS[c].name)} — ${esc(LANGS[c].native)}</option>`).join('')}</select>` : ''}
      <div class="hint" style="margin-top:10px">Pattern</div>
      <input class="field ${flc(lang)}" id="nPat" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="hint" style="margin-top:6px">Write … for the part of the word that changes: <b>ال…</b> starts with · <b>…ات</b> ends with · <b>…كتب…</b> contains · <b>ي…ون</b> both ends. No … = the whole word.</div>
      <div class="hint" style="margin-top:10px">Note</div>
      <textarea class="field" id="nTxt" rows="3" placeholder="What does it mean / how is it used?"></textarea>
      <div class="hint" style="margin-top:10px">Tags</div>
      <div id="nChips" class="nchips"></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input class="field" id="nTagIn" placeholder="new tag" autocomplete="off" autocapitalize="off"><button class="btn btn-ghost btn-sm" id="nTagAdd">Add</button></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="nC">Cancel</button>
        ${ex ? '<button class="btn btn-redg" id="nDel">Delete</button>' : ''}
        <button class="btn btn-green" id="nOk">Save</button>
      </div>`;
    const q = s=>sh.querySelector(s);
    const patEl = q('#nPat'), txtEl = q('#nTxt');
    patEl.value = ex ? notePat(ex) : ''; txtEl.value = ex ? (ex.note || '') : '';

    const paintTags = ()=>{
      const box = q('#nChips'); box.innerHTML = '';
      const names = [...new Set([...tagSet, ...allTags(), ...PRESET_TAGS])];
      names.forEach(t=>{
        const b = document.createElement('button'); b.type = 'button'; b.className = 'tchip' + (tagSet.has(t) ? ' on' : ''); b.textContent = tagLabel(t);
        b.onclick = ()=>{ if (tagSet.has(t)) tagSet.delete(t); else tagSet.add(t); paintTags(); };
        box.appendChild(b);
      });
    };
    paintTags();
    const addTag = ()=>{ const v = q('#nTagIn').value.trim().toLowerCase(); if (v){ tagSet.add(v); q('#nTagIn').value = ''; paintTags(); } };
    q('#nTagAdd').onclick = addTag;
    q('#nTagIn').onkeydown = e=>{ if (e.key === 'Enter'){ e.preventDefault(); addTag(); } };

    const loadExisting = ()=>{      // a note for this exact pattern already exists: continue it instead of duplicating
      if (ex) return;
      const f = findNote(lang, patEl.value); if (!f) return;
      txtEl.value = f.note || ''; tagSet.clear(); (f.tags || []).forEach(t=>tagSet.add(t)); paintTags();
      toast('Existing note loaded');
    };
    if (q('#nLang')) q('#nLang').onchange = e=>{ lang = e.target.value; patEl.className = 'field ' + flc(lang); };

    if (sent){
      const wordsBox = q('#nWords'), letBox = q('#nLetters');
      let lets = [], ranges = [], cur = null;
      // texts of the card the word can come from: the sentence itself, the known side, the side translation
      const sources = [{ lang:sent.lang, label:LG(sent.lang).name + ' (the sentence)', words:()=>wordsOfSentence(sent) }];
      const kk = kn(sent);
      sources.push({ lang:kk.lang, label:LG(kk.lang).name + ' (shown translation)', words:()=>wordsOfText(knText(sent), kk.lang) });
      const sdd = sideOf(sent);
      if (sdd && !sdd.miss && sdd.lang !== kk.lang) sources.push({ lang:sdd.lang, label:LG(sdd.lang).name + ' (side translation)', words:()=>wordsOfText(sdd.sent ? displayFl(sdd.sent) : sdd.text, sdd.lang) });
      let srcI = Math.max(0, sources.findIndex(x=>x.lang === lang));
      const curR = ()=>cur ? [Math.min(cur[0], cur[1]), Math.max(cur[0], cur[1])] : null;
      const allR = ()=>{ const r = ranges.slice(); const c = curR(); if (c) r.push(c); return r.sort((a, b)=>a[0] - b[0]); };
      const buildPattern = ()=>{
        const rs = allR(); if (!rs.length) return '';
        const n = lets.length, segs = rs.map(r=>lets.slice(r[0], r[1] + 1).join(''));
        const a = rs[0][0], z = rs[rs.length - 1][1];
        if (rs.length > 1) return (a > 0 ? '…' : '') + segs.join('…') + (z < n - 1 ? '…' : '');
        const seg = segs[0];
        if (a === 0 && z === n - 1) return seg;
        const head = lets.slice(0, a).join(''), tail = lets.slice(z + 1).join('');
        if (a > 0 && z === n - 1) return findNote(lang, head + '…') ? seg                       // the word after a known prefix is just the word
          : seg.length >= 3 ? '…' + seg + '…' : '…' + seg;
        if (a === 0) return findNote(lang, '…' + tail) ? seg
          : seg.length >= 3 ? '…' + seg + '…' : seg + '…';
        return '…' + seg + '…';
      };
      const paintLetters = ()=>{
        letBox.innerHTML = '';
        const rs = allR();
        lets.forEach((l, i)=>{
          const b = document.createElement('button'); b.type = 'button';
          b.className = 'nletter' + (rs.some(r=>i >= r[0] && i <= r[1]) ? ' on' : ''); b.textContent = l;
          b.onclick = ()=>{
            const hit = ranges.findIndex(r=>i >= r[0] && i <= r[1]);
            if (hit >= 0){ ranges.splice(hit, 1); }
            else {
              const next = (cur === null || cur[0] !== cur[1]) ? [i, i] : [cur[0], i];
              const lo = Math.min(next[0], next[1]), hi = Math.max(next[0], next[1]);
              if (ranges.some(r=>lo <= r[1] && hi >= r[0])){ toast('Parts cannot overlap'); return; }
              cur = next;
            }
            patEl.value = buildPattern(); paintLetters(); loadExisting();
          };
          letBox.appendChild(b);
        });
        q('#nPartBtn').hidden = !lets.length;
      };
      const paintWords = ()=>{
        wordsBox.innerHTML = ''; wordsBox.className = 'npick ' + flc(lang); letBox.className = 'nletters ' + flc(lang); letBox.hidden = true; q('#nPartBtn').hidden = true;
        sources[srcI].words().forEach(w=>{
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip flat ' + flc(lang);
          b.textContent = displayWord(w, lang);
          b.onclick = ()=>{
            lets = alignText(w, lang).info.filter(i=>i.n).map(i=>i.n);
            ranges = []; cur = [0, lets.length - 1];
            patEl.value = buildPattern(); letBox.hidden = false; paintLetters(); loadExisting();
          };
          wordsBox.appendChild(b);
        });
      };
      q('#nMore').onclick = ()=>{ const c = curR(); if (c){ ranges.push(c); cur = null; paintLetters(); toast('Tap the letters of the next part'); } };
      q('#nClr').onclick = ()=>{ ranges = []; cur = null; patEl.value = ''; paintLetters(); };
      const srcSel = q('#nSrc');
      if (srcSel && sources.length > 1){
        q('#nSrcBox').hidden = false;
        srcSel.innerHTML = sources.map((x, i)=>`<option value="${i}">${esc(x.label)}</option>`).join('');
        srcSel.value = String(srcI);
        srcSel.onchange = ()=>{ srcI = +srcSel.value; lang = sources[srcI].lang; patEl.className = 'field ' + flc(lang); patEl.value = ''; paintWords(); };
      }
      lang = sources[srcI].lang; patEl.className = 'field ' + flc(lang);
      paintWords();
    }

    q('#nC').onclick = close;
    if (q('#nDel')) q('#nDel').onclick = ()=>{
      if (!confirm('Delete this note?')) return;
      NOTES = NOTES.filter(x=>x.id !== ex.id); saveNotes(); close(); render(true); toast('Note deleted');
    };
    q('#nOk').onclick = ()=>{
      const pat = patEl.value.trim(), sp = patSpec(pat, lang, null);
      if (!sp){ toast('Enter a pattern first'); return; }
      let n = ex || findNote(lang, pat);
      if (n){ n.text = pat; n.type = sp.kind; n.note = txtEl.value.trim(); n.tags = [...tagSet]; }
      else {
        n = Object.assign({ id:nid(), lang, type:sp.kind, text:pat, note:txtEl.value.trim(), tags:[...tagSet], created:Date.now() }, sent ? noteCtx(sent) : {});
        NOTES.push(n);
      }
      saveNotes(); close();
      if (state.screen === 'notes') paintNotes && paintNotes();
      render(true); toast('Note saved ✓');
    };
  });
}

}

  d.querySelector('#cssApply').onclick = ()=>{

    const err = check(css); if (err){ msg.textContent = '⚠ ' + err + ' — not applied.'; return; }
    CUSTOM_CSS = css; saveLS(LS.css, CUSTOM_CSS); applyCustomCss(); msg.textContent = css.trim() ? 'Applied ✓' : 'Empty — nothing applied.';
  };

}

let DEBUG_ON = loadLS(LS.debug, false);
let DBG_LOG = [];        // newest last, capped at 300
let DBG_CARD = null;     // facts about the card on screen: { intro, pick, type }
let TYPE_WHY = null;     // how the exercise type of the current card was chosen

const DBG_KIND = {
  new:   'new sentence of the current level pass',
  rev:   'review of a sentence met before (mistakes first, then known ones)',
  retry: 'retry of a wrong answer (same exercise type as the mistake)',
  free:  'free practice (shuffled round)',
  srs:   'spaced review (Anki mode): this sentence is due',
};
function dbg(kind, msg, data){
  if (!DEBUG_ON) return;
  DBG_LOG.push({ t:Date.now(), n:(state.sess ? state.session : 0), kind, msg, data:data === undefined ? null : data });
  if (DBG_LOG.length > 300) DBG_LOG.shift();
}
function short(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function cardKind(c){ return c.kind || (c.forced ? 'retry' : 'free'); }

// Why the introduction card is shown or skipped (pure: no side effects, unlike needsIntro)
function introInfo(sent){
  if (TYPE_ON.intro === false) return { show:false, why:'intro cards are turned off in Settings' };
  if (INTRO_SEEN[sent.uid]) return { show:false, why:'already introduced earlier' };
  const level = levelOfLen(sentLen(sent)), thr = introThreshold(level);
  const seen = SEEN_WORDS[sent.lang], unknown = [], known = [];
  for (const w of sentWords(sent)){
    if (seen && seen.has(w)) known.push(w + ' (seen before)');
    else if (noteCovers(w, sent.lang)) known.push(w + ' (note)');
    else unknown.push(w);
  }
  const show = unknown.length > thr;
  return { show, level, thr, unknown, known,
    why: show ? unknown.length + ' completely unknown word(s) > threshold ' + thr + ' → intro card shown'
              : unknown.length + ' completely unknown word(s) ≤ threshold ' + thr + ' → intro card skipped' };
}

  } else out.push('no session running');
  if (ANKI_ON){ const c = srsDueCounts(null, Date.now()), n = Object.keys(srsStore().cards).length; out.push('anki: ON · cards ' + n + ' · due reviews ' + c.review + ' · learning ' + c.learning); }
  return out.join('\n');
}

/* ====================================================================
   SRS (Anki-style) — data model + scheduler. Pure functions first, storage last.
   Unit = sentence (its uid). Two ratings: 'again' (wrong) and 'good' (right).
   Card: { st:'l'|'r'|'x', step, due(ms), iv(days), ease, reps, lapses, last, leech? }
     l = learning · r = review · x = relearning (after a lapse)
   Nothing here touches the DOM; the app does not use it until the Anki toggle exists.
   ==================================================================== */
Object.assign(LS, { srs:'arTrainer:srs' });
const SRS_MIN = 60000, SRS_DAY = 86400000;
const SRS_DEF = {
  learnSteps:[1, 10],     // minutes
  relearnSteps:[10],      // minutes, after a lapse
  graduate:1,             // days, first review interval
  startEase:2.5,
  ivMod:1,                // interval modifier
  maxIv:36500,            // days
  lapseIv:0,              // share of the old interval kept after a lapse (0 = back to the minimum)
  minIv:1,                // days
  leech:8,                // lapses before a card is flagged
  newPerDay:20,
  revPerDay:200,
  rollover:4,             // hour at which a new "Anki day" starts
};

/* ---------- options ---------- */
function srsNum(v, d, lo, hi){ v = +v; return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; }
function srsSteps(v, d){
  if (!Array.isArray(v)) return d.slice();
  const a = v.map(Number).filter(x=>isFinite(x) && x > 0);
  return (a.length || v.length === 0) ? a : d.slice();        // [] = no steps; only invalid entries = default
}
function srsOpts(o){
  o = o || {};
  return {
    learnSteps: srsSteps(o.learnSteps, SRS_DEF.learnSteps),
    relearnSteps: srsSteps(o.relearnSteps, SRS_DEF.relearnSteps),
    graduate: Math.round(srsNum(o.graduate, SRS_DEF.graduate, 1, 365)),
    startEase: srsNum(o.startEase, SRS_DEF.startEase, 1.3, 5),
    ivMod: srsNum(o.ivMod, SRS_DEF.ivMod, 0.5, 2),
    maxIv: Math.round(srsNum(o.maxIv, SRS_DEF.maxIv, 1, 36500)),
    lapseIv: srsNum(o.lapseIv, SRS_DEF.lapseIv, 0, 1),
    minIv: Math.round(srsNum(o.minIv, SRS_DEF.minIv, 1, 365)),
    leech: Math.round(srsNum(o.leech, SRS_DEF.leech, 1, 99)),
    newPerDay: Math.round(srsNum(o.newPerDay, SRS_DEF.newPerDay, 0, 9999)),
    revPerDay: Math.round(srsNum(o.revPerDay, SRS_DEF.revPerDay, 0, 9999)),
    rollover: Math.round(srsNum(o.rollover, SRS_DEF.rollover, 0, 23)),
  };
}

/* ---------- days ---------- */
function srsDayStart(now, rollover){
  const d = new Date(now); d.setHours(rollover, 0, 0, 0);
  if (d.getTime() > now) d.setDate(d.getDate() - 1);
  return d.getTime();
}
function srsAddDays(ms, n, rollover){ const d = new Date(ms); d.setDate(d.getDate() + n); d.setHours(rollover, 0, 0, 0); return d.getTime(); }

/* ---------- the scheduler (pure: never changes its input) ---------- */
function srsSchedule(card, rating, now, opts){
  const o = srsOpts(opts), good = rating === 'good' || rating === true || rating === 3;
  const c = card ? Object.assign({}, card) : { st:'l', step:0, due:now, iv:0, ease:o.startEase, reps:0, lapses:0, last:0 };
  const day0 = srsDayStart(now, o.rollover);
  const toReview = iv=>{
    c.st = 'r'; c.step = 0;
    c.iv = Math.max(o.minIv, Math.min(o.maxIv, Math.round(iv)));
    c.due = srsAddDays(day0, c.iv, o.rollover);
  };
  if (c.st === 'l' || c.st === 'x'){
    const steps = c.st === 'l' ? o.learnSteps : o.relearnSteps;
    if (!good){
      c.step = 0;
      if (steps.length) c.due = now + steps[0] * SRS_MIN; else toReview(c.st === 'x' ? c.iv : o.graduate);
    } else if (c.step + 1 < steps.length){
      c.step++; c.due = now + steps[c.step] * SRS_MIN;
    } else toReview(c.st === 'x' ? c.iv : o.graduate);
  } else if (good){
    toReview(Math.max(c.iv + 1, c.iv * c.ease * o.ivMod));
  } else {
    c.lapses++;
    c.ease = Math.max(1.3, +(c.ease - 0.2).toFixed(2));
    c.iv = Math.max(o.minIv, Math.min(o.maxIv, Math.round(c.iv * o.lapseIv)));
    c.st = 'x'; c.step = 0;
    if (o.relearnSteps.length) c.due = now + o.relearnSteps[0] * SRS_MIN; else toReview(c.iv);
    if (c.lapses >= o.leech) c.leech = true;
  }
  c.reps++; c.last = now;
  return c;
}
function srsIsDue(c, now, opts){
  if (!c) return false;
  const o = srsOpts(opts);
  if (c.st === 'r') return c.due < srsAddDays(srsDayStart(now, o.rollover), 1, o.rollover);   // review cards are due by day
  return c.due <= now;                                                                         // learning cards by the minute
}
function srsPreview(card, now, opts){
  return { again: srsSchedule(card, 'again', now, opts).due - now, good: srsSchedule(card, 'good', now, opts).due - now };
}
function srsFmt(ms){
  if (ms < SRS_MIN) return '<1m';
  if (ms < 3600000) return Math.round(ms / SRS_MIN) + 'm';
  if (ms < SRS_DAY) return Math.round(ms / 3600000) + 'h';
  if (ms < 30 * SRS_DAY) return Math.round(ms / SRS_DAY) + 'd';
  if (ms < 365 * SRS_DAY) return (ms / (30.4 * SRS_DAY)).toFixed(1).replace(/\.0$/, '') + 'mo';
  return (ms / (365 * SRS_DAY)).toFixed(1).replace(/\.0$/, '') + 'y';
}

/* ---------- daily counters and due lists (store = { cards:{uid:card}, day:{d,n,r}|null }) ---------- */
function srsRoll(store, now, opts){
  const d = srsDayStart(now, srsOpts(opts).rollover);
  if (!store.day || store.day.d !== d) store.day = { d, n:0, r:0, k:{} };
  if (!store.day.k) store.day.k = {};
  return store.day;
}
function srsCounts(store, now, opts){
  const o = srsOpts(opts), t = srsRoll(store, now, o);
  let learning = 0, review = 0;
  for (const uid of Object.keys(store.cards)){
    const c = store.cards[uid];
    if (!srsIsDue(c, now, o)) continue;
    if (c.st === 'r') review++; else learning++;
  }
  return { learning, review, newDone:t.n, revDone:t.r, newLeft:Math.max(0, o.newPerDay - t.n), revLeft:Math.max(0, o.revPerDay - t.r) };
}
// learning cards first (by time), then reviews (by due, oldest first), reviews capped by what is left of today's limit
function srsDueList(store, now, opts, filter){
  const o = srsOpts(opts), left = Math.max(0, o.revPerDay - srsRoll(store, now, o).r);
  const learn = [], rev = [];
  for (const uid of Object.keys(store.cards)){
    if (filter && !filter(uid)) continue;
    const c = store.cards[uid];
    if (!srsIsDue(c, now, o)) continue;
    (c.st === 'r' ? rev : learn).push({ uid, card:c, kind:c.st === 'r' ? 'review' : 'learn' });
  }
  const by = (a, b)=>(a.card.due - b.card.due) || (a.uid < b.uid ? -1 : 1);
  return learn.sort(by).concat(rev.sort(by).slice(0, left));
}

/* ---------- storage (runs only when called) ---------- */
let SRS = null;
function srsLoad(){
  let s = null; try { s = loadLS(LS.srs, null); } catch(e){}
  if (!s || typeof s !== 'object' || !s.cards || typeof s.cards !== 'object') s = { v:1, cards:{}, day:null };
  if (s.day === undefined) s.day = null;
  return s;
}
function srsStore(){ if (!SRS) SRS = srsLoad(); return SRS; }
function srsSave(){ if (SRS) saveLS(LS.srs, SRS); }
// Record one answer for a sentence; counts toward today's new / review limits; saves immediately.
function srsAnswer(uid, correct, now, opts){
  const st = srsStore(), t = now || Date.now(), o = srsOpts(opts || (typeof LIB !== 'undefined' ? srsOptsFor(uid) : null));
  const prev = st.cards[uid] || null, day = srsRoll(st, t, o), dk = srsDeckDay(st, srsDeckKey(uid), t, o);
  if (!prev){ day.n++; dk.n++; } else if (prev.st === 'r'){ day.r++; dk.r++; }
  st.cards[uid] = srsSchedule(prev, correct ? 'good' : 'again', t, o);
  srsSave();
  return st.cards[uid];
}
// a sentence changed language (uid prefix changed): keep its card
function srsRemap(map){
  const st = srsStore(); let ch = false;
  for (const k of Object.keys(map)){
    if (!st.cards[k]) continue;
    if (!st.cards[map[k]]) st.cards[map[k]] = st.cards[k];
    delete st.cards[k]; ch = true;
  }
  if (ch) srsSave();
}

/* ---------- decks (= groups) and presets ---------- */
// A preset holds the options of Anki's "deck options". A group points to one (group.preset, default 'default').
// The options of a sentence = the preset of the first group that contains it. Daily limits count per group.
let SRS_PRESETS = null, GROUP_OF = null;
function srsPresets(){
  if (!SRS_PRESETS){
    let p = null; try { p = loadLS(LS.srsPresets, null); } catch(e){}
    if (!p || typeof p !== 'object' || !p.default) p = { default:{ name:'Default', o:{} } };
    SRS_PRESETS = p; PRESETS_SHADOW = JSON.stringify(p);
  }
  return SRS_PRESETS;
}
let PRESETS_SHADOW = null;
function srsSavePresets(){
  if (!SRS_PRESETS) return;
  const now = JSON.stringify(SRS_PRESETS);
  if (PRESETS_SHADOW !== null && PRESETS_SHADOW !== now){
    const before = PRESETS_SHADOW;
    undoPush('Deck options', ()=>{ SRS_PRESETS = JSON.parse(before); PRESETS_SHADOW = before; saveLS(LS.srsPresets, SRS_PRESETS); }, 'edit');
  }
  PRESETS_SHADOW = now; saveLS(LS.srsPresets, SRS_PRESETS);
}
function srsGroupOf(uid){
  if (typeof LIB === 'undefined') return null;
  if (!GROUP_OF){ GROUP_OF = new Map(); for (const g of LIB.groups) for (const x of g.items) if (!GROUP_OF.has(x.uid)) GROUP_OF.set(x.uid, g); }
  return GROUP_OF.get(uid) || null;
}
function srsDeckKey(uid){ const g = srsGroupOf(uid); return g ? g.id : ''; }
function srsOptsFor(uid){
  const g = srsGroupOf(uid), P = srsPresets();
  return srsOpts(((g && g.preset && P[g.preset]) || P.default).o);
}
function srsDeckDay(store, key, now, opts){ const day = srsRoll(store, now, opts); return day.k[key] || (day.k[key] = { n:0, r:0 }); }

/* ---------- what the lesson needs from the scheduler ---------- */
// a sentence starts today (first pass of a level chunk): counts against the deck's new-per-day limit
function srsNoteNew(uid, now){
  const st = srsStore(), t = now || Date.now(), o = srsOptsFor(uid), day = srsRoll(st, t, o), dk = srsDeckDay(st, srsDeckKey(uid), t, o);
  day.n++; dk.n++; srsSave();
}
function srsNewLeft(uid, now){
  const o = srsOptsFor(uid);
  return Math.max(0, o.newPerDay - srsDeckDay(srsStore(), srsDeckKey(uid), now || Date.now(), o).n);
}
// a sentence finished its level cycle: it enters spaced review (right: first review tomorrow; wrong: learning steps)
function srsGraduate(uid, correct, now){
  const st = srsStore(); if (st.cards[uid]) return st.cards[uid];
  const t = now || Date.now(), o = srsOptsFor(uid);
  st.cards[uid] = correct
    ? { st:'r', step:0, due:srsAddDays(srsDayStart(t, o.rollover), o.graduate, o.rollover), iv:o.graduate, ease:o.startEase, reps:1, lapses:0, last:t }
    : srsSchedule(null, 'again', t, o);
  srsSave(); return st.cards[uid];
}
// next card to review for a language: learning cards first, then reviews within each deck's daily limit
function srsNextDue(lang, now, skip){
  const st = srsStore(), t = now || Date.now(), learn = [], rev = [];
  for (const uid of Object.keys(st.cards)){
    const sent = BY_UID.get(uid); if (!sent || sent.lang !== lang || (skip && skip.has(uid))) continue;
    const c = st.cards[uid], o = srsOptsFor(uid);
    if (!srsIsDue(c, t, o)) continue;
    if (c.st === 'r'){ if (srsDeckDay(st, srsDeckKey(uid), t, o).r >= o.revPerDay) continue; rev.push({ uid, card:c }); }
    else learn.push({ uid, card:c });
  }
  const by = (a, b)=>(a.card.due - b.card.due) || (a.uid < b.uid ? -1 : 1);
  learn.sort(by); rev.sort(by);
  return learn[0] || rev[0] || null;
}
function srsDueCounts(lang, now){
  const st = srsStore(), t = now || Date.now(); let learning = 0, review = 0;
  for (const uid of Object.keys(st.cards)){
    const sent = BY_UID.get(uid); if (!sent || (lang && sent.lang !== lang)) continue;
    const c = st.cards[uid], o = srsOptsFor(uid);
    if (!srsIsDue(c, t, o)) continue;
    if (c.st === 'r'){ if (srsDeckDay(st, srsDeckKey(uid), t, o).r < o.revPerDay) review++; } else learning++;
  }
  return { learning, review };
}
function srsNextLearnIn(lang, now){      // ms until the next learning card of the language comes due (null = none)
  const st = srsStore(), t = now || Date.now(); let best = null;
  for (const uid of Object.keys(st.cards)){
    const sent = BY_UID.get(uid), c = st.cards[uid];
    if (!sent || sent.lang !== lang || c.st === 'r') continue;
    const d = Math.max(0, c.due - t); if (best === null || d < best) best = d;
  }
  return best;
}
/* ====================================================================
   ANKI UI — button previews, Settings section, deck options page (presets per group).
   The scheduler itself lives in part4.js; the engine hooks are in part2b.js (nextCard) and part2c.js (rate).
   ==================================================================== */
const SRS_FIELDS = [
  { k:'newPerDay',   label:'New sentences / day',               get:o=>o.newPerDay,                 set:v=>({ newPerDay:v }) },
  { k:'revPerDay',   label:'Maximum reviews / day',             get:o=>o.revPerDay,                 set:v=>({ revPerDay:v }) },
  { k:'learnSteps',  label:'Learning steps (minutes)',          get:o=>o.learnSteps.join(' '),      set:v=>({ learnSteps:v }),   steps:true },
  { k:'graduate',    label:'Graduating interval (days)',        get:o=>o.graduate,                  set:v=>({ graduate:v }) },
  { k:'startEase',   label:'Starting ease (%)',                 get:o=>Math.round(o.startEase*100), set:v=>({ startEase:v/100 }) },
  { k:'ivMod',       label:'Interval modifier (%)',             get:o=>Math.round(o.ivMod*100),     set:v=>({ ivMod:v/100 }) },
  { k:'maxIv',       label:'Maximum interval (days)',           get:o=>o.maxIv,                     set:v=>({ maxIv:v }) },
  { k:'relearnSteps',label:'Relearning steps (minutes)',        get:o=>o.relearnSteps.join(' '),    set:v=>({ relearnSteps:v }), steps:true },
  { k:'lapseIv',     label:'New interval after a lapse (%)',    get:o=>Math.round(o.lapseIv*100),   set:v=>({ lapseIv:v/100 }) },
];

// "Again 10m / Good 3d" for the card on screen (only cards the scheduler will record)
function ankiPreview(){
  const s = state.sess, c = state.cur;
  if (!ankiActive(s) || !c) return null;
  const uid = c.sent.uid, o = srsOptsFor(uid), card = srsStore().cards[uid];
  if (c.kind === 'srs' && card){ const pv = srsPreview(card, Date.now(), o); return { again:srsFmt(pv.again), good:srsFmt(pv.good) }; }
  if (c.kind === 'new' && lv(s.lang).sub === 2 && !card)
    return { again:o.learnSteps.length ? srsFmt(o.learnSteps[0] * SRS_MIN) : srsFmt(o.graduate * SRS_DAY), good:srsFmt(o.graduate * SRS_DAY) };
  return null;
}

/* ====================================================================
   UNDO (one stack for everything) + TRANSLATION OVERRIDES (editor).
   Undo entries: { label, fn, kind }  kind 'answer' = a lesson answer, 'lib' = library change, 'edit' = anything else.
   ==================================================================== */
const UNDO = [], REDO = [];
let UNDOING = false, REDOING = false;
function undoPush(label, fn, kind){
  if (UNDOING) return;
  if (!REDOING) REDO.length = 0;                       // a new action ends the redo history
  UNDO.push({ label, fn, kind:kind || 'edit' });
  if (UNDO.length > 30) UNDO.shift();
}
function undoDropAnswers(){ for (let i = UNDO.length - 1; i >= 0; i--) if (UNDO[i].kind === 'answer') UNDO.splice(i, 1); for (let i = REDO.length - 1; i >= 0; i--) if (REDO[i].kind === 'answer') REDO.splice(i, 1); }
// everything the non-answer undo entries can touch, so that a redo can put it back
function worldSnap(){
  return { ovr:JSON.stringify(OVR), notes:JSON.stringify(NOTES), presets:JSON.stringify(SRS_PRESETS), groups:JSON.stringify(LIB.groups),
    active:ACTIVE.slice(), flags:JSON.stringify(FLAGS), stats:JSON.stringify(STATS), att:JSON.stringify(ATTEMPTS) };
}
function worldSet(w){
  OVR = JSON.parse(w.ovr); saveLS(LS.ovr, OVR);
  NOTES = JSON.parse(w.notes); NOTES_SHADOW = w.notes; saveLS(LS.notes, NOTES); buildNoteIdx();
  SRS_PRESETS = JSON.parse(w.presets); PRESETS_SHADOW = w.presets; if (SRS_PRESETS) saveLS(LS.srsPresets, SRS_PRESETS);
  FLAGS = JSON.parse(w.flags); saveFlags(); STATS = JSON.parse(w.stats); saveStats(); ATTEMPTS = JSON.parse(w.att); saveAttempts();
  if (JSON.stringify(LIB.groups) !== w.groups){ LIB.groups = JSON.parse(w.groups); ACTIVE = w.active.slice(); saveLS(LS.langs, ACTIVE); afterLibChange({ skipUndo:true }); }
}
function undoPop(){
  const e = UNDO.pop(); if (!e) return false;
  let redo = null;
  if (e.kind === 'answer'){ if (e.redo) redo = { label:e.label, kind:'answer', fn:e.redo }; }
  else { const w = worldSnap(); redo = { label:e.label, kind:e.kind, fn:()=>worldSet(w) }; }
  if (redo) REDO.push(redo);                           // before e.fn(), because that may already redraw the screen
  UNDOING = true;
  try { e.fn(); } catch(err){ console.error(err); } finally { UNDOING = false; }
  dbg('undo', 'undone: ' + e.label);
  toast('Undone: ' + e.label);
  if (e.kind !== 'answer') render(true);
  return true;
}
function redoPop(){
  const e = REDO.pop(); if (!e) return false;
  if (e.kind === 'answer' && (state.screen !== 'lesson' || !state.sess)){ return false; }
  const w = e.kind === 'answer' ? null : worldSnap();
  REDOING = true;
  try { e.fn(); } catch(err){ console.error(err); } finally { REDOING = false; }
  if (w) UNDO.push({ label:e.label, fn:()=>worldSet(w), kind:e.kind });
  toast('Redone: ' + e.label);
  if (e.kind !== 'answer') render(true);
  return true;
}
// the ↶ ↷ buttons sit in the top bar of every screen (lessons included) while there is something to undo / redo
function decorateUndo(){
  if (!UNDO.length && !REDO.length) return;
  const tb = app.querySelector('.topbar'); if (!tb) return;
  if (UNDO.length){
    const b = document.createElement('button');
    b.className = 'iconbtn undobtn'; b.id = 'undoBtn'; b.textContent = '↶';
    b.title = 'Undo: ' + UNDO[UNDO.length - 1].label; b.onclick = undoPop; tb.appendChild(b);
  }
  if (REDO.length){
    const b = document.createElement('button');
    b.className = 'iconbtn undobtn'; b.id = 'redoBtn'; b.textContent = '↷';
    b.title = 'Redo: ' + REDO[REDO.length - 1].label; b.onclick = redoPop; tb.appendChild(b);
  }
}

/* ---------- library: a structural shadow of the library as it was before the next change ---------- */
let LIB_SHADOW = null, ACTIVE_SHADOW = null;
function libSnap(){ return LIB.groups.map(g=>Object.assign({}, g, { items:g.items.slice() })); }
function libShadowRefresh(){ LIB_SHADOW = libSnap(); ACTIVE_SHADOW = ACTIVE.slice(); }
function libUndoPush(label){
  if (!LIB_SHADOW) return;
  const before = LIB_SHADOW, active = (ACTIVE_SHADOW || ACTIVE).slice();
  undoPush(label, ()=>{
    LIB.groups = before; ACTIVE = active; saveLS(LS.langs, ACTIVE);
    afterLibChange({ skipUndo:true });
  }, 'lib');
}

function undoCapture(){

}
function undoRestoreAnswer(sn){
  const s = sn.s;
  if (state.sess !== s || state.screen !== 'lesson') return;          // the session is gone
  if (ATTEMPTS.length > sn.aLen) ATTEMPTS.length = sn.aLen;

  s.round = sn.round; s.roundDone = sn.roundDone; s.complete = sn.complete;
  if (sn.level){ LEVELS[s.lang] = JSON.parse(sn.level); saveLS(LS.levels, LEVELS); }
  if (sn.srs){
    const st = srsStore();
    if (sn.srs.card) st.cards[sn.srs.uid] = JSON.parse(sn.srs.card); else delete st.cards[sn.srs.uid];
    st.day = JSON.parse(sn.srs.day); srsSave();
  }
  state.cur = sn.cur; state.ex = sn.ex; prepareAnswer(); state.flagged = sn.flagged;   // back to the same question, unanswered
  sessPersist(Object.assign({}, state.cur, { typ:state.ex.type !== 'intro' ? state.ex.type : '' }));
  render();
}

/* ---------- translation overrides ---------- */
function ovrRemap(map){
  let ch = false;
  for (const k of Object.keys(map)) if (OVR[k]){ OVR[map[k]] = OVR[k]; delete OVR[k]; ch = true; }
  if (ch) saveLS(LS.ovr, OVR);
}
function langName(l){ return l === 'en' ? 'English' : LG(l).name; }
// the texts the user sees beside / instead of English for a sentence, as the library has them
function transSlots(s){
  const kl = (KNOWN === 'en' || s.lang === KNOWN) ? 'en' : KNOWN;
  const libOf = lang => lang === 'en' ? s.english : ((c)=>c ? c.target : '')(counterpart(s, lang));
  const slots = [{ lang:kl, role:'shown', lib:libOf(kl) }];
  if (SIDE && SIDE !== kl && SIDE !== s.lang) slots.push({ lang:SIDE, role:'side', lib:libOf(SIDE) });
  return slots;
}
function refreshAfterOvr(uid){
  if (state.screen === 'lesson' && state.cur && state.cur.sent.uid === uid && state.ex && state.ex.type !== 'intro'){
    const e = buildExercise(state.cur.sent, lang_pool(state.cur.sent.lang), state.ex.type);   // texts, options and the correct answer are rebuilt
    if (e){ state.ex = e; prepareAnswer(); }
  }
  render(true);
}
function ovrApply(s, mutate, label){
  const prev = JSON.stringify(OVR[s.uid] || null), o = Object.assign({}, OVR[s.uid]);
  mutate(o);
  if (Object.keys(o).length) OVR[s.uid] = o; else delete OVR[s.uid];
  saveLS(LS.ovr, OVR);
  const changed = prev !== JSON.stringify(OVR[s.uid] || null);
  if (changed) undoPush(label + ' · ' + short(s.target, 18), ()=>{
    if (prev === 'null') delete OVR[s.uid]; else OVR[s.uid] = JSON.parse(prev);
    saveLS(LS.ovr, OVR); refreshAfterOvr(s.uid);
  }, 'edit');
  return changed;
}
function openTransEditor(s){
  const slots = transSlots(s);
  openSheet((sh, close)=>{
    sh.innerHTML = `<h3>Edit translation</h3>
      <div class="hint">Only for this sentence, while you practise ${esc(LG(s.lang).name)}. The library text is not changed.</div>
      <div class="${flc(s.lang)}" style="font-size:20px;font-weight:800;margin-bottom:10px">${esc(s.target)}</div><div id="trSlots"></div>
      <div class="sheet-actions"><button class="btn btn-ghost" id="trC">Cancel</button><button class="btn btn-ghost" id="trR">Use library text</button><button class="btn btn-green" id="trOk">Save</button></div>`;
    const box = sh.querySelector('#trSlots'), tas = [];
    slots.forEach(sl=>{
      const cur = ovrOf(s, sl.lang), d = document.createElement('div'); d.style.marginBottom = '10px';
      d.innerHTML = `<div class="hint" style="margin-bottom:4px">${esc(langName(sl.lang))} (${sl.role === 'side' ? 'side translation' : 'shown'})${cur !== null ? ' · edited' : ''}${sl.lib ? '' : ' · none in the library, write one'}</div>
        <textarea class="field ${sl.lang === 'en' ? '' : flc(sl.lang)}" dir="auto" rows="2"></textarea>`;
      const ta = d.querySelector('textarea'); ta.value = cur !== null ? cur : sl.lib; tas.push(ta);
      box.appendChild(d);
    });
    sh.querySelector('#trC').onclick = close;
    sh.querySelector('#trR').onclick = ()=>{
      const ch = ovrApply(s, o=>slots.forEach(sl=>{ delete o[sl.lang]; }), 'Translation');
      close(); refreshAfterOvr(s.uid); toast(ch ? 'Library text restored' : 'Nothing was edited');
    };
    sh.querySelector('#trOk').onclick = ()=>{
      const ch = ovrApply(s, o=>slots.forEach((sl, i)=>{
        const v = tas[i].value.trim();
        if (!v || v === sl.lib) delete o[sl.lang]; else o[sl.lang] = v;
      }), 'Translation');
      close(); refreshAfterOvr(s.uid); toast(ch ? 'Translation updated' : 'No change');
    };
    setTimeout(()=>{ if (tas[0]) tas[0].focus(); }, 30);
  });
}
